/* ============================================================================
   CUPI Wiki — the internal knowledge base, drawn in the site's own language:
   white page, near-black ink, hairline rules, frosted glass chrome, standard
   system faces, and restraint everywhere else. Carnelian appears
   only as a functional signal (destructive actions, unsaved state), never as
   decoration.
   ========================================================================== */

:root {
  /* Light (default) — matches the site's inverted theme exactly. */
  --page: #ffffff;
  --box-radius: 6px;
  --fg: #141414;
  --fg-rgb: 20, 20, 20;
  --page-rgb: 255, 255, 255;
  --muted: rgba(0, 0, 0, 0.66);
  --faint: rgba(0, 0, 0, 0.54);
  --hairline: rgba(0, 0, 0, 0.12);
  --rule: rgba(0, 0, 0, 0.3);
  --hover: rgba(0, 0, 0, 0.05);
  --press: rgba(0, 0, 0, 0.08);
  --selected: rgba(0, 0, 0, 0.065);
  --code-bg: rgba(0, 0, 0, 0.05);
  --glass: rgba(255, 255, 255, 0.72);
  --veil: rgba(255, 255, 255, 0.6);
  --pop: #ffffff;
  --pop-shadow: 0 10px 40px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.08);
  --accent: #b31b1b;            /* Cornell carnelian, functional only */
  --accent-soft: rgba(179, 27, 27, 0.09);
  --mirror-hl: rgba(0, 0, 0, 0.1);
  --good: #1a7f37;
  --good-bg: rgba(26, 127, 55, 0.1);
  --diff-add-hl: rgba(26, 127, 55, 0.26);
  --diff-del-hl: rgba(207, 34, 46, 0.26);
  --bad: #cf222e;
  --bad-bg: rgba(207, 34, 46, 0.1);
  --img-outline: rgba(0, 0, 0, 0.1);
  --font-ui: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-label: var(--font-ui);
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-display: 'Playfair Display', Georgia, serif;
  --radius: 6px;
  --radius-bar: 10px;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --page: #000000;
    --fg: #e8e8e8;
    --fg-rgb: 232, 232, 232;
    --page-rgb: 0, 0, 0;
    --muted: rgba(255, 255, 255, 0.55);
    --faint: rgba(255, 255, 255, 0.46);
    --hairline: rgba(255, 255, 255, 0.12);
    --rule: rgba(255, 255, 255, 0.3);
    --hover: rgba(255, 255, 255, 0.07);
    --press: rgba(255, 255, 255, 0.11);
    --selected: rgba(255, 255, 255, 0.09);
    --code-bg: rgba(255, 255, 255, 0.08);
    --glass: rgba(10, 10, 10, 0.6);
    --veil: rgba(0, 0, 0, 0.6);
    --pop: #101010;
    --pop-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
    --accent: #e04343;
    --accent-soft: rgba(224, 67, 67, 0.14);
    --mirror-hl: rgba(255, 255, 255, 0.16);
    --good: #3fb950;
    --good-bg: rgba(63, 185, 80, 0.14);
    --diff-add-hl: rgba(63, 185, 80, 0.32);
    --diff-del-hl: rgba(248, 81, 73, 0.32);
    --bad: #f85149;
    --bad-bg: rgba(248, 81, 73, 0.14);
    --img-outline: rgba(255, 255, 255, 0.1);
  }
}

:root[data-theme='dark'] {
  --page: #000000;
  --fg: #e8e8e8;
  --fg-rgb: 232, 232, 232;
  --page-rgb: 0, 0, 0;
  --muted: rgba(255, 255, 255, 0.55);
  --faint: rgba(255, 255, 255, 0.46);
  --hairline: rgba(255, 255, 255, 0.12);
  --rule: rgba(255, 255, 255, 0.3);
  --hover: rgba(255, 255, 255, 0.07);
  --press: rgba(255, 255, 255, 0.11);
  --selected: rgba(255, 255, 255, 0.09);
  --code-bg: rgba(255, 255, 255, 0.08);
  --glass: rgba(10, 10, 10, 0.6);
  --veil: rgba(0, 0, 0, 0.6);
  --pop: #101010;
  --pop-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
  --accent: #e04343;
  --accent-soft: rgba(224, 67, 67, 0.14);
  --mirror-hl: rgba(255, 255, 255, 0.16);
  --good: #3fb950;
  --good-bg: rgba(63, 185, 80, 0.14);
  --diff-add-hl: rgba(63, 185, 80, 0.32);
  --diff-del-hl: rgba(248, 81, 73, 0.32);
  --bad: #f85149;
  --bad-bg: rgba(248, 81, 73, 0.14);
  --img-outline: rgba(255, 255, 255, 0.1);
}

/* Exponent four joins straight edges with zero curvature (G2). Keep actual
   circles circular; browser-native shaping also preserves shadows and focus. */
*, *::before, *::after { box-sizing: border-box; corner-shape: superellipse(2); }
.avatar, .bug-shot__x { corner-shape: round; }

html, body { margin: 0; height: 100%; }

body {
  background: var(--page);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

#app { height: 100dvh; }

button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }

:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 2px; }

::selection { background: rgba(var(--fg-rgb), 0.14); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

.visually-hidden {
  position: absolute !important; width: 1px !important; height: 1px !important;
  padding: 0 !important; margin: -1px !important; overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
}

/* ---------------------------------------------------------------------------
   Shared controls
   ------------------------------------------------------------------------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 34px; padding: 0 14px;
  border: 1px solid var(--hairline); border-radius: var(--radius);
  font-size: 13px; font-weight: 500; white-space: nowrap;
  user-select: none;
}
.btn:hover { background: var(--hover); }
.btn svg { width: 14px; height: 14px; flex: none; }

.btn--primary { background: var(--fg); color: var(--page); border-color: var(--fg); }
.btn--primary:hover { background: var(--fg); opacity: 0.85; }

.btn--danger { color: var(--bad); border-color: var(--bad); }
.btn--danger:hover { background: var(--bad-bg); }

.btn--ghost { border-color: transparent; color: var(--muted); }
.btn--ghost:hover { color: var(--fg); }

.btn--sm { height: 26px; padding: 0 10px; font-size: 12px; }

.btn[disabled] { opacity: 0.4; pointer-events: none; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: var(--radius);
  color: var(--muted); flex: none;
  position: relative;
}
.icon-btn::after { content: ''; position: absolute; inset: -5px; }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn.active { color: var(--fg); background: var(--selected); }
.icon-btn svg { width: 16px; height: 16px; }

.text-input, .select {
  height: 34px; padding: 0 10px; width: 100%;
  background: var(--page); border: 1px solid var(--hairline); border-radius: var(--radius);
  transition-property: border-color; transition-duration: 0.15s;
}
.text-input::placeholder { color: var(--faint); }
.text-input:focus, .select:focus { outline: none; border-color: var(--rule); }
textarea.text-input { height: auto; padding: 8px 10px; resize: vertical; }

.dd {
  display: inline-flex; align-items: center; gap: 8px;
  height: 34px; padding: 0 10px 0 12px; min-width: 130px;
  background: var(--page); border: 1px solid var(--hairline); border-radius: var(--radius);
  font-size: 13.5px; text-align: left;
}
.dd:hover { border-color: var(--rule); }
.dd--sm { height: 26px; font-size: 12px; min-width: 110px; padding: 0 8px 0 10px; }
.dd__label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd__chev { width: 12px; height: 12px; color: var(--faint); flex: none; }
label > .dd { width: 100%; }

.eyebrow {
  font-family: var(--font-label);
  font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--faint); user-select: none;
}

.kbd {
  display: inline-block; padding: 1px 5px;
  font-family: var(--font-mono); font-size: 11px;
  border: 1px solid var(--hairline); border-bottom-width: 2px; border-radius: 4px;
  color: var(--muted); background: var(--page);
}

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 8px;
  border: 1px solid var(--hairline); border-radius: 10px;
  font-size: 11px; color: var(--muted); white-space: nowrap;
}
.chip--admin { border-color: var(--rule); color: var(--fg); font-weight: 500; }

.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%; flex: none;
  background: var(--fg); color: var(--page);
  font-size: 10px; font-weight: 600; letter-spacing: 0.02em;
  user-select: none;
}
.avatar--lg { width: 32px; height: 32px; font-size: 12px; }


/* ---------------------------------------------------------------------------
   Login — mirrors the site's hero: emptiness, wordmark, letterspaced caps.
   ------------------------------------------------------------------------- */

/* Signed-out frame: the shell with the members-only parts closed. The
   sign-in control sits where the home page's search box sits, same metrics. */
.tree-section--locked .tree-section__head--static { cursor: default; }
.signin { max-width: 740px; margin: 0 auto; padding: clamp(32px, 6vh, 64px) 0 70px; display: flex; flex-direction: column; gap: 14px; -webkit-font-smoothing: antialiased; }
.signin__title { margin: 0 0 11px; color: var(--fg); font-family: var(--font-ui); font-size: 30px; font-weight: 550; line-height: 1.25; letter-spacing: -0.04em; text-wrap: balance; }
.signin__button {
  display: flex; align-items: center; gap: 13px; width: 100%; height: 54px; padding: 0 17px;
  border-radius: 9px; background: var(--page); color: var(--fg);
  box-shadow: 0 0 0 1px var(--hairline), 0 2px 5px rgba(0, 0, 0, 0.03);
  font-size: 16px; text-decoration: none; text-align: left; cursor: pointer;
  transition: box-shadow 0.15s ease;
}
.signin__button:hover, .signin__button:focus-visible { box-shadow: 0 0 0 1px var(--rule), 0 2px 5px rgba(0, 0, 0, 0.03); outline: none; }
.signin__button svg { width: 19px; height: 19px; flex: none; }
.signin__note { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--muted); max-width: 62ch; }
.signin .login__error { margin: 0; }
@media (max-width: 600px) {
  .signin { padding-top: 32px; }
  .signin__title { font-size: 27px; }
  .signin__button { gap: 10px; padding: 0 13px; }
}
.sidebar__user--anon { cursor: default; }
.sidebar__user--anon:hover { background: transparent; }
.avatar--anon { background: transparent; border: 1px dashed var(--rule); }

.login__error {
  border: 1px solid var(--bad); border-radius: var(--radius);
  background: var(--bad-bg); color: var(--fg);
  padding: 10px 12px; font-size: 13px; line-height: 1.5;
}

.chooser { display: flex; flex-direction: column; gap: 8px; }
.chooser__head { font-size: 13px; color: var(--muted); text-align: center; margin: 0 0 4px; }
.chooser__item {
  display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 9px 12px; border: 1px solid var(--hairline); border-radius: var(--radius);
}
.chooser__item:hover { background: var(--hover); }
.chooser__name { font-size: 14px; font-weight: 500; }
.chooser__mail { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chooser__note { font-size: 11px; color: var(--faint); margin-left: auto; text-align: right; }

/* ---------------------------------------------------------------------------
   App shell
   ------------------------------------------------------------------------- */

.shell { display: flex; height: 100dvh; }

.sidebar {
  width: 268px; flex: none;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--hairline);
  background: var(--page);
  transition-property: margin-left, background-color, border-color;
  transition-duration: 0.2s, 0.16s, 0.16s;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1), ease, ease;
}
.shell.nav-hidden .sidebar { margin-left: -268px; }

.sidebar__head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
.sidebar__brand {
  display: inline-flex; align-items: center; gap: 9px; color: var(--fg);
  font-family: var(--font-display); font-weight: 700; font-size: 15px;
  letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
  user-select: none; text-decoration: none;
}
.sidebar__mark { width: 20px; height: 20px; display: block; flex: none; color: var(--fg); }
.sidebar__mark svg { width: 100%; height: 100%; display: block; overflow: visible; stroke-width: 9; }

/* Boot splash: the mark draws itself in (rings, then fills, then the divider)
   while the store boots, then the whole splash fades out over the app. */
.boot {
  position: fixed; inset: 0; z-index: 1000;
  display: grid; place-items: center;
  background: var(--page); color: var(--fg);
  transition: opacity 0.35s ease;
}
.boot.is-done { opacity: 0; pointer-events: none; }
.boot svg { width: min(280px, 60vw); height: auto; overflow: visible; }
.boot .mark__ring {
  stroke-dasharray: 233; stroke-dashoffset: 233;
  transform-box: fill-box; transform-origin: center; transform: rotate(-90deg);
  animation: boot-draw 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
.boot .mark__ring:nth-of-type(2) { animation-delay: 0.1s; }
.boot .mark__ring:nth-of-type(3) { animation-delay: 0.2s; }
.boot .mark__ring:nth-of-type(4) { animation-delay: 0.3s; }
.boot .mark__fill { opacity: 0; animation: boot-fill 0.35s ease-out forwards; animation-delay: 0.6s; }
.boot .mark__fill:nth-of-type(2) { animation-delay: 0.7s; }
.boot .mark__fill:nth-of-type(3) { animation-delay: 0.8s; }
.boot .mark__bar {
  stroke-dasharray: 74; stroke-dashoffset: 74;
  animation: boot-draw 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; animation-delay: 0.85s;
}
@keyframes boot-draw { to { stroke-dashoffset: 0; } }
@keyframes boot-fill { to { opacity: 1; } }

.sidebar__search {
  margin: 0 12px 10px;
  display: flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 10px; flex: none;
  border: 1px solid var(--hairline); border-radius: var(--radius);
  color: var(--faint); font-size: 13px;
  user-select: none;
}
.sidebar__search:hover { color: var(--muted); border-color: var(--rule); }
.sidebar__search svg { width: 14px; height: 14px; }
.sidebar__search .kbd { margin-left: auto; }

.sidebar__nav { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 1px; }

.sidebar__scroll { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }

.navlink {
  display: flex; align-items: center; gap: 9px;
  height: 30px; padding: 0 8px; border-radius: var(--radius);
  font-size: 13.5px; color: var(--muted); text-decoration: none;
  user-select: none; width: 100%;
}
.navlink:hover { background: var(--hover); color: var(--fg); }
.navlink.active { background: var(--selected); color: var(--fg); }
.navlink svg { width: 15px; height: 15px; flex: none; opacity: 0.75; }
.navlink .count {
  margin-left: auto; font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint);
  font-variant-numeric: tabular-nums;
}

.tree-section { --tree-label-inset: 26px; margin-top: 8px; }
.tree-section__head {
  display: flex; align-items: center; gap: 8px;
  height: 32px; padding: 0; width: 100%;
  border-radius: var(--radius);
}
.tree-section__head:hover { background: var(--hover); }
.tree-section__head:hover .tree-section__add { opacity: 1; }
.tree-section__toggle { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; align-self: stretch; padding: 0 2px; text-align: left; }
.tree-section__icon { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex: none; color: var(--muted); }
.tree-section__icon svg { display: block; width: 16px; height: 16px; }
.tree-section__label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 400; line-height: 1.5; color: var(--muted); text-transform: none; letter-spacing: normal; }
.tree-section__head--static { padding: 0 2px; }
.tree-section__head--static:hover { background: transparent; }
.tree-section__folder-closed, .tree-section.collapsed .tree-section__folder-open { display: none; }
.tree-section.collapsed .tree-section__folder-closed { display: initial; }
.tree-section__add { opacity: 0; color: var(--faint); width: 32px; height: 32px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius); transition-property: opacity; transition-duration: 0.15s; position: relative; }
.tree-section__add::after { content: none; }
.tree-section__add:hover { color: var(--fg); background: var(--press); }
.tree-section__add svg { width: 12px; height: 12px; }
.tree-section__body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 180ms cubic-bezier(0.4, 0, 0.2, 1); }
.tree-section__body > .tree-section__rows { overflow: hidden; min-height: 0; display: flex; flex-direction: column; gap: 1px; padding-top: 2px; }
.tree-section.collapsed .tree-section__body { grid-template-rows: 0fr; }

.tree-item__row {
  display: flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 6px 0 var(--tree-label-inset); border-radius: var(--radius);
  font-size: 13.5px; color: var(--muted); text-decoration: none;
  user-select: none;
}
.tree-item__row:hover { background: var(--hover); color: var(--fg); }
.tree-item__row.active { background: var(--selected); color: var(--fg); }
.tree-item__label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-item__star { width: 11px; height: 11px; color: var(--faint); flex: none; display: inline-flex; align-items: center; justify-content: center; }
.tree-item__star svg { width: 11px; height: 11px; display: block; }
.tree-item--child .tree-item__row { padding-left: var(--tree-label-inset); }
@media (max-width: 860px), (pointer: coarse) {
  .tree-section__head, .tree-item__row { height: 40px; }
  .tree-section__add { width: 40px; height: 40px; }
}

.sidebar__foot {
  border-top: 1px solid var(--hairline);
  padding: 8px 12px;
  display: flex; flex-direction: column; gap: 4px; flex: none;
}
.sidebar__user { display: flex; align-items: center; gap: 9px; width: 100%; min-width: 0; min-height: 48px; border-radius: var(--radius); padding: 6px; text-align: left; }
.sidebar__user:hover { background: var(--hover); }
.sidebar__user-text { flex: 1; min-width: 0; }
.sidebar__user-name { display: block; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar__user-mail { display: block; font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Account row: the account card fills the row; the Settings gear sits at its
   right and opens the wiki-level menu (activity, health, members, trash…). */
/* The gear stretches to the account card's height, so both hover
   highlights are the same size: one 48px-tall card, one 48px square. */
.sidebar__account { display: flex; align-items: stretch; gap: 2px; }
.sidebar__account .sidebar__user { width: auto; flex: 1; }
.sidebar__settings { width: 48px; height: auto; min-height: 48px; flex: none; }

/* ---------------------------------------------------------------------------
   Main column + glass topbar
   ------------------------------------------------------------------------- */

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 40;
  display: flex; align-items: center; gap: 8px;
  height: 52px; padding: 0 14px;
  border-bottom: 1px solid var(--hairline);
  background: var(--glass);
  -webkit-backdrop-filter: blur(9px) saturate(1.2);
  backdrop-filter: blur(9px) saturate(1.2);
  user-select: none;
}

.crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; font-size: 13px; }
.crumbs a { color: var(--muted); text-decoration: none; padding: 3px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.crumbs a:hover { background: var(--hover); color: var(--fg); }
.crumbs__sec { color: var(--muted); padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.crumbs__sep { color: var(--faint); flex: none; }
.crumbs__here { color: var(--fg); font-weight: 500; padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs__draft { color: var(--accent); display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding-left: 4px; }

.topbar__meta { font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--faint); white-space: nowrap; }

.content { flex: 1; overflow-y: auto; padding-top: 52px; scroll-padding-top: 68px; }

.page-wrap { display: grid; grid-template-columns: minmax(0, 760px) 200px; gap: 40px; justify-content: center; padding: 0 clamp(20px, 5vw, 56px); }
.page-wrap:not(.page-wrap--wide):not(:has(> .toc)) { grid-template-columns: minmax(0, 760px); }
.page-col { width: min(760px, 100%); min-width: 0; padding: clamp(24px, 4vh, 44px) 0 96px; }

.toc {
  width: 200px; flex: none; position: sticky; top: 0;
  align-self: start; max-height: calc(100dvh - 60px); overflow-y: auto;
  padding-top: clamp(24px, 4vh, 44px);
}

.toc__list { display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--hairline); }
.toc a {
  display: block; padding: 3px 0 3px 14px; margin-left: -1px;
  font-size: 12px; color: var(--muted); text-decoration: none;
  border-left: 1px solid transparent;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition-property: color, border-color; transition-duration: 0.15s;
}
.toc a:hover { color: var(--fg); }
.toc a.here { color: var(--fg); border-left-color: var(--fg); }
.toc a.lvl3 { padding-left: 26px; }
.toc-btn { display: none; }
@media (max-width: 1379px) {
  .toc { display: none; }
  .toc-btn { display: inline-flex; }
  .page-wrap { grid-template-columns: minmax(0, 760px); }
}

.page-head { padding-bottom: 14px; border-bottom: 1px solid var(--hairline); margin-bottom: 26px; }
.page-head h1 {
  margin: 0; font-size: clamp(28px, 4vw, 40px); font-weight: 400; line-height: 1.15;
  letter-spacing: 0.005em; text-wrap: balance;
}
.page-head__titlerow h1 { min-width: 0; }
.page-head__byline {
  display: flex; align-items: center; gap: 10px; margin-top: 12px;
  font-size: 13px; color: var(--muted);
}
.page-head__byline .who { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; flex: none; }
/* shadcn-style ghost icon button: visible affordance, quiet at rest. */
.page-head__info {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 6px; flex: none;
  color: var(--faint);
  transition-property: background-color, color; transition-duration: 0.15s;
}
.page-head__info svg { width: 16px; height: 16px; display: block; }
.page-head__info:hover { background: var(--hover); color: var(--fg); }
.page-head__info.active { background: var(--selected); color: var(--fg); }

.page-head__meta {
  display: inline-flex; align-items: center; flex-wrap: nowrap; gap: 14px;
  min-width: 0; overflow: hidden; white-space: nowrap;
  font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--muted);
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 16px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 16px), transparent);
  animation: info-in 160ms ease-out;
}
.page-head__meta > * { flex: none; }
@keyframes info-in { from { opacity: 0; transform: translateX(-6px); } }
.page-head__meta .who { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

/* ---------------------------------------------------------------------------
   Prose — rendered markdown
   ------------------------------------------------------------------------- */

.prose { font-size: 16px; line-height: 1.7; text-wrap: pretty; }
.prose > *:first-child { margin-top: 0; }

.prose h2, .prose h3, .prose h4 { font-weight: 600; line-height: 1.25; scroll-margin-top: 68px; position: relative; text-wrap: balance; }
.prose h2 { font-size: 22px; margin: 36px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--hairline); }
.prose h3 { font-size: 17px; margin: 28px 0 8px; }
.prose h4 { font-size: 15px; margin: 22px 0 6px; }

.prose .hlink { position: absolute; left: -24px; top: 4px; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; color: var(--faint); opacity: 0; text-decoration: none; transition-property: opacity; transition-duration: 0.15s; }
.prose h2:hover .hlink, .prose h3:hover .hlink, .prose h4:hover .hlink { opacity: 1; }
.prose .hlink svg { width: 13px; height: 13px; }
@media (max-width: 900px) { .prose .hlink { display: none; } }

.prose p { margin: 0 0 14px; }
.prose strong { font-weight: 600; }
.prose a { color: var(--fg); text-decoration: underline; text-decoration-color: rgba(var(--fg-rgb), 0.35); text-underline-offset: 2px; }
.prose a:hover { text-decoration-color: var(--fg); }
.prose a.wikilink--missing { color: var(--accent); text-decoration-color: var(--accent); text-decoration-style: dashed; }
.prose a.ext::after { content: '\2197'; font-size: 0.72em; vertical-align: super; margin-left: 1px; color: var(--faint); }

.prose ul, .prose ol { margin: 0 0 14px; padding-left: 26px; }
.prose li { margin: 3px 0; }
.prose li > ul, .prose li > ol { margin-bottom: 0; }

.prose li.task { list-style: none; margin-left: -22px; display: flex; gap: 8px; align-items: baseline; }
.prose li.task input { width: 14px; height: 14px; accent-color: var(--fg); flex: none; position: relative; top: 2px; cursor: pointer; }
.prose li.task input[disabled] { cursor: default; }
.prose li.task.done > .task-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }

.prose blockquote {
  margin: 0 0 14px; padding: 2px 0 2px 16px;
  border-left: 2px solid var(--rule); color: var(--muted);
}
.prose blockquote p:last-child { margin-bottom: 0; }

.prose hr { border: none; height: 1px; background: var(--hairline); margin: 28px 0; }

.prose code {
  font-family: var(--font-mono); font-size: 0.92em;
  background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
}

.prose pre {
  margin: 0 0 16px; padding: 14px 16px;
  background: var(--code-bg); border: 1px solid var(--hairline); border-radius: var(--radius);
  overflow-x: auto; position: relative;
}
.prose pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; display: block; }
.prose pre .codelang {
  position: absolute; top: 8px; right: 10px;
  font-family: var(--font-label); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--faint); user-select: none;
}
.tok-k { font-weight: 700; }
.tok-s { color: var(--muted); font-style: italic; }
.tok-c { color: var(--faint); font-style: italic; }
.tok-n { font-weight: 600; }

.prose .tablewrap { overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--hairline); border-radius: var(--radius); }
.prose table { border-collapse: collapse; font-size: 13.5px; min-width: 420px; width: 100%; }
.prose th, .prose td { border: 0; border-bottom: 1px solid var(--hairline); padding: 7px 12px; text-align: left; vertical-align: top; }
.prose tbody tr:last-child td { border-bottom: 0; }
.prose th {
  font-family: var(--font-label); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); font-weight: 400; background: var(--hover);
}
.prose td { font-variant-numeric: tabular-nums; }

.callout {
  display: flex; gap: 12px; margin: 0 0 16px; padding: 12px 14px;
  border: 1px solid var(--hairline); border-radius: var(--radius);
}
.callout > svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.callout > div { min-width: 0; flex: 1; }
.callout p:last-child { margin-bottom: 0; }
.callout--note { background: var(--hover); }
.callout--warn { border-color: var(--accent); background: var(--accent-soft); }
.callout--warn > svg { color: var(--accent); }
.callout--tip { border-color: var(--good); background: var(--good-bg); }
.callout--tip > svg { color: var(--good); }
.callout__title { font-weight: 600; font-size: 13.5px; margin: 0 0 2px; }

.page-foot { margin-top: 48px; border-top: 1px solid var(--hairline); padding-top: 18px; display: flex; flex-direction: column; gap: 26px; }
.backlinks { display: flex; flex-direction: column; gap: 8px; }
.backlinks__list { display: flex; flex-wrap: wrap; gap: 8px; }
.backlink {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 11px; border: 1px solid var(--hairline); border-radius: var(--radius);
  font-size: 13px; color: var(--muted); text-decoration: none;
}
.backlink:hover { background: var(--hover); color: var(--fg); }
.backlink svg { width: 12px; height: 12px; opacity: 0.6; }


/* ---------------------------------------------------------------------------
   Editor
   ------------------------------------------------------------------------- */

.editor { display: flex; flex-direction: column; height: 100%; padding-top: 52px; }

.editor__toolbar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px 2px;
  padding: 6px clamp(16px, 3vw, 24px);
  border-bottom: 1px solid var(--hairline);
}
.editor__tools {
  display: contents;
}
.editor__toolend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-left: auto; }
.editor__toolbar .icon-btn { width: 40px; height: 40px; border-radius: 5px; }
.editor__toolbar .icon-btn::after { inset: 0; }
.editor__toolend .dd { height: 40px; }
.editor__tools .icon-btn svg { width: 16px; height: 16px; }
.editor__count {
  font-size: 12px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums;
  margin-right: 10px; user-select: none;
}
.editor__draftbar {
  display: flex; align-items: center; gap: 9px;
  padding: 8px clamp(16px, 4vw, 40px);
  border-bottom: 1px solid var(--hairline);
  background: var(--accent-soft);
  font-size: 13px;
}
.editor__draftbar svg { width: 15px; height: 15px; color: var(--accent); flex: none; }
.editor__draftbar .btn { margin-left: auto; }

.findbar {
  display: flex; align-items: center; gap: 6px;
  padding: 6px clamp(16px, 4vw, 40px);
  border-bottom: 1px solid var(--hairline);
  background: var(--hover);
}
.findbar input {
  width: 260px; height: 28px; padding: 0 10px;
  background: var(--page); border: 1px solid var(--hairline); border-radius: var(--radius);
  font-size: 13px;
}
.findbar input:focus { outline: none; border-color: var(--rule); }
.findbar__count { font-size: 12px; color: var(--muted); min-width: 70px; font-variant-numeric: tabular-nums; }
.findbar .icon-btn { width: 26px; height: 26px; }

/* The preview shows exactly what publishes: page-title styles, page measure. */
.preview-title {
  font-size: clamp(28px, 4vw, 40px); font-weight: 400; line-height: 1.15;
  letter-spacing: 0.005em; margin: 0 0 12px; padding-bottom: 14px;
  border-bottom: 1px solid var(--hairline); text-wrap: balance;
}
.editor__pane--preview .prose { max-width: 760px; }

.editor__tools .sep { width: 1px; height: 16px; background: var(--hairline); margin: 0 8px; flex: none; }
.editor__tools .spacer { flex: 1; }
.editor__mode { display: flex; border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; }
.editor__mode button { padding: 4px 12px; font-size: 12px; color: var(--muted); }
.editor__mode button.active { background: var(--selected); color: var(--fg); }

.editor__panes { flex: 1; display: flex; min-height: 0; }
.editor__pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.editor__pane--src textarea {
  flex: 1; width: 100%; border: none; resize: none; background: var(--page); color: var(--fg);
  padding: 26px clamp(16px, 4vw, 40px) 120px;
  font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6;
}
.editor__pane--src textarea:focus { outline: none; }
.editor__pane--preview { border-left: 1px solid var(--hairline); overflow-y: auto; }
.editor__pane--preview .prose { padding: 10px clamp(16px, 4vw, 40px) 120px; }
.editor__pane--preview .preview-tag { padding: 26px clamp(16px, 4vw, 40px) 0; }
.editor.mode-write .editor__pane--preview { display: none; }
.editor.mode-preview .editor__pane--src { display: none; }
.editor.mode-preview .editor__pane--preview { border-left: none; }
.editor.mode-preview .editor__pane--preview .prose, .editor.mode-preview .preview-tag { max-width: 800px; margin: 0 auto; }
@media (max-width: 900px) {
  .editor.mode-split .editor__pane--preview { display: none; }
  .editor__mode [data-mode="split"] { display: none; }
}

.editor__title {
  border: none; background: var(--page); color: var(--fg); width: 100%;
  padding: 10px clamp(16px, 4vw, 40px) 0;
  font-size: clamp(28px, 4vw, 40px); font-weight: 400; line-height: 1.15;
}
.editor__pane--src .preview-tag { padding: 26px clamp(16px, 4vw, 40px) 0; }
.editor__title:focus { outline: none; }
.editor__title::placeholder { color: var(--faint); }

/* ---------------------------------------------------------------------------
   History + diff
   ------------------------------------------------------------------------- */

.history { display: flex; flex-direction: column; }
.rev {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 8px; border-bottom: 1px solid var(--hairline); border-radius: var(--radius);
}
a.rev:hover { background: var(--hover); }
.rev__meta { flex: 1; min-width: 0; }
.rev__summary { font-size: 14px; font-weight: 500; display: block; }
.rev__when { font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--faint); margin-top: 2px; display: block; }
.rev__stats { font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rev__stats .add { color: var(--good); }
.rev__stats .del { color: var(--bad); margin-left: 6px; }
.rev--current .rev__summary::after { content: 'current'; font-family: var(--font-label); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin-left: 9px; }

.diff {
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55;
  border: 1px solid var(--hairline); border-radius: var(--radius);
  overflow-x: auto; margin-top: 4px;
}
.diff__line { display: flex; white-space: pre-wrap; word-break: break-word; }
.diff__gut { flex: none; width: 22px; text-align: center; user-select: none; color: var(--faint); }
.diff__txt { flex: 1; padding-right: 12px; }
.diff__line--add { background: var(--good-bg); }
.diff__line--add .diff__gut { color: var(--good); }
.diff__line--del { background: var(--bad-bg); }
.diff__line--del .diff__gut { color: var(--bad); }
.diff__line--skip { color: var(--faint); background: var(--hover); padding: 2px 0; justify-content: center; user-select: none; }

/* ---------------------------------------------------------------------------
   Search palette
   ------------------------------------------------------------------------- */

.palette-veil {
  position: fixed; inset: 0; z-index: 90;
  background: var(--veil);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  display: flex; justify-content: center; align-items: flex-start;
  padding: min(14vh, 130px) 16px 16px;
}
.palette {
  width: min(600px, 100%);
  background: var(--pop); border: 1px solid var(--hairline); border-radius: var(--radius-bar);
  box-shadow: var(--pop-shadow);
  display: flex; flex-direction: column; overflow: hidden;
  max-height: min(480px, 70dvh);
}
.palette__head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--hairline); }
.palette__head svg { width: 16px; height: 16px; color: var(--faint); flex: none; }
.palette__head input { flex: 1; border: none; background: none; font-size: 15px; color: var(--fg); min-width: 0; }
.palette__head input:focus { outline: none; }
.palette__head input::placeholder { color: var(--faint); }
.palette__list { overflow-y: auto; padding: 6px; }
.palette__group { padding: 8px 10px 4px; }
.palette__item {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: var(--radius);
}
.palette__item.sel, .palette__item:hover { background: var(--selected); }
.palette__item > svg { width: 15px; height: 15px; color: var(--faint); flex: none; }
.palette__title { font-size: 14px; }
.palette__title mark, .palette__snip mark { background: none; color: var(--fg); font-weight: 700; }
.palette__snip { font-size: 12px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette__snip mark { font-weight: 600; }
.palette__where { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint); white-space: nowrap; flex: none; }
.palette__empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }
.palette__foot {
  display: flex; gap: 16px; padding: 9px 16px; border-top: 1px solid var(--hairline);
  font-size: 11.5px; color: var(--faint); user-select: none;
}

/* ---------------------------------------------------------------------------
   Admin
   ------------------------------------------------------------------------- */

.admin-grid { display: flex; flex-direction: column; gap: 36px; }

.admin-block__head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
.admin-block__head h2 { margin: 0; font-size: 19px; font-weight: 600; }
.admin-block__head .count { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.admin-block__sub { font-size: 13px; color: var(--muted); margin: 2px 0 14px; max-width: 62ch; }

.roster { border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; }
.roster__scroll { overflow-x: auto; }

/* ------------------------------ interest sheet ----------------------------
   One bounded component: toolbar, table, and footer share a single inner
   rail (14px), and the card's outer edge sits on the page rail. Nothing in
   here is a pixel off anything else, at any row count. */

.page-wrap--wide { grid-template-columns: minmax(0, 1080px); }
.page-col--wide { width: min(1080px, 100%); }
.admin-block__grow { flex: 1; }

.sheet {
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--page);
  overflow: hidden;
  margin: 4px 0 28px;
  container-type: inline-size;
}

.sheet__bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--hairline); }
.sheet__search-wrap { display: flex; align-items: center; flex: 1 1 210px; min-width: 160px; position: relative; }
.sheet__search-wrap > svg { width: 16px; height: 16px; position: absolute; left: 12px; pointer-events: none; color: var(--faint); }
.sheet__search { width: 100%; min-width: 0; height: 40px; padding-left: 36px; }
.sheet__actions { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sheet__actions[hidden] { display: none; }
.sheet__actions .btn, .sheet__actions .dd { min-height: 40px; text-decoration: none; }
.sheet__actions .dd { width: auto; min-width: 136px; }
.sheet__actions .icon-btn, .interest-row-actions .icon-btn, .interest-review .icon-btn { width: 40px; height: 40px; flex-shrink: 0; }
.sheet__actions .icon-btn::after, .interest-row-actions .icon-btn::after, .interest-review .icon-btn::after { inset: 0; }
.sheet__selection [role="status"] { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; max-width: 190px; }
.sheet__actions .btn:disabled { opacity: .45; cursor: default; }
@container (max-width: 36em) {
  .sheet__search-wrap { flex-basis: 100%; }
  .sheet__actions { margin-left: 0; width: 100%; }
  .sheet__actions > .icon-btn:last-child { margin-left: auto; }
  .sheet__selection [role="status"] { flex: 1; max-width: none; }
}
.btn--icon { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.btn--icon svg { width: 13px; height: 13px; flex: none; }

.sheet__scroll { overflow-x: auto; }
.sheet table { table-layout: fixed; width: 100%; min-width: 760px; border-collapse: collapse; font-size: 13.5px; }

.sheet th {
  font-family: var(--font-label); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  font-weight: 400; color: var(--faint); text-align: left;
  padding: 0 14px; height: 34px;
  border-bottom: 1px solid var(--hairline);
  background: var(--hover);
}
.sheet th:nth-child(1) { width: 52px; }
.sheet th:nth-child(2) { width: auto; }
.sheet th:nth-child(3) { width: 112px; }
.sheet th:nth-child(4) { width: 170px; }
.sheet th:nth-child(5) { width: 106px; }
.sheet th:nth-child(6) { width: 154px; }
.sheet .sheet__check-cell { padding: 0 6px; }
.sheet__check { display: grid; place-items: center; width: 40px; min-height: 44px; cursor: pointer; }
.sheet__check input { width: 16px; height: 16px; margin: 0; accent-color: var(--fg); cursor: pointer; }
.sheet__check:has(input:focus-visible) { outline: 2px solid var(--fg); outline-offset: -2px; border-radius: 6px; }
.sheet tbody tr.is-selected td { background: var(--hover); }

.sheet__sort {
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 40px;
  background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
}
.sheet__sort--static { cursor: default; }
.sheet__sort:not(.sheet__sort--static):hover, .sheet__sort.on { color: var(--fg); }
/* Always reserved, so toggling a sort never shifts a header. */
.sheet__caret { display: inline-block; width: 8px; font-size: 9px; line-height: 1; }

.sheet td {
  height: 64px;
  padding: 0 14px;
  border-bottom: 1px solid var(--hairline);
  vertical-align: middle;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sheet tbody tr:last-child td { border-bottom: none; }
.sheet tbody tr { cursor: default; }
.sheet tbody tr:hover td { background: var(--hover); }
.sheet tbody tr:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
.sheet__empty td { height: 140px; color: var(--muted); cursor: default; text-align: center; }
.sheet__empty:hover td { background: none; }

.sheet__foot {
  padding: 0 14px;
  height: 38px;
  display: flex;
  align-items: center;
  border-top: 1px solid var(--hairline);
  font-size: 12.5px;
  color: var(--muted);
}

/* Person cell: two fixed lines, so every row is exactly as tall as the next. */
.interest-person { display: block; min-width: 0; width: 100%; min-height: 44px; padding: 4px 0; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: 4px; }
.interest-person:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.interest-person b { display: block; font-size: 13.5px; font-weight: 600; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.interest-person .mail { display: block; font-size: 12px; line-height: 16px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Outside addresses read red instead of costing a column. */
.interest-outside { color: var(--bad); }
.interest-person .mail.interest-outside { color: var(--bad); }

.interest-when { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }

.sheet__archivedtag { font-size: 0.5em; font-weight: 400; color: var(--faint); white-space: nowrap; vertical-align: middle; font-variant-numeric: tabular-nums; }
.sheet__heading { font-size: 15px; font-weight: 600; margin: 26px 0 0; }
.sheet__note { font-size: 13.5px; color: var(--muted); margin: 10px 0 24px; }
.sheet__back { background: none; border: 0; padding: 0; margin: 0 0 14px; cursor: pointer; font: inherit; font-size: 13px; color: var(--muted); }
.sheet__back:hover { color: var(--fg); }

/* Archive shelf: same card, one row per cycle, identical inner rail. */
.sheet--list { padding: 0; }
.sheet__archive {
  display: flex; align-items: center; gap: 12px;
  padding: 0 14px; min-height: 52px;
  border-bottom: 1px solid var(--hairline);
}
.sheet__archive:last-child { border-bottom: none; }
.sheet__archivename {
  display: flex; flex: 1; min-width: 0; min-height: 52px; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px;
  background: none; border: 0; padding: 8px 0; cursor: pointer; text-align: left;
  font: inherit; font-size: 13.5px; font-weight: 600; color: var(--fg);
}
.sheet__archivetitle { text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.sheet__archivename .sheet__archivemeta { flex: none; font-weight: 400; }
.sheet__archive > .btn { flex: none; min-height: 40px; }
.sheet__archivemeta { flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Row detail: where the full text, the file, and the thread live. */
.interest-detail { display: grid; grid-template-columns: 92px 1fr; gap: 8px 16px; margin: 0 0 20px; font-size: 13.5px; align-items: baseline; }
.interest-detail dt { font-family: var(--font-label); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.interest-detail dd { margin: 0; overflow-wrap: anywhere; }
.interest-download { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
.interest-subhead { margin: 0 0 8px; font-family: var(--font-label); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 400; color: var(--faint); }
.interest-subhead .count { color: var(--faint); }
.interest-project { margin: 0 0 22px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Review controls stay visible and have separate, non-overlapping hit areas. */
.sheet .sheet__review-cell { padding-left: 8px; padding-right: 14px; }
.sheet th.sheet__review-cell { padding-left: 18px; }
.interest-row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
.interest-row-actions .icon-btn { color: var(--faint); }
.interest-row-actions .interest-comments { width: auto; min-width: 40px; gap: 4px; padding: 0 7px; }
.interest-comments span { font-size: 11px; font-variant-numeric: tabular-nums; }
.interest-comments.has-comments { color: var(--fg); }
.interest-flag.is-flagged, .interest-flag-readonly { color: var(--accent); }
.interest-flag.is-flagged { background: var(--accent-soft); }
.interest-flag.is-flagged svg, .interest-flag-readonly svg { fill: var(--accent-soft); }
.interest-flag[aria-disabled="true"] { opacity: .5; cursor: wait; }
.interest-delete:hover { color: var(--bad) !important; background: var(--bad-bg); }
.interest-flag-readonly { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; min-height: 40px; font-size: 13px; }
.interest-flag-readonly svg { width: 16px; height: 16px; }
.modal.interest-review { width: min(900px, 100%); }
.interest-review .modal__head { padding: 20px 24px; border-bottom: 1px solid var(--hairline); }
.interest-review__identity { flex: 1; min-width: 0; }
.interest-review__identity h3 { font-size: 20px; line-height: 1.3; }
.interest-review__identity > span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.interest-detail-flag { min-height: 40px; }
.modal__body.interest-review__body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 0; gap: 0; }
.interest-application, .interest-discussion { padding: 24px; min-width: 0; }
.interest-discussion { border-left: 1px solid var(--hairline); }
.interest-review .interest-subhead { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; color: var(--muted); }
.interest-review .interest-detail { grid-template-columns: 72px 1fr; gap: 10px 16px; margin-bottom: 30px; }
.interest-review .interest-project { font-size: 13.5px; line-height: 1.7; }
.interest-private { margin-left: auto; font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--faint); }
.interest-thread { display: flex; flex-direction: column; gap: 20px; margin-bottom: 22px; }
.interest-thread__empty { color: var(--faint); font-size: 13px; margin: 8px 0 0; }
.interest-comment__meta { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.interest-comment__meta b { font-weight: 600; overflow-wrap: anywhere; }
.interest-comment__meta time { margin-left: auto; color: var(--faint); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.interest-comment p { margin: 6px 0 0; font-size: 13px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.interest-compose textarea { display: block; width: 100%; min-height: 98px; resize: vertical; font-size: 13px; }
.interest-compose__foot { display: flex; justify-content: flex-end; margin-top: 10px; }
.interest-compose__foot .btn { min-height: 40px; }
.interest-compose .field-error { margin: 8px 0; font-size: 12px; }
.interest-readonly { color: var(--faint); font-size: 12px; }
.interest-attachment { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px; border: 1px solid var(--hairline); border-radius: var(--radius); color: var(--fg); text-decoration: none; font-size: 13px; overflow-wrap: anywhere; }
.interest-attachment:hover { background: var(--hover); }
.interest-comment__delete { margin-left: auto; min-height: 40px; padding: 0 8px; font-size: 11px; }
.interest-comment__confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; }
.interest-comment__confirm .btn { min-height: 40px; }
.interest-attachment > svg { width: 18px; height: 18px; flex: none; }
.interest-attachment small { display: block; margin-top: 3px; color: var(--faint); font-size: 11px; }
@container (max-width: 36em) {
  .sheet table { min-width: 0; }
  .sheet th:nth-child(3), .sheet td:nth-child(3),
  .sheet th:nth-child(4), .sheet td:nth-child(4),
  .sheet th:nth-child(5), .sheet td:nth-child(5) { display: none; }
  .sheet th:first-child { width: 44px; }
  .sheet th:last-child { width: 140px; }
  .sheet th, .sheet td { padding-left: 6px; padding-right: 6px; }
  .sheet .sheet__check-cell { padding: 0 2px; }
  .sheet .sheet__review-cell { padding-left: 0; padding-right: 6px; }
  .sheet th.sheet__review-cell { padding-left: 12px; }
}
@media (max-width: 640px) {
  .modal__body.interest-review__body { grid-template-columns: minmax(0, 1fr); }
  .interest-review .modal__head { padding: 16px; gap: 6px; }
  .interest-review__identity h3 { font-size: 17px; }
  .interest-detail-flag { padding: 0; width: 40px; }
  .interest-detail-flag span { display: none; }
  .interest-application, .interest-discussion { padding: 20px; }
  .interest-discussion { border-left: 0; border-top: 1px solid var(--hairline); }
}

.modal-typed { display: block; margin-top: 14px; font-size: 13px; color: var(--muted); }
.modal-typed .text-input { margin-top: 6px; width: 100%; }
.modal-typed__phrase { font-family: var(--font-mono, ui-monospace, monospace); color: var(--fg); }
.roster table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 660px; }
.roster th {
  font-family: var(--font-label); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  font-weight: 400; color: var(--faint); text-align: left;
  padding: 9px 14px; border-bottom: 1px solid var(--hairline); background: var(--hover);
  white-space: nowrap;
}
.roster td { padding: 9px 14px; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
.roster tr:last-child td { border-bottom: none; }
.roster tbody tr:hover td { background: var(--hover); }
.roster .who { display: flex; align-items: center; gap: 10px; }
.roster .who b { font-weight: 500; display: block; }
.roster .mail { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); white-space: nowrap; display: block; }
.roster .mono { font-family: var(--font-mono); font-size: 12px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.roster .actions { display: flex; gap: 4px; justify-content: flex-end; opacity: 0; transition-property: opacity; transition-duration: 0.15s; }
.roster tr:hover .actions, .roster tr:focus-within .actions { opacity: 1; }
.roster--members table { table-layout: fixed; min-width: 0; }
.roster--members th:nth-child(1) { width: 32%; }
.roster--members th:nth-child(2) { width: 17%; }
.roster--members th:nth-child(3) { width: 13%; }
.roster--members th:nth-child(4) { width: 16%; }
.roster--members th:nth-child(5) { width: 22%; }
.roster--members th, .roster--members td { padding: 10px; overflow-wrap: anywhere; }
.roster--members .who > span:last-child { min-width: 0; }
.roster--members .mail, .roster--members .mono { white-space: normal; overflow-wrap: anywhere; }
.roster--members .actions { flex-wrap: wrap; opacity: 1; }
.roster--members .actions .btn { min-height: 40px; height: auto; max-width: 100%; white-space: normal; }

.invite-add { display: flex; gap: 8px; }
.invite-add .text-input { flex: 1; }
@media (max-width: 640px) { .invite-add { flex-wrap: wrap; } }

/* Members share the intake toolbar, with independent table columns. */
.member-sheet { border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--page); overflow: hidden; container-type: inline-size; }
.member-invite { padding: 12px 14px; border-bottom: 1px solid var(--hairline); }
.member-invite[hidden] { display: none; }
.member-invite .invite-add { align-items: center; flex-wrap: wrap; }
.member-invite .text-input { min-width: 180px; }
.member-invite .btn, .member-invite .dd { min-height: 40px; }
.member-scroll { overflow-x: auto; }
.member-sheet table { table-layout: fixed; width: 100%; border-collapse: collapse; font-size: 13.5px; }
.member-sheet th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 500; color: var(--muted); background: var(--hover); border-bottom: 1px solid var(--hairline); }
.member-sheet td { height: 64px; padding: 10px 14px; vertical-align: middle; border-bottom: 1px solid var(--hairline); }
.member-sheet tbody tr:last-child td { border-bottom: 0; }
.member-sheet tbody tr:hover td { background: var(--hover); }
.member-sheet .member-person { width: auto; }
.member-sheet .member-subteam { width: 16%; overflow-wrap: anywhere; }
.member-sheet .member-role { width: 86px; }
.member-sheet .member-date { width: 118px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.member-sheet .member-controls { width: 180px; }
.member-name { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 8px; }
.member-name b { min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.member-invited, .member-you { font-size: 11px; color: var(--faint); }
.member-email { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member-actions { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.member-actions .icon-btn, .member-actions .btn { min-height: 40px; flex: none; }
.member-actions .icon-btn { width: 40px; height: 40px; }
.member-actions .icon-btn::after { inset: 0; }
.member-role-change { min-height: 40px; padding: 0 8px; color: var(--muted); font-size: 12px; white-space: nowrap; flex: none; }
.member-role-change:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.member-actions button:disabled { opacity: .45; cursor: wait; }
.member-remove:hover { background: var(--bad-bg); color: var(--bad); }
.member-empty td { height: 120px; text-align: center; color: var(--muted); }
@container (max-width: 46em) {
  .member-sheet .member-subteam, .member-sheet .member-date { display: none; }
  .member-sheet .member-role { width: 60px; }
  .member-sheet .member-controls { width: 154px; }
  .member-sheet th, .member-sheet td { padding-left: 10px; padding-right: 10px; }
  .member-role-change { padding: 0 4px; font-size: 11.5px; }
  .member-actions { flex-wrap: wrap; }
}

.audit { display: flex; flex-direction: column; }
.audit__row {
  display: flex; align-items: baseline; gap: 12px;
  padding: 8px 2px; border-bottom: 1px solid var(--hairline);
  font-size: 13px;
}
.audit__row:last-child { border-bottom: none; }
.audit__when { font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--faint); white-space: nowrap; width: 138px; flex: none; }
.audit__what { color: var(--muted); }
.audit__what b { color: var(--fg); font-weight: 500; }

.mailview { border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; }
.mailview__head { padding: 12px 16px; border-bottom: 1px solid var(--hairline); background: var(--hover); display: flex; flex-direction: column; gap: 3px; }
.mailview__row { display: flex; gap: 8px; font-size: 12.5px; }
.mailview__row .k { font-family: var(--font-label); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); width: 52px; flex: none; padding-top: 2px; }
.mailview__body { padding: 20px 24px; font-size: 14px; line-height: 1.6; }
.mailview__body p { margin: 0 0 10px; }
.mailview__code {
  display: block; margin: 14px 0; padding: 12px;
  font-family: var(--font-mono); font-size: 19px; letter-spacing: 0.14em; text-align: center;
  border: 1px dashed var(--rule); border-radius: var(--radius);
  user-select: all;
}

/* ---------------------------------------------------------------------------
   Activity / listing pages
   ------------------------------------------------------------------------- */

.feed { display: flex; flex-direction: column; }
.feed__day { margin-top: 22px; display: flex; flex-direction: column; }
.feed__day:first-child { margin-top: 0; }
.feed__row {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 6px; position: relative;
  font-size: 13.5px; text-decoration: none; color: var(--fg);
  border-radius: var(--radius);
}
.feed__row + .feed__row::before { content: ''; position: absolute; top: -1px; left: 6px; right: 6px; height: 1px; background: var(--hairline); }
.feed__day .eyebrow { padding-left: 6px; }
a.feed__row:hover { background: var(--hover); }
.feed__what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.feed__what b { color: var(--fg); font-weight: 500; }
.feed__when { font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--faint); white-space: nowrap; }


/* ---------------------------------------------------------------------------
   Modals, menus, toasts, empty states
   ------------------------------------------------------------------------- */

.modal-veil {
  position: fixed; inset: 0; z-index: 80;
  background: var(--veil);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  width: min(480px, 100%); max-height: min(680px, 92dvh);
  background: var(--pop); border: 1px solid var(--hairline); border-radius: var(--radius-bar);
  box-shadow: var(--pop-shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.modal--wide { width: min(600px, 100%); }
.modal__head { display: flex; align-items: center; gap: 10px; padding: 16px 20px 0; }
.modal__head h3 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.modal__body { padding: 14px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal__body > * { flex: none; }
.modal__foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--hairline); background: var(--pop); }
.modal__body label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; }
.modal__body label .sub { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.field-error { color: var(--bad); font-size: 12.5px; }

.tpl-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tpl-grid > * { min-width: 0; }
.tpl {
  display: flex; flex-direction: column; gap: 8px; text-align: left;
  padding: 8px 8px 10px; border: 1px solid var(--hairline); border-radius: var(--radius);
  transition-property: background, border-color; transition-duration: 0.15s;
}
.tpl:hover { background: var(--hover); }
.tpl.sel { border-color: var(--fg); background: var(--selected); }
.tpl b { font-size: 12.5px; font-weight: 600; padding: 0 4px; }
/* A miniature render of the actual template — you pick a structure, not a name. */
.tpl__thumb {
  height: 108px; overflow: hidden; position: relative;
  border: 1px solid var(--hairline); border-radius: calc(var(--radius) - 2px);
  background: var(--page); pointer-events: none;
}
.tpl__thumb .prose {
  transform: scale(0.42); transform-origin: top left;
  width: 238%; padding: 10px 12px; font-size: 14px;
}
.tpl__thumb .prose h2 { margin-top: 10px; }
.tpl__thumb::after { content: ''; position: absolute; inset: 60% 0 0 0; background: linear-gradient(transparent, var(--page)); }
.tpl__thumb--blank { display: flex; align-items: center; justify-content: center; }
.tpl__thumb--blank span { font-size: 12px; color: var(--faint); }
@media (max-width: 560px) { .tpl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.menu {
  position: fixed; z-index: 95; min-width: min(200px, calc(100vw - 20px));
  max-width: calc(100vw - 20px); max-height: calc(100dvh - 20px); overflow-y: auto;
  background: var(--pop); border: 1px solid var(--hairline); border-radius: var(--radius-bar);
  box-shadow: var(--pop-shadow);
  padding: 5px; display: flex; flex-direction: column;
}
.menu button {
  display: flex; align-items: center; gap: 10px;
  min-height: 40px; overflow-wrap: anywhere;
  padding: 8px 10px; border-radius: var(--radius);
  font-size: 13.5px; text-align: left; color: var(--fg); width: 100%;
}
.menu button:hover { background: var(--hover); }
.menu button.danger { color: var(--bad); }
.menu svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.menu button.danger svg { color: var(--bad); }
.menu hr { border: none; height: 1px; background: var(--hairline); margin: 5px 6px; }
.menu .menu__hint { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--faint); }

.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 16px; border-radius: var(--radius-bar);
  background: var(--fg); color: var(--page);
  font-size: 13.5px; box-shadow: var(--pop-shadow);
  animation: toast-in 0.2s ease;
  pointer-events: auto; white-space: nowrap;
}
.toast button { color: var(--page); text-decoration: underline; font-size: 13px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.empty {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 64px 24px; text-align: center; color: var(--muted);
}
.empty svg { width: 26px; height: 26px; color: var(--faint); }
.empty b { font-weight: 500; color: var(--fg); }
.empty p { margin: 0; font-size: 13.5px; max-width: 42ch; }

.plain-head { margin-bottom: 24px; }
.plain-head h1 { margin: 6px 0 0; font-size: clamp(26px, 4vw, 36px); font-weight: 400; text-wrap: balance; }
.plain-head p { margin: 10px 0 0; color: var(--muted); font-size: 14px; max-width: 62ch; }
.plain-head p b { color: var(--fg); font-weight: 500; }

/* ---------------------------------------------------------------------------
   Figures, file cards, CAD viewer, embeds
   ------------------------------------------------------------------------- */

.prose figure { margin: 0 0 16px; }
.prose img { max-width: 100%; border-radius: var(--radius); cursor: zoom-in; outline: 1px solid var(--img-outline); outline-offset: -1px; display: block; }
.prose figure img { width: 100%; }
.prose figcaption {
  margin-top: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.5;
  padding-left: 12px; border-left: 2px solid var(--hairline);
}

.missing-att {
  display: inline-block; padding: 2px 8px; border: 1px dashed var(--bad);
  border-radius: 4px; color: var(--bad); font-size: 12.5px;
}

.filecard, .embed-card {
  display: flex; align-items: center; gap: 13px;
  margin: 0 0 16px; padding: 12px 14px;
  border: 1px solid var(--hairline); border-radius: var(--radius);
  transition-property: border-color; transition-duration: 0.15s;
}
.filecard:hover, .embed-card:hover { border-color: var(--rule); }
.filecard__icon, .embed-card__icon {
  width: 36px; height: 36px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--hairline); border-radius: calc(var(--radius) - 2px);
  color: var(--muted);
}
.filecard__icon svg, .embed-card__icon svg { width: 18px; height: 18px; }
.filecard__meta, .embed-card__meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.filecard__meta b, .embed-card__meta b { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filecard__meta span, .embed-card__ref { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.embed-card__note {
  font-family: var(--font-label); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--faint); white-space: nowrap;
}
.embed-card .btn { text-decoration: none; }
@media (max-width: 640px) { .embed-card__note { display: none; } }

.cad-embed { margin: 0 0 16px; border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; }
.cad-embed__head { display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-bottom: 1px solid var(--hairline); }
.cad-embed__head .filecard__icon { color: var(--fg); }
.cad-embed__hint { font-family: var(--font-label); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.cad-embed__stage { position: relative; background: var(--hover); }
.cad-embed__stage canvas { display: block; width: 100%; height: 300px; cursor: grab; touch-action: none; }
.cad-embed__stage canvas:active { cursor: grabbing; }
.cad-embed__facts { padding: 9px 14px; border-top: 1px solid var(--hairline); font-size: 12px; color: var(--muted); }
@media (max-width: 640px) { .cad-embed__hint { display: none; } }

.lightbox {
  position: fixed; inset: 0; z-index: 110;
  background: var(--veil);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  padding: 32px; cursor: zoom-out;
}
.lightbox img { max-width: 100%; max-height: 100%; border-radius: var(--radius); box-shadow: var(--pop-shadow); background: #fff; }
.lightbox__close { position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; }

.ed-autocomplete[hidden] { display: none; }
.ed-autocomplete {
  position: fixed; z-index: 96; min-width: 230px;
  background: var(--pop); border: 1px solid var(--hairline); border-radius: var(--radius-bar);
  box-shadow: var(--pop-shadow); padding: 5px;
  display: flex; flex-direction: column;
}
.ed-autocomplete button {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: var(--radius); font-size: 13.5px; text-align: left;
}
.ed-autocomplete button:hover, .ed-autocomplete button.sel { background: var(--hover); }
.ed-autocomplete svg { width: 14px; height: 14px; color: var(--muted); }

.editor.dropping .editor__pane--src textarea { background: var(--accent-soft); }

.preview-tag { user-select: none; }

/* Press feedback: exactly 0.96, properties named. */
.btn, .icon-btn, .chooser__item, .tpl, .palette__item, .navlink, .tree-item__row,
.menu button, a.feed__row, .rev, .crumbs a, .backlink, .sidebar__user, .sidebar__search,
.tree-section__head, .dd, .ed-autocomplete button, .prose a, .prose th, .reaction, .draft-chip {
  transition-property: background-color, border-color, color, opacity, scale, text-decoration-color;
  transition-duration: 0.15s;
  transition-timing-function: ease;
}
.btn:active, .icon-btn:active, .chooser__item:active, .tpl:active { scale: 0.96; }

/* ---------------------------------------------------------------------------
   Feature layer: inbox badge, link previews, sortable tables, task meter
   ------------------------------------------------------------------------- */

.badge {
  margin-left: auto; min-width: 17px; height: 17px; padding: 0 5px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 9px; background: var(--accent); color: #fff;
  font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums;
}

.feed__row--new .feed__what b { font-weight: 600; }

.linkpreview {
  position: fixed; z-index: 79; width: min(340px, 80vw);
  background: var(--pop); border: 1px solid var(--hairline); border-radius: var(--radius-bar);
  box-shadow: var(--pop-shadow); padding: 12px 14px;
  pointer-events: none;
  animation: toast-in 0.15s ease;
}
.linkpreview b { font-size: 14px; font-weight: 600; display: block; }
.linkpreview__meta { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint); display: block; margin: 3px 0 6px; }
.linkpreview p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.55; }

.prose th { cursor: pointer; user-select: none; position: relative; padding-right: 24px; }
.prose th::after { content: ''; position: absolute; right: 8px; }
.prose th:hover { color: var(--fg); }
.prose th[data-sort='asc']::after { content: '↑'; }
.prose th[data-sort='desc']::after { content: '↓'; }

.taskmeter { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.taskmeter__bar {
  width: 54px; height: 4px; border-radius: 2px; background: var(--hairline);
  overflow: hidden; display: inline-block;
}
.taskmeter__bar span { display: block; height: 100%; background: var(--good); border-radius: 2px; }

/* ---------------------------------------------------------------------------
   Print — a page prints as a clean document
   ------------------------------------------------------------------------- */

@media print {
  body { overflow: visible; }
  .sidebar, .topbar, .shell__scrim, .toasts, .page-foot .reactions,
  .toc, .cad-embed__hint, .prose .hlink { display: none !important; }
  .shell, .main, .content { display: block; height: auto; overflow: visible; }
  .content { padding-top: 0; }
  .page-col { width: 100%; padding: 0; }
  .prose li.task input { accent-color: #000; }
  .prose a { text-decoration: none; }
}

/* Line-art SVG diagrams flip to white-ink-on-black in dark mode instead of
   glowing as white slabs. Photos and raster images are left alone. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .prose img[src^='data:image/svg'],
  :root:not([data-theme='light']) .lightbox img[src^='data:image/svg'] {
    filter: invert(1) hue-rotate(180deg);
    background: #000;
  }
}
:root[data-theme='dark'] .prose img[src^='data:image/svg'],
:root[data-theme='dark'] .lightbox img[src^='data:image/svg'] {
  filter: invert(1) hue-rotate(180deg);
  background: #000;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .prose img:not([src^='data:image/svg']) { filter: brightness(0.88); }
}
:root[data-theme='dark'] .prose img:not([src^='data:image/svg']) { filter: brightness(0.88); }

.mention {
  display: inline-block; padding: 0 5px; border-radius: 4px;
  background: var(--selected); font-weight: 600; font-size: 0.95em;
}

/* ---------------------------------------------------------------------------
   Mobile
   ------------------------------------------------------------------------- */

.shell__scrim { display: none; }

@media (max-width: 860px) {
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 60;
    box-shadow: var(--pop-shadow);
    transform: translateX(-100%);
    transition-property: transform; transition-duration: 0.2s; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    margin-left: 0 !important;
  }
  .shell.nav-open .sidebar { transform: none; }
  .shell.nav-open .shell__scrim {
    display: block; position: fixed; inset: 0; z-index: 55;
    background: var(--veil);
  }
  .page-wrap { padding: 0 18px; }
  .topbar { padding: 0 8px; }
  .topbar__meta { display: none; }
  .editor__panes { flex-direction: column; }
  .editor__pane--preview { border-left: none; border-top: 1px solid var(--hairline); }
}

@media (max-width: 640px) {
  /* Breadcrumbs: only the current page — ancestors crush into noise here. */
  .crumbs a, .crumbs .crumbs__sec, .crumbs .crumbs__sep { display: none; }
  .crumbs .crumbs__here { max-width: 60vw; }
  /* Invite form stacks; the email field keeps a usable width. */
  .invite-add { flex-wrap: wrap; }
  .invite-add .text-input { flex: 1 1 100%; min-width: 0; }
  /* Split has no room here, but Write|Preview must survive — a phone user
     still needs to see rendered output before saving. */
  .editor .btn .kbd { display: none; }
  .editor__mode button { padding: 4px 9px; }
}


/* ---------------------------------------------------------------------------
   Motion — enters and exits. Every duration collapses under
   prefers-reduced-motion via the global rule at the top of this sheet.
   ------------------------------------------------------------------------- */

@keyframes fade-in { from { opacity: 0; } }
@keyframes veil-in { from { opacity: 0; } }
@keyframes veil-out { to { opacity: 0; } }
@keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
@keyframes pop-out { to { opacity: 0; transform: translateY(6px) scale(0.98); } }
@keyframes menu-in { from { opacity: 0; transform: scale(0.96) translateY(-4px); } }
@keyframes palette-in { from { opacity: 0; transform: translateY(-6px) scale(0.985); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(6px) scale(0.97); } }
@keyframes view-in { from { opacity: 0; } }
@keyframes lightbox-in { from { opacity: 0; transform: scale(0.96); } }

.modal-veil { animation: veil-in 120ms ease-out; }
.modal { animation: pop-in 160ms cubic-bezier(0.2, 0, 0, 1); }
.modal-veil.leaving { animation: veil-out 120ms ease-in forwards; }
.modal-veil.leaving .modal { animation: pop-out 120ms ease-in forwards; }
.palette-veil { animation: veil-in 100ms ease-out; }
.palette { animation: palette-in 130ms cubic-bezier(0.2, 0, 0, 1); }
.palette__list { min-height: 220px; }
.menu { animation: menu-in 100ms cubic-bezier(0.2, 0, 0, 1); transform-origin: top left; }
.toast.leaving { animation: toast-out 140ms ease-in forwards; }
.lightbox { animation: veil-in 140ms ease-out; }
.lightbox img { animation: lightbox-in 180ms cubic-bezier(0.2, 0, 0, 1); }
.lightbox.leaving { animation: veil-out 120ms ease-in forwards; }
.content.route-in { animation: view-in 120ms ease-out; }
.editor.editor-in { animation: view-in 130ms ease-out; }
.crumbs__draft { animation: fade-in 140ms ease-out; }
.editor__mode button { transition: background-color 120ms ease, color 120ms ease; }
body { transition: background-color 160ms ease, color 160ms ease; }
.topbar, .modal, .palette, .menu, .toast { transition-property: background-color, border-color; transition-duration: 0.16s; }
.modal__body { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent); }
@supports (animation-timeline: scroll(self block)) {
  .modal__body { animation: modal-unfade linear both; animation-timeline: scroll(self block); }
  @keyframes modal-unfade { to { -webkit-mask-image: linear-gradient(#000, #000); mask-image: linear-gradient(#000, #000); } }
}
.tpl { transition-property: background-color, border-color, scale; transition-duration: 0.15s; }

/* Reactions — Slack-style, on the page footer. */
.reactions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.reaction {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px;
  border: 1px solid var(--hairline); border-radius: 999px;
  background: var(--page); font-size: 13px;
}
.reaction:hover { background: var(--hover); border-color: var(--rule); }
.reaction:active { scale: 0.94; }
.reaction.mine { border-color: var(--fg); background: var(--selected); }
.reaction__emoji { font-size: 14px; line-height: 1; }
.reaction__n { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.reaction.mine .reaction__n { color: var(--fg); font-weight: 600; }
.reaction--add { width: 30px; padding: 0; justify-content: center; color: var(--faint); }
.reaction--add svg { width: 15px; height: 15px; }
.reaction--add:hover { color: var(--fg); }
.menu__emoji { width: 14px; flex: none; font-size: 14px; line-height: 1; text-align: center; }

/* Drafts are visible without opening the editor. */
.draft-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 22px; padding: 0 9px;
  border: 1px solid var(--accent); border-radius: 999px;
  color: var(--accent); font-size: 11.5px; font-weight: 500;
  animation: fade-in 140ms ease-out;
}
.draft-chip:hover { background: var(--accent-soft); }
.tree-item__label--draft { color: var(--accent); }
.navlink--draft { color: var(--accent); }

/* Page topbar Edit + editor breadcrumb state chip. */
.topbar__edit svg { width: 13px; height: 13px; }
.topbar__edit .kbd { margin-left: 2px; }
.crumbs__mode {
  margin-left: 10px; padding: 2px 8px; flex: none;
  border: 1px solid var(--hairline); border-radius: 999px;
  font-family: var(--font-label); font-size: 10.5px; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--muted);
}
.navlink .kbd { margin-left: auto; }
.tpl__desc { font-size: 11px; color: var(--faint); padding: 0 4px; margin-top: -4px; }

/* History diffs highlight on-palette, both themes. */
.diff mark { background: rgba(var(--fg-rgb), 0.14); color: inherit; border-radius: 2px; padding: 0 1px; }
.diff__line--add mark { background: var(--diff-add-hl); }
.diff__line--del mark { background: var(--diff-del-hl); }

/* Welcome-email preview. */
.mailview__crab { display: block; width: min(300px, 80%); margin: 4px 0 12px; }
.mailview__btn {
  display: inline-block; background: var(--fg); color: var(--page);
  text-decoration: none; padding: 10px 20px; border-radius: 6px;
  font-weight: 600; font-size: 13.5px;
}

.editor__tools::-webkit-scrollbar { display: none; }

@media (max-width: 900px) {
  .editor.mode-split .editor__mode [data-mode="write"] { background: var(--selected); color: var(--fg); }
}
@media (max-width: 860px) {
  .shell__scrim {
    display: block; position: fixed; inset: 0; z-index: 55;
    background: var(--veil); opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
  }
  .shell.nav-open .shell__scrim { opacity: 1; pointer-events: auto; }
}


/* Round-2 verifier fixes. */
.modal-veil.leaving { pointer-events: none; }
.toast.leaving { pointer-events: none; }
.modal--wide { width: min(760px, 100%); max-height: min(860px, 92dvh); }
.modal--wide .tpl-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tpl__thumb { height: 92px; }
@media (max-width: 900px) { .modal--wide .tpl-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.emoji-pop { display: grid; grid-template-columns: repeat(4, 38px); gap: 2px; padding: 6px; }
.emoji-pop button { width: 38px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; border-radius: 6px; padding: 0; }
.emoji-pop button:hover { background: var(--hover); }
