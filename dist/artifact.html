function viewModal() {
  const m = UI.modal;
  if (!m) { UI._shownModal = null; return ''; }
  const continuing = UI._shownModal === m;
  UI._shownModal = m;
  let inner = '';
  if (m.kind === 'new-page') {
    // Each template card shows a live-rendered snapshot of the template itself,
    // so you see the structure you're choosing, not just its name.
    const thumb = (t) => {
      if (!t.body) return `<div class="tpl__thumb tpl__thumb--blank" aria-hidden="true" inert><span>Blank page</span></div>`;
      const { html } = MD.render(t.body, mdCtx({ readonly: true }));
      // These trusted, rendered templates are illustrations inside a button.
      // Keep their typography without nesting links/controls or duplicating
      // heading IDs from the article behind the dialog.
      const passiveHtml = html.replace(/<(\/?)(a|button)\b([^>]*)>/gi, (_tag, closing, _name, attrs) =>
        closing ? '</span>' : `<span${attrs.match(/\sclass=(?:"[^"]*"|'[^']*')/i)?.[0] || ''}>`)
        .replace(/<[a-z][^>]*>/gi, (tag) => tag.replace(/\sid=(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, ''));
      return `<div class="tpl__thumb" aria-hidden="true" inert><div class="prose">${passiveHtml}</div></div>`;
    };
    inner = `<div class="modal modal--wide" role="dialog" aria-label="New page">
      <div class="modal__head"><h3>New page</h3><button class="icon-btn" data-action="modal-close" aria-label="Close">${I.x}</button></div>
      <div class="modal__body">
        <label>Title<input class="text-input" data-m="title" placeholder="e.g. Landing Gear Study" value="${MD.esc(m.title || '')}" maxlength="90" spellcheck="true" autocorrect="off"></label>
        <label>Section${ddSections(m.section || 'projects')}</label>
        <label>Template</label>
        <div class="tpl-grid">${TEMPLATES.map((t) => `<button class="tpl ${(m.tpl || 'blank') === t.id ? 'sel' : ''}" data-action="tpl-pick" data-tpl="${t.id}" aria-label="${MD.esc(t.name)}" aria-pressed="${(m.tpl || 'blank') === t.id}">${thumb(t)}<b>${t.name}</b>${t.body ? `<span class="tpl__desc">${MD.esc(t.desc)}</span>` : ''}</button>`).join('')}</div>
        ${m.error ? `<span class="field-error">${MD.esc(m.error)}</span>` : ''}
      </div>
      <div class="modal__foot"><button class="btn" data-action="modal-close">Cancel</button><button class="btn btn--primary" data-action="new-page-go">Create &amp; edit</button></div>
    </div>`;
  } else if (m.kind === 'save-summary') {
    const p = m.preview;
    inner = `<div class="modal save-summary" role="dialog" aria-label="Save changes">
      <div class="modal__head"><h3>${UI.editor?.isNew ? 'Create page' : 'Save changes'}</h3><button class="icon-btn" data-action="modal-close" aria-label="Close">${I.x}</button></div>
      <div class="modal__body">
        <label>Change summary<input class="text-input" data-m="summary" value="${MD.esc(m.summary || '')}" placeholder="${MD.esc(m.suggestedSummary || p?.fallback || '')}" maxlength="120" spellcheck="true" autocorrect="off"></label>
        <p class="save-summary__status" role="alert" ${m.error ? '' : 'hidden'}>${MD.esc(m.error || '')}</p>
        ${p ? `<details class="save-summary__changes"><summary>View changes <span class="save-summary__counts"><span>+${p.add}</span><span>−${p.del}</span></span></summary>
          ${p.titleChanged ? `<p class="save-summary__metadata">Title: ${MD.esc(UI.editor.origTitle)} → ${MD.esc(UI.editor.title.trim())}</p>` : ''}
          ${p.sectionChanged ? `<p class="save-summary__metadata">Section: ${MD.esc(p.input.beforeSection)} → ${MD.esc(p.input.section)}</p>` : ''}
          ${p.lines.length ? `<div class="save-summary__diff">${p.lines.map((line) => `<div class="${line[0] === '+' ? 'diff__line--add' : 'diff__line--del'}">${MD.esc(line)}</div>`).join('')}</div>` : ''}
          ${p.truncated ? '<p class="save-summary__metadata">Showing an excerpt of this edit.</p>' : ''}
          ${!p.hasChanges ? '<p class="save-summary__metadata">No changes to save.</p>' : ''}
        </details>` : ''}
        <div class="page-review" data-page-review ${m.reviewSuggestions?.length ? '' : 'hidden'}>${pageReviewHtml(m)}</div>
      </div>
      <div class="modal__foot"><button class="btn" data-action="modal-close">Keep editing</button><button class="btn btn--primary" data-action="save-commit">Save</button></div>
    </div>`;
  } else if (m.kind === 'invite-mail') {
    const u = Store.user(m.email);
    inner = `<div class="modal modal--wide" role="dialog" aria-label="Welcome email">
      <div class="modal__head"><h3>Welcome email preview</h3><button class="icon-btn" data-action="modal-close" aria-label="Close">${I.x}</button></div>
      <div class="modal__body">
        ${u ? welcomeEmailHtml(u) : ''}
        <p class="admin-block__sub" style="margin:0">No email is sent in this preview.</p>
      </div>
      <div class="modal__foot"><button class="btn btn--primary" data-action="modal-close">Done</button></div>
    </div>`;
  } else if (m.kind === 'interest-pending') {
    inner = interestPendingModalHtml(m.id);
  } else if (m.kind === 'interest-row') {
    inner = interestRowModalHtml(m.id);
  } else if (m.kind === 'interest-email-copy') {
    inner = `<div class="modal" role="dialog" aria-label="Copy selected emails">
      <div class="modal__head"><h3>Selected emails</h3><button class="icon-btn" data-action="modal-close" aria-label="Close">${I.x}</button></div>
      <div class="modal__body"><p>Clipboard access was blocked. Select and copy this comma-separated list.</p>
        <textarea class="text-input" rows="6" readonly aria-label="Selected emails as CSV">${MD.esc(m.csv)}</textarea>
      </div><div class="modal__foot"><button class="btn" data-action="modal-close">Close</button></div>
    </div>`;
  } else if (m.kind === 'confirm') {
    // Optional extras: a free-text field handed to onGo, and a GitHub-style
    // type-to-confirm phrase that keeps the danger button locked until it
    // matches exactly.
    const field = m.field
      ? `<label class="modal-typed">${MD.esc(m.field.label || 'Note')}
          <input class="text-input" data-m="modal-field" value="${MD.esc(m.field.value || '')}" placeholder="${MD.esc(m.field.placeholder || '')}" maxlength="${m.field.maxlength || 280}" autocomplete="off" spellcheck="true"></label>`
      : '';
    const typed = m.typed
      ? `<label class="modal-typed">Type <b class="modal-typed__phrase">${MD.esc(m.typed)}</b> to confirm
          <input class="text-input" data-m="modal-typed" data-phrase="${MD.esc(m.typed)}" placeholder="${MD.esc(m.typed)}" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off"></label>`
      : '';
    inner = `<div class="modal" role="dialog" aria-label="Confirm">
      <div class="modal__head"><h3>${MD.esc(m.title)}</h3></div>
      <div class="modal__body"><p style="margin:0;font-size:14px;color:var(--muted)">${m.text}</p>${field}${typed}</div>
      <div class="modal__foot"><button class="btn" data-action="modal-close">Cancel</button><button class="btn ${m.danger ? 'btn--danger' : 'btn--primary'}" data-action="confirm-go" ${m.typed ? 'disabled' : ''}>${MD.esc(m.confirm || 'Confirm')}</button></div>
    </div>`;
  }
  if (m.kind === 'conflict') {
    inner = `<div class="modal" role="dialog" aria-label="Edit conflict">
      <div class="modal__head"><h3>This page changed while you edited</h3></div>
      <div class="modal__body"><p style="margin:0;font-size:14px;color:var(--muted)">${m.text}</p></div>
      <div class="modal__foot modal__foot--split">
        <button class="btn" data-action="copy-mine">${I.copy} Copy my text</button>
        <a class="btn" href="#/history/${m.pageId}" target="_blank" rel="noopener" style="text-decoration:none">See what changed</a>
        <span style="flex:1"></span>
        <button class="btn" data-action="modal-close">Cancel</button>
        <button class="btn btn--danger" data-action="confirm-go">Save mine anyway</button>
      </div>
    </div>`;
  }
  if (m.kind === 'close-editor') {
    inner = `<div class="modal" role="dialog" aria-label="Unsaved changes">
      <div class="modal__head"><h3>You have unsaved changes</h3></div>
      <div class="modal__body"><p style="margin:0;font-size:14px;color:var(--muted)">Keep the draft to resume later. Discard permanently removes these unsaved changes.</p></div>
      <div class="modal__foot modal__foot--split">
        <button class="btn btn--ghost" data-action="modal-close">Keep editing</button>
        <span style="flex:1"></span>
        <button class="btn btn--danger" data-action="editor-discard-close">Discard changes</button>
        <button class="btn btn--primary" data-action="editor-keep-draft">Keep draft</button>
      </div>
    </div>`;
  }
  if (!inner) inner = viewExtraModal(m);
  return `<div class="modal-veil ${continuing ? 'modal-veil--steady' : ''}" data-action="modal-veil">${inner}</div>`;
}

/* ------------------------------- video hydration -------------------------- */

// The markdown renderer is synchronous, so video facades come out with a
// generic provider label; the real title arrives here from each provider's
// oEmbed endpoint after render. Session caches, because renders happen
// constantly and must never refetch: "provider:id" → { title, thumb } (either
// may be null), null after a failed fetch, or a Promise while one is in
// flight. Every failure path stays silent — the facade keeps its provider
// label and dark ground, which is all the artifact preview's CSP ever shows.
const videoMeta = new Map();
// "provider:id" → the thumbnail URL that actually loaded, '' when every
// candidate failed — re-renders neither re-probe dead URLs nor re-walk chains.
const videoThumbSrc = new Map();

// All three endpoints answer browser CORS: youtube.com/oembed echoes any
// Origin (including the null of a file:// preview), vimeo.com and loom.com
// send access-control-allow-origin: *.
const VIDEO_OEMBED = {
  youtube: (id) => `https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + id)}&format=json`,
  vimeo: (id) => `https://vimeo.com/api/oembed.json?url=${encodeURIComponent('https://vimeo.com/' + id)}`,
  loom: (id) => `https://www.loom.com/v1/oembed?url=${encodeURIComponent('https://www.loom.com/share/' + id)}`,
};

// Walk a facade thumbnail down its candidate list. onerror alone is not
// enough: YouTube answers maxresdefault/sddefault requests for videos that
// lack them with a gray 120×90 placeholder the browser loads as a success,
// so the onload check steps past anything placeholder-sized. A dead end
// removes the img and leaves the clean dark facade.
function wireVideoThumb(img, key, chain, i) {
  const next = () => {
    if (i + 1 < chain.length) wireVideoThumb(img, key, chain, i + 1);
    else { videoThumbSrc.set(key, ''); img.remove(); }
  };
  img.onload = () => { if (img.naturalWidth <= 120) next(); else videoThumbSrc.set(key, chain[i]); };
  img.onerror = next;
  if (img.getAttribute('src') !== chain[i]) img.src = chain[i];
}

function applyVideoMeta(face, meta) {
  const tag = $('.video-embed__tag', face);
  if (tag && meta.title && tag.textContent !== meta.title) {
    tag.title = tag.textContent; // the provider label stays, one hover away
    tag.textContent = meta.title; // textContent, so the title can't inject markup
    face.setAttribute('aria-label', `Play ${meta.title} (${tag.title})`);
  }
  // Vimeo and Loom have no guessable thumbnail URL — backfill from oEmbed.
  const key = `${face.dataset.provider}:${face.dataset.vid}`;
  const known = videoThumbSrc.get(key);
  if (!$('.video-embed__thumb', face) && known !== '' && /^https:\/\//.test(known || meta.thumb || '')) {
    const img = document.createElement('img');
    img.className = 'video-embed__thumb';
    img.alt = '';
    img.loading = 'lazy';
    face.prepend(img);
    wireVideoThumb(img, key, [known || meta.thumb], 0);
  }
}

function mountVideoMeta(face) {
  const provider = face.dataset.provider, id = face.dataset.vid || '';
  const oembed = VIDEO_OEMBED[provider];
  if (face._videoMounted || !oembed || !/^[\w-]{6,40}$/.test(id)) return;
  face._videoMounted = true;
  const key = `${provider}:${id}`;

  const img = $('.video-embed__thumb', face);
  if (img) {
    const known = videoThumbSrc.get(key);
    if (known !== undefined) {
      if (known) wireVideoThumb(img, key, [known], 0); else img.remove();
    } else if (provider === 'youtube') {
      wireVideoThumb(img, key, ['maxresdefault', 'sddefault', 'hqdefault'].map((n) => `https://i.ytimg.com/vi/${id}/${n}.jpg`), 0);
    }
  }

  const cached = videoMeta.get(key);
  if (cached === undefined) {
    videoMeta.set(key, fetch(oembed(id))
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => (j && typeof j.title === 'string' ? { title: j.title, thumb: typeof j.thumbnail_url === 'string' ? j.thumbnail_url : null } : null))
      .catch(() => null)
      .then((meta) => {
        videoMeta.set(key, meta);
        // The render that queued this fetch may be gone — hydrate whatever
        // facades for this video are on screen now; later renders read the cache.
        if (meta) $$(`.video-embed__face[data-provider="${provider}"][data-vid="${id}"]`).forEach((f) => applyVideoMeta(f, meta));
      }));
  } else if (cached && !(cached instanceof Promise)) {
    applyVideoMeta(face, cached);
  }
}

/* ------------------------------- render ---------------------------------- */

function renderBackground(routeName) {
  if (UI.route.name !== routeName) return;
  if (UI.editor || UI.modal || UI.palette || UI.menu) { UI._backgroundRoute = routeName; return; }
  UI._backgroundRoute = null;
  render();
}

function render() {
  const modalScroll = UI.modal && UI._shownModal === UI.modal ? $('.modal__body')?.scrollTop : undefined;
  // Dialogs and late callbacks must not replace a mounted editor's textarea.
  // Its native undo history cannot be reconstructed from a string snapshot.
  if (Store.me() && UI.editor && UI._mountedEditor === UI.editor && $('.editor')) {
    captureModalFocus();
    document.querySelector('.modal-veil')?.remove();
    if (UI.modal) document.body.insertAdjacentHTML('beforeend', viewModal());
    const oldPalette = $('.palette-veil');
    const samePalette = UI.palette && UI._mountedPalette === UI.palette && oldPalette;
    if (!samePalette) {
      oldPalette?.remove();
      if (UI.palette) document.body.insertAdjacentHTML('beforeend', viewPalette());
    }
    UI._mountedPalette = UI.palette;
    syncSidebarInteraction();
    if (UI.modal) mountModalFocus();
    if (modalScroll !== undefined && $('.modal__body')) $('.modal__body').scrollTop = modalScroll;
    if (UI.palette && !samePalette) $('.palette input')?.focus();
    syncMeaningSearch();
    syncPageReview();
    syncChangeSummary();
    syncAiUsage();
    return;
  }
  cadCleanups.forEach((fn) => fn());
  cadCleanups = [];
  window.__closeMenu?.();
  captureModalFocus();
  document.querySelectorAll('body > .modal-veil').forEach((v) => v.remove());
  killPreview(); // a hover preview must not outlive the page it points into
  const app = $('#app');
  const me = Store.me();
  let view = '';
  const r = UI.route;

  // Re-renders of the same route (checkbox ticks, comments, stars) must not
  // throw the reader back to the top of the page.
  const prevSidebar = $('.sidebar__scroll');
  const sidebarScroll = prevSidebar ? prevSidebar.scrollTop : 0;
  const prevContent = $('.content');
  const keepScroll = prevContent && UI._lastRouteKey === r.name + '/' + (r.params.id || '');
  const scrollTop = keepScroll ? prevContent.scrollTop : 0;
  UI._lastRouteKey = r.name + '/' + (r.params.id || '');

  if (!me) {
    app.innerHTML = viewLogin();
    stopMeaningSearch('home'); stopMeaningSearch('modal');
    cancelPageReview(pageReviewEditor);
    cancelChangeSummary(summaryEditor);
    syncSidebarInteraction();
    return;
  }
  if (UI.editor) view = viewEditor();
  else if (r.name === 'home') view = topbar('<span class="crumbs__here">Home</span>') + `<div class="content search-home-content">${viewSearchHome()}</div>`;
  else if (r.name === 'page') view = viewPage(r.params.id || 'welcome');
  else if (r.name === 'history') view = viewHistory(r.params.id);
  else if (r.name === 'activity') view = viewActivity();
  else if (r.name === 'admin') view = viewAdmin();
  else if (r.name === 'integrations') view = viewIntegrations();
  else if (r.name === 'interest') view = viewInterest();
  else if (r.name === 'recruit') view = viewRecruit();
  else if (r.name === 'trash') view = viewTrash();
  else if (r.name === 'health') view = viewHealth();
  else if (r.name === 'new') {
    // Re-renders while typing must not rebuild editor state from the stash:
    // the autosave is debounced, so the stash can trail the textarea by 900ms.
    if (!UI.editor || !UI.editor.isNew) {
      const draft = draftStash.get('new');
      openEditor(null, true, draft || { title: r.params.title || '', section: r.params.section || 'projects' });
      if (draft) { UI.editor.dirty = true; UI.editor.fromDraft = true; }
    }
    view = viewEditor();
  }
  else if (r.name === 'edit' && Store.page(r.params.id)) {
    if (!UI.editor || UI.editor.pageId !== r.params.id) {
      const draft = draftStash.get(r.params.id);
      openEditor(r.params.id, false, draft);
      if (draft) { UI.editor.dirty = true; UI.editor.fromDraft = true; }
    }
    view = viewEditor();
  }
  else view = topbar('<span class="crumbs__here">Home</span>') + `<div class="content search-home-content">${viewSearchHome()}</div>`;

  const adminForms = ADMIN_FORM_ROUTES.includes(r.name) && UI._mountedRoute === r.name && !UI.editor && (Store.isAdmin() || r.name === 'recruit')
    ? [...document.querySelectorAll('form[data-action]')].filter((form) => form.dataset.adminDirty === 'true' || form.dataset.adminPending === 'true') : [];
  const adminFocus = adminForms.some((form) => form.contains(document.activeElement)) ? document.activeElement : null;
  const palette = UI.palette && UI._mountedPalette === UI.palette ? $('.palette-veil') : null;
  const paletteFocus = palette?.contains(document.activeElement) ? document.activeElement : null;
  app.innerHTML = `<div class="shell ${UI.navOpen ? 'nav-open' : ''} ${UI.navHidden ? 'nav-hidden' : ''}">
    ${viewSidebar()}
    <main class="main">${view}</main>
    <div class="shell__scrim" data-action="nav-close"></div>
  </div>${viewPalette()}${viewModal()}`;

  for (const form of adminForms) {
    const selector = `form[data-action="${form.dataset.action}"]${form.classList.contains('integration__editor') ? '.integration__editor' : ':not(.integration__editor)'}`;
    const next = document.querySelector(selector);
    if (next) { next.replaceWith(form); const disclosure = form.closest('details'); if (disclosure) disclosure.open = true; }
  }
  if (palette) $('.palette-veil')?.replaceWith(palette);
  UI._mountedPalette = UI.palette;
  UI._mountedRoute = r.name;
  UI._mountedEditor = UI.editor;
  if (UI.editor) UI._editorLocation = location.pathname + location.search + location.hash;
  syncSidebarInteraction();
  adminFocus?.focus({ preventScroll: true });
  paletteFocus?.focus({ preventScroll: true });
  if (palette && !UI.palette.composing) renderSearchList('modal');
  $$('.ai-settings [data-m]').forEach((el) => el.setAttribute('aria-labelledby', el.dataset.m + '-label'));

  const editorToggled = UI._hadEditor !== !!UI.editor;
  UI._hadEditor = !!UI.editor;
  if (UI.editor && editorToggled) $('.editor')?.classList.add('editor-in');

  if (keepScroll) { const c = $('.content'); if (c) c.scrollTop = scrollTop; }
  { const sb = $('.sidebar__scroll'); if (sb) sb.scrollTop = sidebarScroll; }

  // Mount hooks.
  if (r.name === 'interest' && $('.sheet')) renderInterestSelection();
  mountSearchHome();
  syncMeaningSearch();
  syncPageReview();
  syncChangeSummary();
  syncAiUsage();
  $$('.cad-embed').forEach(mountCadViewer);
  mountTableSort();
  if (typeof REMOTE !== 'undefined' && r.name === 'integrations' && !UI.editor && UI.resendDomains === undefined && Store.isAdmin()) {
    const es = Store.emailSettings();
    if (es.oauthConnected || es.keySet || es.envKeySet) {
      UI.resendDomains = 'pending';
      api('/resend/domains').then((out) => { UI.resendDomains = out.domains; renderBackground('integrations'); }).catch(() => { UI.resendDomains = null; });
    }
  }
  // The interest component loads from its own endpoint the first time its
  // screen opens; Refresh clears the cache to refetch.
  if (typeof REMOTE !== 'undefined' && r.name === 'interest' && UI.interest === undefined && Store.isAdmin()) {
    UI.interest = { loading: true };
    api('/interest')
      .then((out) => {
        UI.interest = {
          rows: out.rows || [],
          pendingReview: Array.isArray(out.pendingReview) ? out.pendingReview : [],
          queueUnavailable: Boolean(out.queueUnavailable),
        };
        renderBackground('interest');
      })
      .catch((e) => { UI.interest = { error: e.message || 'load failed' }; renderBackground('interest'); });
  }
  if (typeof REMOTE !== 'undefined' && r.name === 'interest' && UI.interestArchives === undefined && Store.isAdmin()) {
    UI.interestArchives = { list: [] };
    api('/interest/archives')
      .then((out) => { UI.interestArchives = { list: out.archives || [] }; renderBackground('interest'); })
      .catch(() => { /* the archive shelf is a courtesy */ });
  }
  // Opening one archive pulls its rows once.
  if (typeof REMOTE !== 'undefined' && UI.interestArchiveView?.loading === true && UI.interestArchiveView.id) {
    const id = UI.interestArchiveView.id;
    api(`/interest/archives/${id}`)
      .then((out) => {
        if (UI.interestArchiveView?.id === id) { UI.interestArchiveView = { id, archive: out.archive }; renderBackground('interest'); }
      })
      .catch(() => {
        if (UI.interestArchiveView?.id === id) { UI.interestArchiveView = { id, error: true }; renderBackground('interest'); }
      });
    UI.interestArchiveView.loading = 'pending';
  }
  if (typeof RECRUIT !== 'undefined') RECRUIT.mount(r);
  $$('.video-embed__face').forEach(mountVideoMeta);
  if (UI.editor) {
    edUpdatePreview();
    const src = $('[data-ed="body"]');
    const prev = $('.editor__pane--preview');
    if (src && prev && !src._syncBound) {
      src._syncBound = true;
      src.addEventListener('scroll', () => {
        const ratio = src.scrollTop / Math.max(1, src.scrollHeight - src.clientHeight);
        prev.scrollTop = ratio * (prev.scrollHeight - prev.clientHeight);
      }, { passive: true });
    }
    const ta = $('[data-ed="body"]');
    if (ta && !UI.editor._focused) { (UI.editor.isNew && !UI.editor.title ? $('[data-ed="title"]') : ta)?.focus(); UI.editor._focused = true; }
  }
  if (UI.palette && !palette) { const inp = $('.palette input'); inp?.focus(); inp?.setSelectionRange(inp.value.length, inp.value.length); }
  if (UI.modal) mountModalFocus();
  if (modalScroll !== undefined && $('.modal__body')) $('.modal__body').scrollTop = modalScroll;
  if (UI.modal?.kind === 'bug') mountBugDrop();
  const anchorKey = r.name === 'page' && r.params.anchor ? r.params.id + '#' + r.params.anchor : null;
  const landAnchor = anchorKey && UI._landedAnchor !== anchorKey;
  UI._landedAnchor = anchorKey;
  if (landAnchor) {
    const el = $('#' + CSS.escape(r.params.anchor));
    const c = $('.content');
    if (el && c) {
      const land = () => { if (!c.isConnected || UI._landedAnchor !== anchorKey) return; c.scrollTop = c.scrollTop + el.getBoundingClientRect().top - c.getBoundingClientRect().top - 68; };
      land();
      // media above the heading can size in after the first paint and push it
      requestAnimationFrame(land);
      UI._tocPin = el.id;
    }
  }
  mountTocSpy();
}

function mountTocSpy() {
  const content = $('[data-toc-root]');
  const links = $$('.toc a');
  if (!content || !links.length) return;
  const heads = links.map((a) => document.getElementById(a.dataset.toc)).filter(Boolean);
  const spy = () => {
    let cur = heads[0];
    for (const h of heads) if (h.getBoundingClientRect().top < 120) cur = h;
    // At the very bottom the last section may be too short to cross the line,
    // yet it is where the reader was taken — highlight it, not its neighbor.
    if (content.scrollTop + content.clientHeight >= content.scrollHeight - 2) cur = heads[heads.length - 1];
    const pin = UI._tocPin && heads.find((h) => h.id === UI._tocPin);
    if (pin) cur = pin;
    links.forEach((a) => a.classList.toggle('here', a.dataset.toc === cur?.id));
  };
  const unpin = () => { if (UI._tocPin) { UI._tocPin = null; spy(); } };
  content.addEventListener('wheel', unpin, { passive: true });
  content.addEventListener('touchmove', unpin, { passive: true });
  content.addEventListener('scroll', spy, { passive: true });
  spy();
}

/* ============================================================================
   UI part 3 — the maintenance and cross-subteam layer: reactions, health,
   wiki health, tag browsing, hover previews, sortable tables, shortcuts.
   ========================================================================== */

'use strict';

/* --------------------------- store extensions ----------------------------- */

Object.assign(Store, {

  duplicatePage(id) {
    const p = Store.page(id);
    if (!p) return null;
    let title = p.title + ' (copy)';
    let n = 2;
    while (Store.pageByTitle(title)) title = `${p.title} (copy ${n++})`;
    return Store.createPage({ title, section: p.section, parent: p.parent, body: p.body, tags: [...p.tags] });
  },

  movePage(id, { section }) {
    const p = Store.page(id);
    if (!p) return;
    p.section = String(section || p.section);
    p.parent = null;
    Store.log({ kind: 'move', by: Store.me().email, pageId: id });
    Store.persist();
    Store.reindex();
  },

  health() {
    const broken = [];   // {page, target}
    const orphans = [];  // pages nothing links to and no children
    const stale = [];    // not touched in 90 days
    const linkedTo = new Set();
    for (const p of Store.s.pages) {
      for (const t of Store.linkIndex.get(p.id) || []) {
        const target = Store.titleIndex.get(t);
        if (target) linkedTo.add(target.id);
        else broken.push({ page: p, target: t });
      }
    }
    for (const p of Store.s.pages) {
      if (p.id === 'welcome') continue;
      if (!linkedTo.has(p.id) && !Store.childrenOf(p.id).length && !p.parent) orphans.push(p);
      if (Date.now() - p.updated > 90 * 864e5) stale.push(p);
    }
    return { broken, orphans, stale: stale.sort((a, b) => a.updated - b.updated) };
  },
});


/* --------------------------- health view ---------------------------------- */

function viewHealth() {
  const { broken, orphans, stale } = Store.health();
  const attMb = (Store.attTotal() / 1048576).toFixed(1);
  const rows = (list, empty, row) => list.length ? list.map(row).join('') : `<div class="audit__row"><span class="audit__what" style="color:var(--faint)">${empty}</span></div>`;
  return topbar(`<a href="#/home">Wiki</a><span class="crumbs__sep">/</span><span class="crumbs__here">Wiki health</span>`) + `
  <div class="content"><div class="page-wrap"><div class="page-col">
    <div class="plain-head"><h1>Wiki health</h1></div>
    <div class="admin-grid">
      <section class="admin-block">

/* --------------------------- hover previews ------------------------------- */

let previewPop = null, previewTmr = null;

function killPreview() {
  clearTimeout(previewTmr);
  previewTmr = null;
  previewPop?.remove();
  previewPop = null;
}

document.addEventListener('pointerover', (ev) => {
  if (!matchMedia('(hover: hover)').matches) return; // touch devices: taps navigate
  if (UI.modal || UI.palette) return;
  const a = ev.target.closest('a.wikilink:not(.wikilink--missing)');
  if (!a || a.closest('.ed-autocomplete')) { return; }
  clearTimeout(previewTmr);
  previewTmr = setTimeout(() => {
    const m = (a.getAttribute('href') || '').match(/#\/page\/([^#]+)/);
    const p = m && Store.page(m[1]);
    if (!p) return;
    killPreview();
    previewPop = document.createElement('div');
    previewPop.className = 'linkpreview';
    const txt = MD.mdToText(p.body).slice(0, 220);
    previewPop.innerHTML = `<b>${MD.esc(p.title)}</b><span class="linkpreview__meta">${SECTIONS.find((s) => s.id === p.section)?.name || ''} · ${MD.esc(Store.userName(p.updatedBy))} · ${relTime(p.updated)}</span><p>${MD.esc(txt)}${txt.length >= 220 ? '…' : ''}</p>`;
    document.body.appendChild(previewPop);
    const viewport = window.visualViewport;
    const left = (viewport?.offsetLeft || 0) + 8, top = (viewport?.offsetTop || 0) + 8;
    const right = left + Math.max(1, (viewport?.width || innerWidth) - 16);
    const bottom = top + Math.max(1, (viewport?.height || innerHeight) - 16);
    previewPop.style.maxWidth = (right - left) + 'px';
    previewPop.style.maxHeight = (bottom - top) + 'px';
    const r = a.getBoundingClientRect(), w = previewPop.offsetWidth, h = previewPop.offsetHeight;
    previewPop.style.left = Math.max(left, Math.min(r.left, right - w)) + 'px';
    const preferredTop = r.bottom + h + 8 > bottom ? r.top - h - 8 : r.bottom + 8;
    previewPop.style.top = Math.max(top, Math.min(preferredTop, bottom - h)) + 'px';
  }, 420);
}, true);

document.addEventListener('pointerout', (ev) => {
  if (ev.target.closest && ev.target.closest('a.wikilink')) killPreview();
}, true);
document.addEventListener('pointerdown', killPreview, true);

/* --------------------------- sortable tables ------------------------------ */

function mountTableSort() {
  if (UI.editor) return;
  for (const th of $$('.prose th')) {
    if (th.closest?.('.tpl__thumb')) continue;
    if (th.querySelector('[data-table-sort]') || th.dataset.tableSortHeader !== undefined) continue;
    th.setAttribute('scope', 'col');
    th.setAttribute('aria-sort', 'none');
    if (th.querySelector('a, button, input, textarea, summary, [contenteditable="true"]')) {
      // Some headings link to another article. Keep that link and provide a
      // separate keyboard stop for sorting rather than nesting controls.
      th.tabIndex = 0;
      th.dataset.tableSortHeader = '';
      th.setAttribute('aria-label', th.textContent.trim() + ', sort ascending');
      th.setAttribute('aria-keyshortcuts', 'Enter Space');
      continue;
    }
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.tableSort = '';
    button.style.textAlign = 'inherit';
    button.setAttribute('aria-label', th.textContent.trim() + ', sort ascending');
    while (th.firstChild) button.appendChild(th.firstChild);
    th.appendChild(button);
  }
}

function sortArticleTable(th) {
  if (!th || UI.editor) return;
  const table = th.closest('table');
  const idx = [...th.parentNode.children].indexOf(th);
  const tbody = table?.tBodies[0];
  if (!tbody) return;
  const rows = [...tbody.rows];
  const dir = th.dataset.sort === 'asc' ? -1 : 1;
  table.querySelectorAll('th').forEach((h) => {
    delete h.dataset.sort;
    h.setAttribute('aria-sort', 'none');
    h.querySelector('[data-table-sort]')?.setAttribute('aria-label', h.textContent.trim() + ', sort ascending');
    if (h.dataset.tableSortHeader !== undefined) h.setAttribute('aria-label', h.textContent.trim() + ', sort ascending');
  });
  th.dataset.sort = dir === 1 ? 'asc' : 'desc';
  th.setAttribute('aria-sort', dir === 1 ? 'ascending' : 'descending');
  th.querySelector('[data-table-sort]')?.setAttribute('aria-label', th.textContent.trim() + (dir === 1 ? ', sort descending' : ', sort ascending'));
  if (th.dataset.tableSortHeader !== undefined) th.setAttribute('aria-label', th.textContent.trim() + (dir === 1 ? ', sort descending' : ', sort ascending'));
  const num = (s) => { const n = parseFloat(String(s).replace(/[^0-9.eE-]/g, '')); return isNaN(n) ? null : n; };
  rows.sort((a, b) => {
    const av = a.cells[idx]?.textContent.trim() ?? '', bv = b.cells[idx]?.textContent.trim() ?? '';
    const an = num(av), bn = num(bv);
    if (an !== null && bn !== null) return (an - bn) * dir;
    return av.localeCompare(bv) * dir;
  });
  rows.forEach((r) => tbody.appendChild(r));
}

document.addEventListener('click', (ev) => {
  const th = ev.target.closest('.prose th');
  if (!th || ev.target.closest('a, input, textarea, summary, [contenteditable="true"]')) return;
  sortArticleTable(th);
});
document.addEventListener('keydown', (ev) => {
  if (ev.isComposing || !['Enter', ' '].includes(ev.key) || !ev.target.matches?.('[data-table-sort-header]')) return;
  ev.preventDefault();
  sortArticleTable(ev.target);
});

/* ============================================================================
   Search — member-visible pages, tags, and filenames referenced by those pages.
   No separate index is persisted, so edits, deleted pages, and permission changes
   are reflected on the next query. File contents are not indexed.
   ========================================================================== */

'use strict';

const WikiSearch = (() => {
  const types = [
    { id: 'project', label: 'Projects', single: 'Project', tags: ['project', 'platform', 'competition'] },
    { id: 'procedure', label: 'Procedures', single: 'Procedure', tags: ['procedure', 'standard', 'checklist', 'runbook'] },
    { id: 'test', label: 'Test records', single: 'Test record', tags: ['test', 'test-record', 'test-results'] },
    { id: 'decision', label: 'Decisions', single: 'Decision', tags: ['decision', 'adr'] },
    { id: 'configuration', label: 'Configurations', single: 'Configuration', tags: ['configuration'] },
    { id: 'design', label: 'Design documents', single: 'Design document', tags: ['design', 'design-doc', 'board'] },
    { id: 'meeting', label: 'Meeting notes', single: 'Meeting notes', tags: ['meeting'] },
    { id: 'page', label: 'Other pages', single: 'Page', tags: [] },
  ];
  const statuses = [
    { id: 'reviewed', label: 'Reviewed' },
    { id: 'needs-review', label: 'Needs review' },
    { id: 'draft', label: 'Draft' },
    { id: 'superseded', label: 'Superseded' },
    { id: 'unreviewed', label: 'No review label' },
  ];
  const normalize = (value) => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const words = (value) => normalize(value).match(/[\p{L}\p{N}]+/gu) || [];
  const terms = (value) => [...new Set(words(String(value || '').slice(0, 300)))].slice(0, 12);
  const tagsOf = (page) => (Array.isArray(page.tags) ? page.tags : []).map(normalize);
  const typeOf = (page) => {
    const tags = tagsOf(page);
    return types.find((type) => type.tags.some((tag) => tags.includes(tag))) || types[types.length - 1];
  };
  // A recent edit is not evidence of review. Only explicit tags set a status.
  const statusOf = (page) => {
    const tags = tagsOf(page);
    const status = ['superseded', 'needs-review', 'draft', 'reviewed'].find((tag) => tags.includes(tag)) || 'unreviewed';
    return statuses.find((item) => item.id === status);
  };
  const projectRoots = (pages) => pages.filter((page) => tagsOf(page).includes('project')
    || (page.section === 'projects' && !page.parent && ['project', 'page'].includes(typeOf(page).id)));
  const projectIds = (page, roots, byId) => {
    const rootIds = new Set(roots.map((root) => root.id));
    if (rootIds.has(page.id)) return [page.id];
    const ancestors = new Set([page.id]);
    let parent = page.parent;
    while (parent && !ancestors.has(parent)) {
      // The nearest project ancestor wins over a stale or broad project tag.
      if (rootIds.has(parent)) return [parent];
      ancestors.add(parent);
      parent = byId.get(parent)?.parent;
    }
    const tags = tagsOf(page);
    const explicit = roots.filter((root) => tags.includes(normalize(root.id)));
    if (explicit.length) return explicit.map((root) => root.id);
    return roots.filter((root) => {
      const uniqueTags = tagsOf(root).filter((tag) => !types.some((type) => type.tags.includes(tag))
        && !statuses.some((status) => status.id === tag)
        && !roots.some((other) => other.id !== root.id && tagsOf(other).includes(tag)));
      return uniqueTags.some((tag) => tags.includes(tag));
    }).map((root) => root.id);
  };
  function documents(pages, getAttachment, plainText) {
    const roots = projectRoots(pages), byId = new Map(pages.map((page) => [page.id, page]));
    return pages.map((page) => {
      const body = String(page.body || '');
      // Resolve references only; never enumerate files from an intake or archive.
      const attachments = [...new Set([...body.matchAll(/att:([A-Za-z0-9-]+)/g)].map((match) => match[1]))]
        .map((id) => getAttachment(id)).filter((file) => file && typeof file.name === 'string');
      const text = plainText(body).replace(/\s*\|\s*/g, ' · ').replace(/\s+/g, ' ').trim();
      const fields = [
        { kind: 'title', value: String(page.title || ''), weight: 12 },
        { kind: 'tag', value: (page.tags || []).join(' '), weight: 8 },
        ...attachments.map((file) => ({ kind: 'file', value: file.name, weight: 9, file })),
        { kind: 'body', value: text, weight: 2 },
      ].map((field) => ({ ...field, normalized: normalize(field.value), words: words(field.value) }));
      return { page, text, fields, attachments, type: typeOf(page), status: statusOf(page), projects: projectIds(page, roots, byId) };
    });
  }
  // One mistyped, missing, extra, or transposed character. Restrict to words of
  // four characters or more so short part numbers never become broad guesses.
  function nearWord(a, b) {
    if (a.length < 4 || Math.abs(a.length - b.length) > 1) return false;
    if (a === b) return true;
    if (a.length === b.length) {
      const differences = [];
      for (let index = 0; index < a.length; index++) if (a[index] !== b[index]) differences.push(index);
      return differences.length === 1 || (differences.length === 2 && differences[1] === differences[0] + 1 && a[differences[0]] === b[differences[1]] && a[differences[1]] === b[differences[0]]);
    }
    const short = a.length < b.length ? a : b, long = a.length < b.length ? b : a;
    let index = 0;
    while (index < short.length && short[index] === long[index]) index++;
    return short.slice(index) === long.slice(index + 1);
  }
  function snippet(text, queryTerms) {
    const normalized = normalize(text);
    const positions = queryTerms.map((term) => normalized.indexOf(term)).filter((position) => position >= 0);
    let start = positions.length ? Math.max(0, Math.min(...positions) - 42) : 0;
    if (start) {
      const boundary = text.indexOf(' ', start);
      if (boundary !== -1 && boundary - start < 20) start = boundary + 1;
    }
    const end = Math.min(text.length, start + 180);
    return (start ? '…' : '') + text.slice(start, end).trim() + (end < text.length ? '…' : '');
  }
  function run(docs, query = '', filters = {}, recents = [], limit = 30) {
    const queryTerms = terms(query), phrase = normalize(query).trim();
    const eligible = docs.filter((doc) => (!filters.section || doc.page.section === filters.section)
      && (!filters.project || doc.projects.includes(filters.project))
      && (!filters.type || doc.type.id === filters.type)
      && (!filters.status || doc.status.id === filters.status));
    let items = eligible.map((doc) => {
      let score = 0, hits = 0, approximate = 0;
      const matchKinds = new Set(), matchedFiles = new Set();
      for (const term of queryTerms) {
        let best = 0, guessed = false;
        for (const field of doc.fields) {
          let strength = 0;
          if (field.words.includes(term)) strength = 4;
          else if (field.normalized.includes(term)) strength = 2;
          if (strength) {
            best = Math.max(best, strength * field.weight);
            matchKinds.add(field.kind);
            if (field.file) matchedFiles.add(field.file.name);
          }
        }
        if (!best) {
          for (const field of doc.fields.filter((field) => field.kind !== 'body')) {
            if (field.words.some((word) => nearWord(term, word))) {
              best = Math.max(best, field.weight);
              guessed = true;
              matchKinds.add(field.kind);
              if (field.file) matchedFiles.add(field.file.name);
            }
          }
        }
        if (best) { hits++; score += best; if (guessed) approximate++; }
      }
      if (phrase && doc.fields[0].normalized === phrase) score += 150;
      else if (phrase && doc.fields[0].normalized.includes(phrase)) score += 55;
      if (queryTerms.length && hits === queryTerms.length) score += 120;
      return { ...doc, score, hits, approximate, matchKinds: [...matchKinds], matchedFiles: [...matchedFiles], snip: snippet(doc.text, queryTerms) };
    }).filter((item) => !queryTerms.length || item.hits > 0);
    // Prefer a complete answer over a long list of pages matching one word.
    const complete = items.filter((item) => item.hits === queryTerms.length);
    const partial = !!queryTerms.length && !complete.length && !!items.length;
    if (queryTerms.length && complete.length) items = complete;
    const recentOrder = new Map(recents.map((id, index) => [id, index]));
    items.sort((a, b) => {
      if (queryTerms.length) return b.hits - a.hits || a.approximate - b.approximate || b.score - a.score || Number(b.page.updated || 0) - Number(a.page.updated || 0) || a.page.title.localeCompare(b.page.title);
      return (recentOrder.get(a.page.id) ?? Infinity) - (recentOrder.get(b.page.id) ?? Infinity) || Number(b.page.updated || 0) - Number(a.page.updated || 0) || a.page.title.localeCompare(b.page.title);
    });
    return { items: items.slice(0, limit), total: items.length, partial, kind: queryTerms.length ? 'search' : 'browse' };
  }
  function highlight(value, query, escape) {
    const parts = terms(query).sort((a, b) => b.length - a.length);
    if (!parts.length) return escape(value);
    // Terms are letters and numbers only; none can inject a regex or markup.
    const pattern = new RegExp('(' + parts.join('|') + ')', 'giu');
    return String(value || '').split(pattern).map((part, index) => index % 2 ? '<mark>' + escape(part) + '</mark>' : escape(part)).join('');
  }
  return { types, statuses, terms, normalize, typeOf, statusOf, projectRoots, documents, run, nearWord, highlight };
})();

    const state = searchHomeState();
    if (typeof query === 'string') state.q = query;
    if (filters) { state.filters = { ...filters }; state.filtersOpen = true; }
    const input = $('input', home);
    input.value = state.q;
    searchRefreshFilters('home');
    input.focus();
    return;
  }
  searchReturnFocus = document.activeElement;
  UI.palette = { q: typeof query === 'string' ? query : '', sel: 0, filters: { ...(filters || {}) }, filtersOpen: !!filters };
  render();
  $('.search-palette input')?.focus();
}

function searchResults(state) {
  if (!Store.me()) return { items: [], total: 0, kind: 'browse', partial: false };
  const documents = WikiSearch.documents(Store.s.pages, (id) => Store.att(id), (body) => MD.mdToText(body));
  const discovering = !state.q.trim() && !Object.values(state.filters || {}).some(Boolean);
  const local = WikiSearch.run(documents, state.q, state.filters || {}, Store.prefs().recents || [], discovering ? 4 : 30);
  if (state.meaning?.key === searchMeaningKey(state) && state.meaning.available && state.meaning.ids?.length) {
    const eligible = WikiSearch.run(documents, '', state.filters || {}, [], documents.length).items;
    const suggested = state.meaning.ids.map((id) => eligible.find((doc) => doc.page.id === id)).filter(Boolean).map((doc) => ({ ...doc, meaning: true }));
    // An exact page title is an intentional destination. Background meaning
    // matches may improve discovery without displacing that destination.
    const query = WikiSearch.normalize(state.q).trim();
    const exact = local.items.filter((doc) => WikiSearch.normalize(doc.page.title).trim() === query);
    const exactIds = new Set(exact.map((doc) => doc.page.id));
    const ids = new Set([...exactIds, ...suggested.map((doc) => doc.page.id)]);
    const ranked = [...exact, ...suggested.filter((doc) => !exactIds.has(doc.page.id)), ...local.items.filter((doc) => !ids.has(doc.page.id))];
    const pinned = state.meaning.pinnedIds || [];
    const items = [...pinned.map((id) => ranked.find((doc) => doc.page.id === id)).filter(Boolean), ...ranked.filter((doc) => !pinned.includes(doc.page.id))].slice(0, 30);
    return { ...local, items, total: items.length, partial: false, semantic: true };
  }
  return local;
}

function searchMeaningKey(state) {
  return JSON.stringify([state.q.trim(), state.filters || {}, Store.s.pages.map((p) => [p.id, p.updated, p.section, p.tags])]);
}

function stopMeaningSearch(mode) {
  const work = searchMeaningWork.get(mode);
  if (!work) return;
  clearTimeout(work.timer);
  work.controller.abort();
  if (work.state.meaning === work.result && work.result.loading) work.state.meaning = null;
  searchMeaningWork.delete(mode);
}

function meaningSearchVisible(mode) {
  return typeof REMOTE !== 'undefined' && Store.me() && !document.hidden && !UI.modal && (!UI.editor || mode === 'modal')
    && (mode === 'modal' ? !!UI.palette : !UI.palette) && searchSurface(mode);
}

function scheduleMeaningSearch(mode) {
  const state = searchState(mode);
  if (!state || !meaningSearchVisible(mode) || state.composing || state.q.trim().length < 3) { stopMeaningSearch(mode); return; }
  const key = searchMeaningKey(state), work = searchMeaningWork.get(mode);
  if (work?.state === state && work.key === key) return;
  stopMeaningSearch(mode);
  // Completed and failed requests both settle this query. Rendering and remote
  // polling must not turn a provider outage into a background retry loop.
  if (state.meaning?.key === key && !state.meaning.loading) return;
  const next = { state, key, controller: new AbortController(), result: { key, loading: true } };
  state.meaning = next.result;
  searchMeaningWork.set(mode, next);
  next.timer = setTimeout(() => searchByMeaning(mode, next), 350);
}

function syncMeaningSearch() {
  scheduleMeaningSearch('home');
  scheduleMeaningSearch('modal');
}

async function searchByMeaning(mode, work) {
  const { state, key, result } = work;
  if (searchMeaningWork.get(mode) !== work || searchState(mode) !== state || searchMeaningKey(state) !== key || !meaningSearchVisible(mode)) {
    if (searchMeaningWork.get(mode) === work) stopMeaningSearch(mode);
    return;
  }
  const docs = WikiSearch.documents(Store.s.pages, (id) => Store.att(id), (body) => MD.mdToText(body));
  const eligible = WikiSearch.run(docs, '', state.filters || {}, [], docs.length).items;
  // Mix keyword candidates with pages from every section, keeping requests small.
  const literal = WikiSearch.run(docs, state.q, state.filters || {}, [], 16).items;
  const chosen = new Map(literal.map((doc) => [doc.page.id, doc]));
  const groups = SECTIONS.map((section) => eligible.filter((doc) => doc.page.section === section.id));
  for (let i = 0; chosen.size < 32 && groups.some((group) => i < group.length); i++) {
    for (const group of groups) if (group[i] && chosen.size < 32) chosen.set(group[i].page.id, group[i]);
  }
  const candidates = [...chosen.values()].map((doc) => ({ id: doc.page.id, title: doc.page.title,
    excerpt: (doc.text.slice(0, 500) + (doc.text.length > 500 ? '\n' + doc.snip : '')).slice(0, 700) }));
  let out = { available: true, ids: [] };
  if (candidates.length) {
    try {
      out = await api('/meaning-search', { method: 'POST', body: JSON.stringify({ query: state.q.trim().slice(0, 300), candidates }),
        signal: AbortSignal.any([work.controller.signal, AbortSignal.timeout(8000)]) });
    } catch { out = { available: false, ids: [] }; }
  }
  if (searchMeaningWork.get(mode) !== work || searchState(mode) !== state || state.meaning !== result || searchMeaningKey(state) !== key || !meaningSearchVisible(mode)) return;
  // Once someone starts choosing a result, keep those rows in place. Newly
  // discovered pages can append without moving the target under their pointer.
  const previous = searchResults(state).items;
  const surface = searchSurface(mode);
  const focused = document.activeElement?.closest?.('[data-search-page]');
  const hovered = $('.search-list', surface)?.matches?.(':hover');
  const pinnedIds = state.navigationKey === key || focused || hovered ? previous.map((item) => item.page.id) : [];
  Object.assign(result, { loading: false, available: !!out.available, pinnedIds,
    ids: Array.isArray(out.ids) ? [...new Set(out.ids.filter((id) => chosen.has(id)))] : [] });
  searchMeaningWork.delete(mode);
  renderSearchList(mode);
}

function paletteResults() { return searchResults(UI.palette); }

function searchFilterGroups() {
  return [
    { id: 'project', label: 'All projects', options: WikiSearch.projectRoots(Store.s.pages).map((page) => ({ id: page.id, label: page.title })) },
    { id: 'type', label: 'Any document', options: WikiSearch.types },
    { id: 'status', label: 'Any review status', options: WikiSearch.statuses },
    { id: 'section', label: 'All sections', options: SECTIONS.map((section) => ({ id: section.id, label: section.name })) },
  ];
}

function searchFilterLabel(group, value) { return group.options.find((option) => option.id === value)?.label || group.label; }
function searchFilterName(id) { return 'Filter by ' + (id === 'status' ? 'review status' : id); }

function searchFilterHtml(state) {
  const filters = state.filters || {};
  return searchFilterGroups().map((group) => `<button type="button" class="search-filter ${filters[group.id] ? 'is-set' : ''}" data-search-filter="${group.id}" data-value="${MD.esc(filters[group.id] || '')}" aria-label="${searchFilterName(group.id)}" aria-haspopup="menu" aria-expanded="false"><span data-search-filter-label>${MD.esc(searchFilterLabel(group, filters[group.id]))}</span>${I.chev}</button>`).join('');
}

function searchSetFilter(mode, id, value) {
  const group = searchFilterGroups().find((item) => item.id === id);
  if (!group || (value !== '' && !group.options.some((option) => option.id === value))) return false;
  const state = searchState(mode);
  if (!state) return false;
  state.filters ||= {};
  state.filters[id] = value;
  state.sel = 0;
  searchRefreshFilters(mode);
  return true;
}

function searchFilterChoices(group) { return [{ id: '', label: group.label }, ...group.options]; }
function searchFilterMenuHtml(choices, value) {
  return choices.map((option, index) => `<button type="button" role="menuitemradio" aria-checked="${option.id === value}" data-search-choice="${index}" tabindex="-1"><span class="search-filter-check" aria-hidden="true">${option.id === value ? I.check : ''}</span><span class="search-filter-option-label">${MD.esc(option.label)}</span></button>`).join('');
}

function searchOpenFilter(anchor) {
  const mode = anchor.closest('[data-search-mode]')?.dataset.searchMode;
  const group = searchFilterGroups().find((item) => item.id === anchor.dataset.searchFilter);
  if (!mode || !group) return;
  if (searchFilterMenu?.anchor === anchor && searchFilterMenu.host.isConnected) { searchFilterMenu.close(); return; }
  window.__closeMenu?.();
  const state = searchState(mode), value = state.filters[group.id] || '', choices = searchFilterChoices(group);
  const host = document.createElement('div');
  host.id = searchPrefix(mode) + '-filter-menu';
  host.className = 'menu search-filter-menu';
  host.setAttribute('role', 'menu');
  host.setAttribute('aria-label', searchFilterName(group.id));
  host.innerHTML = searchFilterMenuHtml(choices, value);
  UI.menu = { searchFilter: group.id };
  const baseClose = mountMenu(host, anchor);
  const close = () => {
    if (searchFilterMenu?.host === host) searchFilterMenu = null;
    anchor.setAttribute('aria-expanded', 'false');
    anchor.removeAttribute('aria-controls');
    baseClose();
  };
  searchFilterMenu = { host, anchor, choices, close, typed: '', typedAt: 0 };
  window.__closeMenu = close;
  anchor.setAttribute('aria-expanded', 'true');
  anchor.setAttribute('aria-controls', host.id);
  // mountMenu supplies the established surface and lifecycle. Keep its popup
  // inside the viewport even when a long list opens near the screen edge.
  host.style.left = Math.max(8, Math.min(anchor.getBoundingClientRect().left, innerWidth - host.offsetWidth - 8)) + 'px';
  host.style.top = Math.max(8, Math.min(parseFloat(host.style.top) || 8, innerHeight - host.offsetHeight - 8)) + 'px';
  const selected = choices.findIndex((option) => option.id === value);
  const selectedButton = $$('[data-search-choice]', host)[Math.max(0, selected)];
  selectedButton?.focus();
  selectedButton?.scrollIntoView({ block: 'nearest' });
  host.addEventListener('click', (event) => {
    const choice = event.target.closest('[data-search-choice]');
    if (!choice) return;
    const option = choices[Number(choice.dataset.searchChoice)];
    if (!option) return;
    close();
    searchSetFilter(mode, group.id, option.id);
  });
}

function searchControlsHtml(state) {
  const count = Object.values(state.filters || {}).filter(Boolean).length;
  return `<div class="search-controls"><details class="search-filter-disclosure" ${state.filtersOpen ? 'open' : ''}><summary>Filters <span data-search-active>${count || ''}</span>${I.chev}</summary><div class="search-filters">${searchFilterHtml(state)}</div></details><button data-search-reset="all" class="search-reset" ${!state.q && !count ? 'hidden' : ''}>Reset</button></div>`;
}

function searchListHtml(state, mode = 'modal') {
  const { items, total } = searchResults(state);
  const query = state.q.trim(), filters = state.filters || {};
  const filtered = Object.values(filters).some(Boolean);
  const compact = mode === 'home' && !query && !filtered;
  const mark = (value) => WikiSearch.highlight(value, query, MD.esc);
  const prefix = searchPrefix(mode);
  state.count = items.length;
  state.sel = Math.max(0, Math.min(state.sel || 0, items.length - 1));
  const description = query ? 'Search results' : (filtered ? 'Matching pages' : 'Recent pages');
  const meaning = state.meaning?.key === searchMeaningKey(state) ? state.meaning : null;
  const pending = typeof REMOTE !== 'undefined' && query.length >= 3 && (!meaning || meaning.loading);
  const status = total ? `${total} ${total === 1 ? 'page' : 'pages'}${total > items.length ? ` · showing ${items.length}` : ''}` : 'No matches';
  state.announcement = pending && !items.length ? 'Searching…' : `${status}. ${description}.`;
  if (!items.length && !query && !filtered) return `<div id="${prefix}-results" role="listbox" aria-label="Wiki search results"></div>`;
  return `<div class="search-results-head"><span>${description}</span><span>${pending && !items.length ? '' : status}</span></div>
    <div id="${prefix}-results" role="listbox" aria-label="Wiki search results">${items.map((item, index) => {
      const element = mode === 'home' ? 'a' : 'button';
      const action = mode === 'home' ? `href="#/page/${encodeURIComponent(item.page.id)}"` : `data-action="palette-go" data-id="${MD.esc(item.page.id)}"`;
      return `<${element} id="${prefix}-result-${index}" class="palette__item search-result ${compact ? 'search-result--recent' : ''} ${index === state.sel ? 'sel' : ''}" ${action} role="option" data-search-page="${MD.esc(item.page.id)}" aria-selected="${index === state.sel}" tabindex="${mode === 'home' ? '0' : '-1'}">
      <span class="search-result-icon" aria-hidden="true">${item.type.id === 'project' ? I.cube : item.type.id === 'procedure' ? I.check : item.type.id === 'test' ? I.bolt : item.type.id === 'decision' ? I.link : I.page}</span>
      <span class="search-result-content">${!compact ? `<span class="search-result-meta"><span>${MD.esc(SECTIONS.find((section) => section.id === item.page.section)?.name || 'Wiki')}</span><span aria-hidden="true">/</span><span>${item.type.single}</span>${item.status.id !== 'unreviewed' ? `<span class="search-status search-status--${item.status.id}">${item.status.id === 'reviewed' ? I.check : ''}${item.status.label}</span>` : ''}</span>` : ''}
      <span class="palette__title">${mark(item.page.title)}</span>
      ${item.matchedFiles.length ? `<span class="search-result-file">${I.paperclip}<span>${mark(item.matchedFiles.join(' · '))}</span></span>` : ''}
      ${item.snip && !compact ? `<span class="palette__snip">${mark(item.snip)}</span>` : ''}
      ${item.approximate && !item.meaning ? '<span class="search-result-hint">Close spelling match</span>' : ''}</span>
      ${compact ? `<span class="search-recent-section">${MD.esc(SECTIONS.find((section) => section.id === item.page.section)?.name || '')}</span>` : ''}<span class="search-result-enter" aria-hidden="true">↵</span></${element}>`;
    }).join('')}</div>
    ${!items.length && pending ? '<div class="search-empty"><strong>Searching…</strong></div>' : !items.length ? `<div class="search-empty"><span class="search-empty-icon" aria-hidden="true">${I.search}</span><strong>${query ? `No pages found for “${MD.esc(query)}”` : 'No pages match these filters'}</strong><div class="search-empty-actions">${filtered ? '<button class="btn btn--sm" data-search-reset="filters">Clear filters</button>' : ''}${query ? '<button class="btn btn--sm" data-search-reset="query">Clear search</button>' : ''}</div></div>` : ''}`;
}

function paletteListHtml() { return searchListHtml(UI.palette); }

function searchInputHtml(state, mode) {
  const prefix = searchPrefix(mode);
  return `${I.search}<input type="text" placeholder="Search pages or describe what you need…" value="${MD.esc(state.q)}" spellcheck="false" autocomplete="off" aria-label="Search wiki" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="${prefix}-results" ${state.count ? `aria-activedescendant="${prefix}-result-${state.sel}"` : ''}>`;
}

function viewSearchHome() {
  const active = document.activeElement;
  searchHomeFocus = !UI.modal && !UI.editor && !UI.palette && active?.matches?.('.search-home input')
    ? { start: active.selectionStart, end: active.selectionEnd, direction: active.selectionDirection } : null;
  const state = searchHomeState(), list = searchListHtml(state, 'home');
  return `<section class="search-home search-surface" data-search-mode="home" aria-labelledby="wiki-search-home-title"><header class="search-home-heading"><h1 id="wiki-search-home-title">Search the CUPI Knowledge base</h1></header><div class="search-home-input">${searchInputHtml(state, 'home')}</div>${searchControlsHtml(state)}<div class="search-list">${list}</div><span class="search-sr" data-search-announcement role="status" aria-live="polite" aria-atomic="true">${MD.esc(state.announcement)}</span></section>`;
}

function mountSearchHome() {
  const surface = $('.search-home'), restore = searchHomeFocus;
  searchHomeFocus = null;
  if (!surface) return;
  searchSyncSelection('home');
  // A remote refresh replaces the input. Preserve an active search without
  // focusing a newly visited page or opening the keyboard on mobile arrival.
  if (restore && !UI.modal && !UI.editor && !UI.palette) {
    const input = $('input', surface);
    input?.focus({ preventScroll: true });
    input?.setSelectionRange(restore.start, restore.end, restore.direction);
  }
}

function viewPalette() {
  if (!UI.palette) return '';
  const list = paletteListHtml();
  return `<div class="palette-veil search-veil" data-action="palette-close"><div class="palette search-palette search-surface" data-search-mode="modal" role="dialog" aria-modal="true" aria-labelledby="wiki-search-title">
    <div class="search-palette-caption"><span id="wiki-search-title">Search the CUPI Knowledge base</span></div>
    <div class="palette__head">${searchInputHtml(UI.palette, 'modal')}<button class="search-close" data-search-close aria-label="Close search">${I.x}</button></div>
    ${searchControlsHtml(UI.palette)}<div class="palette__list search-list">${list}</div>
    <span class="search-sr" data-search-announcement role="status" aria-live="polite" aria-atomic="true">${MD.esc(UI.palette.announcement)}</span>
    <div class="palette__foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span class="search-foot-end"><kbd>esc</kbd> close</span></div>
  </div></div>`;
}

function searchSyncSelection(mode = 'modal') {
  const state = searchState(mode), surface = searchSurface(mode);
  if (!state || !surface) return;
  const items = $$('.search-result', surface);
  items.forEach((item, index) => {
    item.classList.toggle('sel', index === state.sel);
    item.setAttribute('aria-selected', String(index === state.sel));
  });
  const input = $('input', surface);
  if (items[state.sel]) input?.setAttribute('aria-activedescendant', items[state.sel].id);
  else input?.removeAttribute('aria-activedescendant');
}

function renderSearchList(mode = 'modal') {
  const state = searchState(mode), surface = searchSurface(mode);
  if (!state || !surface) return;
  // Keep the pressed element alive until the browser dispatches its click.
  // Preserving only row order is insufficient: innerHTML replaces its target.
  const key = searchMeaningKey(state);
  if (searchPointerGesture?.state === state && searchPointerGesture.key === key) {
    searchDeferredPaint.set(mode, { state, key });
    return;
  }
  searchDeferredPaint.delete(mode);
  const focusedPage = document.activeElement?.closest?.('[data-search-page]')?.dataset.searchPage;
  const list = $('.search-list', surface);
  if (list) list.innerHTML = searchListHtml(state, mode);
  const count = Object.values(state.filters || {}).filter(Boolean).length;
  const clear = $('[data-search-reset="all"]', surface);
  if (clear) clear.hidden = !state.q && !count;
  const active = $('[data-search-active]', surface);
  if (active) active.textContent = count || '';
  const announcement = $('[data-search-announcement]', surface);
  if (announcement) announcement.textContent = state.announcement;
  searchSyncSelection(mode);
  if (focusedPage) $$('.search-result', surface).find((item) => item.dataset.searchPage === focusedPage)?.focus({ preventScroll: true });
  scheduleMeaningSearch(mode);
}

function renderPaletteList() { if (UI.palette) renderSearchList(); }

function searchClose() {
  UI.palette = null;
  render();
  if (searchReturnFocus?.isConnected) searchReturnFocus.focus();
  else {
    const opener = searchReturnFocus;
    const replacement = opener && $$('button, a[href]').find((element) => element.className === opener.className
      && element.textContent === opener.textContent && element.getAttribute('data-action') === opener.getAttribute('data-action'));
    (replacement || $('.search-home input') || $('.sidebar__search'))?.focus();
  }
  searchReturnFocus = null;
}

function searchRefreshFilters(mode = 'modal') {
  const state = searchState(mode), surface = searchSurface(mode);
  if (!state || !surface) return;
  state.sel = 0;
  const groups = searchFilterGroups();
  $$('[data-search-filter]', surface).forEach((button) => {
    const group = groups.find((item) => item.id === button.dataset.searchFilter);
    const value = state.filters[group.id] || '';
    button.dataset.value = value;
    button.classList.toggle('is-set', !!value);
    $('[data-search-filter-label]', button).textContent = searchFilterLabel(group, value);
  });
  renderSearchList(mode);
}

document.addEventListener('input', (event) => {
  if (!event.target.matches?.('.search-home input')) return;
  const state = searchHomeState();
  state.q = event.target.value;
  state.sel = 0;
  renderSearchList('home');
});

document.addEventListener('toggle', (event) => {
  if (!event.target.matches?.('.search-filter-disclosure')) return;
  const mode = event.target.closest('[data-search-mode]')?.dataset.searchMode;
  if (mode) searchState(mode).filtersOpen = event.target.open;
}, true);

// mountMenu's outside-click close restores focus itself. Also close when focus
// moves out by another route, and clear our reference after its own cleanup.
document.addEventListener('focusin', (event) => {
  const menu = searchFilterMenu;
  if (!menu) return;
  if (!menu.host.isConnected) {
    searchFilterMenu = null;
    menu.anchor.setAttribute('aria-expanded', 'false');
    menu.anchor.removeAttribute('aria-controls');
  } else if (!menu.host.contains(event.target) && event.target !== menu.anchor) {
    const target = event.target;
    menu.close();
    target.focus?.({ preventScroll: true });
  }
});

document.addEventListener('pointerdown', (event) => {
  const trigger = event.target.closest?.('[data-search-filter]');
  if (searchFilterMenu?.anchor === trigger && searchFilterMenu?.host.isConnected) {
    searchFilterMenu.close();
    searchFilterDismissedTrigger = trigger;
  }
}, true);

document.addEventListener('click', (event) => {
  if (UI.palette && event.target.classList?.contains('search-veil')) {
    event.preventDefault(); event.stopImmediatePropagation(); searchClose(); return;
  }
  const trigger = event.target.closest?.('[data-search-filter]');
  const dismissed = searchFilterDismissedTrigger;
  searchFilterDismissedTrigger = null;
  if (trigger && trigger === dismissed) { event.preventDefault(); event.stopImmediatePropagation(); return; }
  if (trigger) { event.preventDefault(); event.stopImmediatePropagation(); searchOpenFilter(trigger); return; }
  const target = event.target.closest?.('[data-search-close], [data-search-reset]');
  const mode = target?.closest('[data-search-mode]')?.dataset.searchMode;
  if (!mode) return;
  event.preventDefault(); event.stopImmediatePropagation();
  if (target.hasAttribute('data-search-close')) return searchClose();
  const state = searchState(mode), reset = target.dataset.searchReset;
  if (reset === 'filters' || reset === 'all') state.filters = {};
  if (reset === 'query' || reset === 'all') {
    state.q = '';
    $('input', searchSurface(mode)).value = '';
  }
  searchRefreshFilters(mode);
  $('input', searchSurface(mode))?.focus();
}, true);

// A filter menu owns navigation before the palette. Closing it with Escape
// returns to its trigger; a second Escape can close the search dialog.
document.addEventListener('keydown', (event) => {
  const composing = event.isComposing || event.keyCode === 229
    || (event.target.matches?.('.search-surface input') && searchState(UI.palette ? 'modal' : 'home')?.composing);
  if (composing) {
    // Let the input method handle candidate selection/cancellation. Stop the
    // legacy global palette handler from treating those keys as navigation.
    if (UI.palette || event.target.closest?.('.search-surface')) event.stopImmediatePropagation();
    return;
  }
  if (UI.modal || (UI.editor && !UI.palette)) return;
  const menu = searchFilterMenu?.host.isConnected ? searchFilterMenu : null;
  const trigger = event.target.closest?.('[data-search-filter]');
  if (!menu && trigger && ['ArrowDown', 'ArrowUp'].includes(event.key)) {
    event.preventDefault(); event.stopImmediatePropagation(); searchOpenFilter(trigger); return;
  }
  if (menu) {
    if (event.key === 'Escape') {
      event.preventDefault(); event.stopImmediatePropagation(); menu.close(); return;
    }
    if (event.key === 'Tab') menu.close();
    else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') menu.close();
    else {
      const buttons = $$('[data-search-choice]', menu.host);
      const current = buttons.indexOf(document.activeElement);
      if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
        event.preventDefault(); event.stopImmediatePropagation();
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? buttons.length - 1 :
          ((current < 0 ? 0 : current) + (event.key === 'ArrowDown' ? 1 : buttons.length - 1)) % buttons.length;
        buttons[next]?.focus(); buttons[next]?.scrollIntoView({ block: 'nearest' });

function aiEffortOptions(model) {
  const labels = { none: 'None · fastest', low: 'Low', medium: 'Medium', high: 'High', xhigh: 'Extra high', max: 'Maximum' };
  return (AI_MODELS.find((m) => m.id === model) || AI_MODELS[0]).efforts.map((value) => ({ value, label: labels[value] }));
}

function aiMoney(micros) {
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 6 }).format(micros / 1e6);
}

function viewAiUsage() {
  const usage = UI.aiUsage;
  if (!usage) return `<span class="ai-usage__note">${UI.aiUsageError ? MD.esc(UI.aiUsageError) : 'Usage unavailable'}</span>`;
  const meter = (label, period, cap) => {
    const held = period.reservedMicros + period.uncertainMicros, total = period.costMicros + held;
    return `<div class="ai-usage__period"><span>${label}</span><span class="ai-usage__amount">${aiMoney(total)} <small>/ ${aiMoney(cap)}</small></span>
      <div class="ai-usage__track" role="meter" aria-label="${label} AI spend" aria-valuemin="0" aria-valuemax="${cap / 1e6}" aria-valuenow="${Math.min(total, cap) / 1e6}" aria-valuetext="${aiMoney(total)} of ${aiMoney(cap)}"><span style="width:${Math.min(100, total / cap * 100)}%"></span></div>
      <span class="ai-usage__note">${period.requests.toLocaleString()} ${period.requests === 1 ? 'request' : 'requests'}${held ? ` · ${aiMoney(held)} held` : ''}</span></div>`;
  };
  return `<div class="ai-usage__meters">${meter('This month', usage.current, usage.limits.monthMicros)}${meter('Today', usage.today, usage.limits.dayMicros)}</div>
    ${usage.paused ? `<p class="ai-usage__notice" role="status">${usage.halted ? 'AI paused: provider usage needs review.' : 'AI paused at the spending limit.'} Editing and saving remain available.</p>` : ''}
    <div class="ai-usage__note">Tracked since ${new Date(usage.startedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' })} · OpenAI only · UTC</div>
    <div class="ai-usage__note">5¢ maximum per request · 3 requests at once · 30 per minute</div>
    ${(usage.current.reservedMicros + usage.current.uncertainMicros) ? '<div class="ai-usage__note">Held amounts cover pending requests or unconfirmed charges and count toward the limits.</div>' : ''}
    ${UI.aiUsageError ? `<div class="field-error" role="alert">${MD.esc(UI.aiUsageError)}</div>` : ''}`;
}

let aiUsageTimer = null;
function syncAiUsage() {
  clearTimeout(aiUsageTimer); aiUsageTimer = null;
  if (typeof REMOTE === 'undefined' || UI.route?.name !== 'integrations' || UI.editor || document.hidden || !Store.isAdmin()) return;
  if (!UI.aiUsageLoading && (!UI.aiUsageCheckedAt || Date.now() - UI.aiUsageCheckedAt >= 20000)) loadAiUsage();
  aiUsageTimer = setTimeout(syncAiUsage, 20000);
}

async function loadAiUsage() {
  if (typeof REMOTE === 'undefined' || UI.aiUsageLoading || UI.route?.name !== 'integrations' || !Store.isAdmin()) return;
  UI.aiUsageLoading = true;
  const refresh = $('[data-action="ai-usage-refresh"]');
  const restoreFocus = refresh && document.activeElement === refresh;
  if (refresh) refresh.disabled = true;
  try {
    const out = await api('/ai/usage', { signal: AbortSignal.timeout(8000) });
    UI.aiUsage = out.usage;
    UI.aiUsageError = '';
  } catch { UI.aiUsageError = 'Usage could not refresh. New AI calls stop if spending protection is unavailable.'; }
  finally {
    UI.aiUsageLoading = false; UI.aiUsageCheckedAt = Date.now();
    if (UI.route?.name === 'integrations' && !UI.editor && Store.isAdmin()) {
      const host = $('[data-ai-usage]');
      if (host) host.innerHTML = viewAiUsage();
      const button = $('[data-action="ai-usage-refresh"]');
      if (button) {
        button.disabled = false;
        if (restoreFocus && button === refresh && document.activeElement === document.body && !UI.modal)
          button.focus({ preventScroll: true });
      }
    }
  }
}

function setAiConfiguration(open) {
  if (UI.aiBusy) return;
  const form = $('.ai-settings');
  if (open && UI.aiEdit && form) { form.elements.key.focus(); return; }
  if (form) { form.elements.key.value = ''; form.dataset.adminDirty = 'false'; }
  UI.aiConnectionError = '';
  UI.aiEdit = open;
  const settings = Store.s.settings?.ai || AI_DEFAULTS;
  UI.aiDraft = open ? { model: settings.model || AI_DEFAULTS.model, effort: settings.effort || AI_DEFAULTS.effort } : null;
  render();
  if (open) $('.ai-settings [name="key"]')?.focus();
  else $('.ai-integration [data-action="ai-configure"]')?.focus();
}

async function changeAiSettings(form, action = 'save') {
  if ((!form && action === 'save') || UI.aiBusy) return;
  if (typeof REMOTE === 'undefined') { toast('Configure AI on the live wiki.'); return; }
  const settings = Store.s.settings?.ai || AI_DEFAULTS;
  const origin = form || $('.ai-integration');
  if (!origin) return;
  const body = action === 'disconnect' ? { disconnect: true } : {
    model: form ? $('[data-m="ai-model"]', form).dataset.value : settings.model || AI_DEFAULTS.model,
    effort: form ? $('[data-m="ai-effort"]', form).dataset.value : settings.effort || AI_DEFAULTS.effort,
    key: form ? form.elements.key.value.trim() : '',
  };
  UI.aiBusy = true;
  UI.aiConnectionError = '';
  if (form) form.dataset.adminPending = 'true';
  const section = $('.ai-integration');
  const active = document.activeElement;
  section?.setAttribute('aria-busy', 'true');
  const controls = $$('button, input, fieldset', section || origin), error = $(form ? '[data-ai-error]' : '[data-ai-connection-error]', origin);
  controls.forEach((el) => { el.disabled = true; });
  if (error) error.hidden = true;
  try {
    const out = await api(action === 'test' ? '/ai/test' : '/ai/settings', {
      method: action === 'test' ? 'POST' : 'PUT', body: JSON.stringify(body), signal: AbortSignal.timeout(30000),
    });
    if (action !== 'test') {
      const editorForm = form || $('.ai-settings');
      if (editorForm) {
        editorForm.elements.key.value = '';
        editorForm.dataset.adminDirty = 'false';
        editorForm.dataset.adminPending = 'false';
      }
      Store.s.settings ||= {};
      Store.s.settings.ai = out.settings;
      UI.aiDraft = null;
      UI.aiEdit = false;
      UI.aiBusy = false;
      // The owner may have moved to an editor while the request was pending.
      // Never let this completion remount that unrelated, possibly dirty view.
      if (UI.route?.name === 'integrations' && !UI.editor && !UI.modal) {
        const returnFocus = origin.isConnected && (document.activeElement === document.body || section?.contains(document.activeElement));
        const current = $('.ai-integration');
        if (current) current.outerHTML = viewAiSettings();
        if (returnFocus) $('.ai-integration [data-action="ai-configure"]')?.focus({ preventScroll: true });
      }
    }
    if (UI.route?.name === 'integrations' && Store.isAdmin()) loadAiUsage();
    toast(action === 'test' ? 'Connection verified' : action === 'disconnect' ? 'AI disconnected' : 'AI settings saved');
  } catch (e) {
    if (form) form.dataset.adminDirty = 'true';
    const message = e.name === 'TimeoutError' ? 'The request timed out. Try again.' : e.status === 401 ? 'Your session expired. Sign in again.' : e.message || 'Unable to update AI settings.';
    if (form && error) { error.textContent = message; error.hidden = false; }
    else {
      UI.aiConnectionError = message;
      const current = $('.ai-integration [data-ai-connection-error]');
      if (current) { current.textContent = message; current.hidden = false; }
    }
    if (!origin.isConnected) toast(message);
  } finally {
    UI.aiBusy = false;
    if (form) form.dataset.adminPending = 'false';
    $('.ai-integration')?.setAttribute('aria-busy', 'false');
    controls.forEach((el) => { el.disabled = false; });
    $$('.ai-integration [data-action^="ai-"], .ai-settings__fields').forEach((el) => { el.disabled = false; });
    if (origin.isConnected && active?.isConnected && !UI.modal && document.activeElement === document.body) active.focus({ preventScroll: true });
  }
}

'use strict';

/* ------------------------------- registry -------------------------------- */

function validateRecruitModule(m) {
  if (!m || typeof m !== 'object') throw new Error('A recruit module must be an object');
  if (!/^[a-z]+$/.test(String(m.name || ''))) throw new Error('A recruit module needs a lowercase name');
  if (typeof m.order !== 'number' || Number.isNaN(m.order)) throw new Error(`Recruit module "${m.name}" needs an order`);
  if (RECRUIT.modules.some((x) => x.name === m.name)) throw new Error(`Recruit module "${m.name}" is already registered`);
  for (const group of ['actions', 'inputs', 'dd', 'modals']) {
    for (const key of Object.keys(m[group] || {})) {
      if (!key.startsWith('recruit-')) throw new Error(`Recruit module "${m.name}": ${group} key "${key}" must start with recruit-`);
    }
  }
  if (m.panel && (!m.panel.id || !m.panel.label)) throw new Error(`Recruit module "${m.name}": panel needs id and label`);
}

const RECRUIT = {
  modules: [],
  register(m) { validateRecruitModule(m); this.modules.push(m); this.modules.sort((a, b) => a.order - b.order); },

  // First module (by order) that owns a key in the given group.
  find(group, key) {
    for (const m of this.modules) if (m[group] && Object.prototype.hasOwnProperty.call(m[group], key)) return { module: m, fn: m[group][key] };
    return null;

  active(cycle) { return this.modules.filter((m) => recruitEnabled(m, cycle)); },

  panels(cycle, role) {
    const out = [];
    for (const m of this.active(cycle)) {
      for (const p of (m.panels || (m.panel ? [m.panel] : []))) {
        if (!p || (p.when && !p.when(cycle, role))) continue;
        out.push({ id: p.id, label: p.label, order: p.order ?? m.order, module: m });
      }
    }
    return out.sort((a, b) => a.order - b.order);
  },
  columns(cycle, role) {
    const seen = new Set(), out = [];

      for (const c of cols || []) {

        seen.add(c.id); out.push(Object.assign({ module: m.name }, c));

    return out;
  },
  filters(cycle, role) {
    const out = [];
    for (const m of this.active(cycle)) {

    }
    return out;
  },
  selectionActions(ids, cycle, role) {
    const out = [];
    for (const m of this.active(cycle)) {

      for (const a of list || []) if (a && a.label && typeof a.run === 'function') out.push(Object.assign({ id: a.id || `${m.name}-${out.length}`, module: m.name }, a));

  detailSections(app, cycle, role) {
