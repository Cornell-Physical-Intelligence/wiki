      if (!list) continue;
      if (!Array.isArray(list)) list = [list];
      for (const s of list) {
        if (!s) continue;
        if (typeof s === 'string') out.push({ id: m.name, title: '', html: s, module: m.name });
        else if (s.html !== undefined) out.push(Object.assign({ id: m.name, title: '', module: m.name }, s));
      }
    }
    return out;
  },
  settingsSections(cycle, role) {
    const out = [];
    for (const m of this.active(cycle)) {
      let list = typeof m.settings === 'function' ? m.settings(cycle, role) : m.settings;
      if (!list) continue;
      if (!Array.isArray(list)) list = [list];
      for (const s of list) if (s && s.id && (!s.when || s.when(cycle, role))) out.push(Object.assign({ module: m.name }, s));
    }
    return out;
  },

  /* ---- delegated events (one line each in main.js hands these over) ---- */

  async click(act, el, ev, stop) {
    if (!el || el.tagName === 'FORM') return false;            // a click inside a form lands on the form's own data-action
    const hit = this.find('actions', act);
    if (!hit) return false;
    // Checkboxes and real links keep their native behaviour; everything else
    // is a button whose default would only scroll or submit.
    const native = typeof el.matches === 'function' && el.matches('input[type="checkbox"], input[type="radio"], a[href], label');
    if (native) ev?.stopPropagation?.(); else stop?.();
    await hit.fn(el, ev, stop);
    return true;
  },
  async submit(form, ev) {
    ev?.preventDefault?.();
    const act = String(form?.dataset?.action || '');
    if (!act.startsWith('recruit-')) return false;
    if (act.startsWith('recruit-settings-')) {
      const id = act.slice('recruit-settings-'.length);
      const cycle = recruitCycleRow(), role = recruitRole();
      const section = this.settingsSections(cycle, role).find((s) => s.id === id);
      if (!section?.submit) return false;
      await runAdminForm(form, () => section.submit(form, cycle, role));
      return true;
    }
    const hit = this.find('actions', act);
    if (!hit) return false;
    await hit.fn(form, ev, () => {});
    return true;
  },
  input(el, ev) {
    const hit = el?.dataset?.m ? this.find('inputs', el.dataset.m) : null;
    if (!hit) return false;
    hit.fn(el, ev);
    return true;
  },
  change(el, ev) { return this.input(el, ev); },
  keydown(ev) {
    // Tabs are a roving tablist: arrows move focus, Enter follows the link.
    if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(ev.key) && typeof ev.target?.matches === 'function' && ev.target.matches('.rc-tabs [role="tab"]')) {
      const tabs = $$('.rc-tabs [role="tab"]');
      const cur = tabs.indexOf(ev.target);
      if (cur < 0 || !tabs.length) return false;
      const next = ev.key === 'Home' ? 0 : ev.key === 'End' ? tabs.length - 1 : (cur + (ev.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
      ev.preventDefault();
      tabs[next].focus();
      return true;
    }
    for (const m of this.modules) if (typeof m.keydown === 'function' && m.keydown(ev)) return true;
    return false;
  },
  // dd(host) opens the menu for a recruit dropdown; dd(host, value) reports a
  // pick. A module's dd handler is called with value === undefined to open:
  // return an array of openMenu items for a computed menu, open one yourself
  // (return true), or return nothing to get the default menu from data-opts.
  // It is called again with the chosen value after a default-menu pick.
  dd(host, value) {
    const m = String(host?.dataset?.m || '');
    const hit = this.find('dd', m);
    if (value !== undefined) { hit?.fn(host, value); return true; }
    if (hit) {
      const before = UI.menu;
      const out = hit.fn(host, undefined);
      if (Array.isArray(out)) { openMenu(out, host); return true; }
      if (out === true || (UI.menu && UI.menu !== before)) return true;
    }
    openMenu(recruitDefaultMenu(host, hit?.fn), host);
    return true;
  },
  modal(m) {
    const hit = m?.kind ? this.find('modals', m.kind) : null;
    return hit ? String(hit.fn(m) ?? '') : '';
  },

  /* ---- loaders, sync, reset, api ---- */

  mount(r) {
    if (typeof REMOTE === 'undefined' || !Store.me()) return;
    const st = recruitState();
    // Once per session, for every member: non-admins with a cycle role get
    // the sidebar link from this answer.
    if (UI.recruitMe === undefined) {
      UI.recruitMe = { loading: true };
      this.api('/recruit/me')
        .then((out) => {
          UI.recruitMe = { admin: Boolean(out.admin), cycles: Array.isArray(out.cycles) ? out.cycles : [] };
          if (UI.route.name === 'recruit' || (!UI.recruitMe.admin && UI.recruitMe.cycles.length)) renderBackground(UI.route.name);
        })
        .catch((e) => { UI.recruitMe = { error: recruitError(e) }; if (UI.route.name === 'recruit') renderBackground('recruit'); });
    }
    if (r.name !== 'recruit') { clearTimeout(st._syncTimer); st._syncTimer = null; return; }
    st.me = UI.recruitMe;
    if (!st.me || st.me.loading || st.me.error) return;
    if (!st.me.admin && !st.me.cycles.length) return;
    if (st.cycles === undefined) {
      st.cycles = { loading: true };
      this.api('/recruit/cycles?all=1')
        .then((out) => { recruitAdoptCycles(out); renderBackground('recruit'); })
        .catch((e) => { st.cycles = { error: recruitError(e) }; renderBackground('recruit'); });
    }
    const id = r.params.id || null;
    if (!id) {
      if (st.cycleId) this.reset(null);
      const list = st.cycles?.list;
      if (list && !r.params.all) {
        const live = list.filter((c) => c.status !== 'archived');
        if (live.length === 1) { nav('#/applications/' + live[0].id); return; }
      }
      if (st.me.admin && st.queue === undefined) recruitLoadQueue();
      this.sync();
      return;
    }
    if (st.cycleId !== id) this.reset(id);
    if (st.cycle === undefined) {
      st.cycle = { loading: true };
      const key = st.key;
      this.api(`/recruit/cycles/${encodeURIComponent(id)}`)
        .then((out) => {
          if (st.key !== key) return;                       // switched away meanwhile
          const roles = Array.isArray(out.me?.roles) ? out.me.roles : (st.me.admin ? ['admin'] : []);
          st.cycle = { data: out.cycle, role: recruitRoleOf(roles), roles, counts: out.counts || { total: 0, bySection: {} }, sections: out.sections || null, grants: out.roles || [] };
          renderBackground('recruit');
        })
        .catch((e) => { if (st.key !== key) return; st.cycle = { error: recruitError(e), status: e.status }; renderBackground('recruit'); });
    }
    if (st.cycle?.data) {
      const panel = recruitActivePanel();
      st.panel = panel?.id || null;
      try { panel?.module.mount?.(st.cycle.data, st.cycle.role, panel.id); } catch (e) { console.error(e); }
    }
    this.sync();
  },

  // 30 s loop while the route is open and the tab visible. Counts and the
  // stage strip repaint in place; list rows never refresh on their own.
  sync() {
    const st = recruitState();
    clearTimeout(st._syncTimer);
    st._syncTimer = null;
    if (typeof REMOTE === 'undefined' || UI.route?.name !== 'recruit' || document.hidden) return;
    st._syncTimer = setTimeout(recruitSyncTick, RECRUIT_SYNC_MS);
  },

  reset(cycleId) {
    const st = recruitState();
    st.cycleId = cycleId || null;
    st.cycle = undefined;
    st.apps = undefined;
    st.queue = undefined;
    st.selected = new Set();
    st.selectionScope = null;
    st.detail = {};
    st.busy = new Set();
    st.mod = {};
    st.panel = null;
    st.key = (st.key || 0) + 1;
    for (const m of this.modules) { try { m.reset?.(cycleId); } catch (e) { console.error(e); } }
  },

  // window api() with a bounded lifetime. A timed-out request reads as one
  // plain sentence and keeps its TimeoutError name for callers that branch.
  async api(path, opts = {}) {
    if (typeof api === 'undefined') throw new Error('This preview has no server.');
    const p = String(path).startsWith('/recruit') ? path : '/recruit' + path;
    try {
      return await api(p, { ...opts, signal: opts.signal || AbortSignal.timeout(RECRUIT_TIMEOUT_MS) });
    } catch (e) {
      if (e?.name === 'TimeoutError' || e?.name === 'AbortError') {
        throw Object.assign(new Error('The request timed out. Try again.'), { name: 'TimeoutError', status: 0 });
      }
      throw e;
    }
  },
};

const RECRUIT_SECTION_KEYS = ['interest', 'coffee', 'application'];
// One row of a section, as a noun: what the dialog is showing.
const RECRUIT_SECTION_NOUNS = { interest: 'Interest form', coffee: 'Coffee chat', application: 'Application' };
const recruitSectionNoun = (key) => RECRUIT_SECTION_NOUNS[key] || 'Application';
const RECRUIT_SECTION_LABELS = { interest: 'Interest form', coffee: 'Coffee chats', application: 'Applications' };
// The section a cycle URL points at; the interest form when it names none.
function recruitSection() { const sub = UI.route?.params?.sub; return RECRUIT_SECTION_KEYS.includes(sub) ? sub : 'interest'; }

const RECRUIT_TIMEOUT_MS = 20000;
const RECRUIT_SYNC_MS = 30000;
const RECRUIT_ROLES = ['admin', 'lead', 'reviewer', 'interviewer'];

/* ------------------------------- state ----------------------------------- */

function recruitState() {
  return UI.recruit ||= {
    me: undefined, cycles: undefined, cycleId: null, cycle: undefined, panel: null,
    apps: undefined, filters: {}, selected: new Set(), selectionScope: null,
    drafts: {}, busy: new Set(), detail: {}, queue: undefined, mod: {}, key: 0, _syncTimer: null,
  };
}

const recruitCycleRow = () => recruitState().cycle?.data || null;
const recruitRole = () => recruitState().cycle?.role || null;
const recruitMyRoles = () => recruitState().cycle?.roles || [];
const recruitIsAdmin = () => Boolean(recruitState().me?.admin);

function recruitRoleOf(roles) {
  const list = Array.isArray(roles) ? roles : [];
  return RECRUIT_ROLES.find((r) => list.includes(r)) || null;
}

// Mirrors permissions.js allowed(access, role) on the client, for UX only.
function recruitCan(access, roles = recruitMyRoles()) {
  const has = (r) => roles.includes(r);
  if (access === 'member') return true;
  if (access === 'role') return roles.length > 0;
  if (access === 'admin') return has('admin');
  if (access === 'lead') return has('admin') || has('lead');
  if (access === 'reviewer') return has('admin') || has('lead') || has('reviewer');
  if (access === 'interviewer') return has('admin') || has('lead') || has('interviewer');
  return false;
}

function recruitEnabled(m, cycle) {
  if (!m || m.kernel) return true;
  if (['cycles', 'applications', 'roles'].includes(m.name)) return true;
  const map = cycle?.doc?.modules;
  return !map || map[m.name] !== false;
}

function recruitAdoptCycles(out) {
  const st = recruitState();
  const list = Array.isArray(out?.cycles) ? out.cycles : [];
  st.cycles = { list, intakeCycleId: out?.intakeCycleId || null, migration: out?.migration || null, settingsVersion: out?.settingsVersion ?? out?.version ?? null };
  if (st.cycle?.data) {
    const mine = list.find((c) => c.id === st.cycle.data.id);
    if (mine?.counts) st.cycle.counts = mine.counts;
  }
}

// Late responses after a cycle switch or Refresh compare this key.
const recruitKey = () => recruitState().key;

function recruitId(prefix) {
  const rnd = typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36);
  return prefix + '-' + rnd;
}

function recruitError(e) {
  if (!e) return 'Something went wrong';
  if (e.name === 'TimeoutError') return 'The request timed out. Try again.';
  return e.message || 'Something went wrong';
}

// 8/28/26 — the same short form the interest list uses.
function recruitDate(ts) {
  return new Date(ts).toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' });
}

const recruitPlural = (n, one, many = one + 's') => `${Number(n || 0).toLocaleString('en-US')} ${n === 1 ? one : many}`;

const recruitSubteams = (cycle) => (Array.isArray(cycle?.doc?.subteams) ? cycle.doc.subteams : []);
const RECRUIT_YEARS = ['Freshman', 'Sophomore', 'Junior', 'Senior', 'Grad'];

function recruitPanelHref(cycleId, panel, params) {
  const qs = params ? Object.entries(params).filter(([, v]) => v !== undefined && v !== null && v !== '').map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&') : '';
  return `#/applications/${encodeURIComponent(cycleId)}${panel ? '/' + panel : ''}${qs ? '?' + qs : ''}`;
}

function recruitActivePanel() {
  const st = recruitState();
  const cycle = st.cycle?.data;
  if (!cycle) return null;
  const panels = RECRUIT.panels(cycle, st.cycle.role);
  const sub = UI.route?.params?.sub;
  return panels.find((p) => p.id === sub) || panels[0] || null;
}

// Region repaint that keeps the reader's focus (the caret's element is found
// again by its data attributes after the HTML is replaced).
function recruitRepaint(node, html) {
  if (!node) return false;
  const focus = focusReference(document.activeElement);
  const had = node.contains(document.activeElement);
  node.innerHTML = html;
  if (had) resolveFocus(focus, node)?.focus({ preventScroll: true });
  return true;
}

// Default dropdown menu from data-opts (the same as main.js's dd case), plus
// the admin-dirty mark on settings forms and the module's pick callback.
function recruitDefaultMenu(host, fn) {
  let options = [];
  try { options = JSON.parse(host.dataset.opts || '[]'); } catch { options = []; }
  return options.map((o) => ({
    selected: o.value === host.dataset.value,
    icon: o.value === host.dataset.value ? I.check : '<span style="width:14px;flex:none"></span>',
    label: o.label,
    run: () => {
      host.dataset.value = o.value;
      const label = host.querySelector?.('.dd__label');
      if (label) label.textContent = o.label;
      const form = host.closest?.('form');
      if (form) form.dataset.adminDirty = 'true';
      fn?.(host, o.value);
    },
  }));
}

/* ------------------------------- queue ----------------------------------- */

// Saved submissions still waiting to join a list (admin). One fetch per
// visit; Sync queue forces a replay.
function recruitLoadQueue(force = false) {
  const st = recruitState();
  if (!st.me?.admin) return;
  if (st.queue?.loading) return;
  st.queue = { loading: true };
  const key = st.key;
  RECRUIT.api(`/recruit/queue${force ? '?force=1' : ''}`)
    .then((out) => {
      if (st.key !== key) return;
      st.queue = { pending: Array.isArray(out.pending) ? out.pending : [], queueUnavailable: Boolean(out.queueUnavailable) };
      if (!recruitPaintQueue()) renderBackground('recruit');
    })
    .catch((e) => { if (st.key !== key) return; st.queue = { error: recruitError(e) }; if (!recruitPaintQueue()) renderBackground('recruit'); });
}

function recruitPaintQueue() {
  const host = $('[data-rc="queue"]');
  if (!host || typeof recruitQueueHtml !== 'function') return false;
  return recruitRepaint(host, recruitQueueHtml());
}

/* ------------------------------- sync loop ------------------------------- */

async function recruitSyncTick() {
  const st = recruitState();
  st._syncTimer = null;
  if (typeof REMOTE === 'undefined' || UI.route?.name !== 'recruit' || document.hidden) return;
  const quiet = !UI.editor && !UI.modal && !UI.menu && !UI.palette && !(REMOTE.pending > 0);
  if (quiet && st.cycles?.list) {
    const key = st.key;
    try {
      const out = await RECRUIT.api('/recruit/cycles?all=1');
      if (st.key === key && UI.route?.name === 'recruit') { recruitAdoptCycles(out); recruitPaintCounts(); }
    } catch { /* the next tick tries again */ }
    const panel = recruitActivePanel();
    const m = panel?.module;
    if (m?.refresh?.load && st.cycle?.data && st.key === key && Date.now() - (m._refreshedAt || 0) >= (m.refresh.every || RECRUIT_SYNC_MS)) {
      try {
        const data = await m.refresh.load(st.cycle.data, st.cycle.role);
        m._refreshedAt = Date.now();
        if (st.key === key && UI.route?.name === 'recruit' && !UI.modal && !UI.menu && !UI.editor) m.refresh.paint?.(data, st.cycle.data, st.cycle.role);
      } catch { /* best effort */ }
    }
  }
  RECRUIT.sync();
}

function recruitCountsLine(cycle = recruitCycleRow(), counts = recruitState().cycle?.counts) {
  if (!cycle) return '';
  const st = recruitState();
  const parts = [recruitStatusText(cycle, st.cycles?.intakeCycleId)];
  if (cycle.status === 'open' && cycle.closesAt) parts.push('closes ' + new Date(Number(cycle.closesAt)).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
  const by = counts?.bySection || {};
  parts.push(`${Number(by.interest || 0).toLocaleString('en-US')} interest`, recruitPlural(by.coffee || 0, 'coffee chat'), recruitPlural(by.application || 0, 'application'));
  return parts.filter(Boolean).join(' · ');
}

function recruitStatusText(cycle, intakeCycleId) {
  if (!cycle) return '';
  if (cycle.status === 'open') return intakeCycleId && cycle.id === intakeCycleId ? 'Open · receives the website form' : 'Open';
  if (cycle.status === 'draft') return 'Draft';
  if (cycle.status === 'closed') return 'Closed';
  if (cycle.status === 'archived') return 'Archived';
  return cycle.status || '';
}

// Counts repaint in place: every [data-rc-count] node (the index rows, the
// section tab's Responses count).
function recruitPaintCounts() {
  const st = recruitState();
  const cycle = st.cycle?.data;
  if (!cycle) return;
  const counts = st.cycle.counts || { total: 0, bySection: {} };
  for (const el of $$('[data-rc="counts"]')) el.textContent = recruitCountsLine(cycle, counts);
  for (const el of $$('[data-rc-count]')) {
    const k = el.dataset.rcCount;
    el.textContent = k === 'all' ? Number(counts.total || 0).toLocaleString('en-US') : Number(counts.bySection?.[k] || 0).toLocaleString('en-US');
  }
}

/* ------------------------------- shell ----------------------------------- */

const RC_ICONS = {
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V3m0 1c5-4 11 4 16 0v12c-5 4-11-4-16 0"/></svg>',
  comment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-3 2V11.5A8.5 8.5 0 0 1 9.5 3h3a8.5 8.5 0 0 1 8.5 8.5Z"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M21 21H3"/></svg>',
};

function recruitShellHtml(crumbHtml, inner, right) {
  return topbar(crumbHtml, right) + `<div class="content"><div class="page-wrap page-wrap--wide"><div class="page-col page-col--wide">${inner}</div></div></div>`;
}

const RECRUIT_CRUMBS_INDEX = `<a href="#/home">Wiki</a><span class="crumbs__sep">/</span><span class="crumbs__here">Applications</span>`;

function viewRecruit() {
  if (typeof REMOTE === 'undefined') {
    return recruitShellHtml(RECRUIT_CRUMBS_INDEX, `<div class="empty">${I.mail}<b>Live on the deployed wiki</b>
      <p>This preview has no server. The real wiki manages applications here, by recruiting cycle.</p></div>`);
  }
  const st = recruitState();
  const me = st.me;
  const head = `<div class="plain-head"><h1>Applications</h1></div>`;
  if (!me || me.loading) return recruitShellHtml(RECRUIT_CRUMBS_INDEX, head + '<p class="sheet__note">Loading…</p>');
  if (me.error) return recruitShellHtml(RECRUIT_CRUMBS_INDEX, head + `<p class="sheet__note">Could not load: ${MD.esc(me.error)}. <button class="linklike" data-action="recruit-refresh">Retry</button></p>`);
  if (!me.admin && !me.cycles?.length) {
    return recruitShellHtml(RECRUIT_CRUMBS_INDEX, `<div class="empty">${I.mail}<b>Only admins and cycle reviewers can read applications</b>
      <p>Applications carry personal info, so they stay with team leads and the people they assign.</p>
      <a class="btn" href="#/home" style="text-decoration:none">Back to the wiki</a></div>`);
  }
  const id = UI.route?.params?.id;
  if (!id) return recruitShellHtml(RECRUIT_CRUMBS_INDEX, typeof recruitIndexHtml === 'function' ? recruitIndexHtml() : head);
  return recruitCycleShellHtml(id);
}

// Open a dialog over the route as it stands. The page behind the veil is not
// rebuilt, so nothing behind it moves or fades; render() is the fallback
// where the shell helpers are missing (tests, previews).
function recruitShowModal(m) {
  UI.modal = m;
  const inPlace = typeof viewModal === 'function' && typeof mountModalFocus === 'function' && Boolean($('#app .rc-panel'));
  if (!inPlace) { render(); return; }
  if (typeof captureModalFocus === 'function') captureModalFocus();
  document.querySelector('.modal-veil')?.remove();
  document.body.insertAdjacentHTML('beforeend', viewModal());
  mountModalFocus();
}

// The cycle's name is the switch: the big title opens the list of cycles.
function recruitCycleTitleHtml(cycle, options) {
  return `<button type="button" class="rc-cycle-title" data-action="dd" data-m="recruit-cycle-switch" data-value="${MD.esc(cycle.id)}" data-opts="${MD.esc(JSON.stringify(options))}" aria-haspopup="menu" title="Switch cycle"><span class="dd__label">${MD.esc(cycle.name)}</span><svg class="dd__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>`;
}
const recruitCycleChoiceLabel = (x) => {
  const name = x.term && x.term !== x.name ? `${x.name} · ${x.term}` : x.name;
  return x.status && x.status !== 'open' ? `${name} · ${x.status}` : name;
};

function recruitCycleShellHtml(id) {
  const st = recruitState();
  const back = `<a href="#/applications?all=1">Applications</a>`;
  const crumbs = (here) => `<a href="#/home">Wiki</a><span class="crumbs__sep">/</span>${back}<span class="crumbs__sep">/</span><span class="crumbs__here">${here}</span>`;
  const c = st.cycle;
  if (!c || c.loading) return recruitShellHtml(crumbs('Loading…'), '<p class="sheet__note">Loading…</p>');
  if (c.error) {
    const gone = c.status === 404;
    return recruitShellHtml(crumbs('Applications'), `<div class="empty">${I.mail}<b>${gone ? 'No such cycle' : 'Could not open this cycle'}</b>
      <p>${gone ? 'It may have been deleted.' : MD.esc(c.error)}</p>
      ${gone ? '<a class="btn" href="#/applications?all=1" style="text-decoration:none">All cycles</a>' : '<button class="btn" data-action="recruit-refresh">Retry</button>'}</div>`);
  }
  const cycle = c.data;
  const role = c.role;
  const panels = RECRUIT.panels(cycle, role);
  const active = recruitActivePanel();
  const tabs = panels.length ? `<nav class="rc-tabs" role="tablist" aria-label="Cycle sections">${panels.map((p) => `<a role="tab" id="rc-tab-${MD.esc(p.id)}" href="${recruitPanelHref(cycle.id, p.id)}" aria-selected="${p.id === active?.id}" ${p.id === active?.id ? 'aria-current="page"' : ''} tabindex="${p.id === active?.id ? 0 : -1}">${MD.esc(p.label)}</a>`).join('')}</nav>` : '';
  const list = st.cycles?.list || [];
  const switchOptions = (list.length ? list : [{ id: cycle.id, name: cycle.name, term: cycle.term, status: cycle.status }])
    .map((x) => ({ value: x.id, label: recruitCycleChoiceLabel(x) }));
  if (!switchOptions.some((o) => o.value === cycle.id)) switchOptions.unshift({ value: cycle.id, label: cycle.name });
  const right = `<button class="icon-btn" data-action="recruit-cycle-tools" aria-label="Cycle options" title="Cycle options" aria-haspopup="menu">${I.dots}</button>`;
  let body = '';
  if (active) {
    let inner = '';
    try { inner = active.module.view ? String(active.module.view(cycle, role, active.id) ?? '') : ''; } catch (e) { console.error(e); inner = `<p class="sheet__note">Could not draw this section: ${MD.esc(e.message || 'error')}</p>`; }
    // The panel fades in when it changes, never on a re-render of the same one.
    const enter = st.paintedPanel !== cycle.id + ':' + active.id;
    st.paintedPanel = cycle.id + ':' + active.id;
    body = `<div class="rc-panel ${enter ? 'rc-panel--enter' : ''}" id="rc-panel-${MD.esc(active.id)}" role="tabpanel" aria-labelledby="rc-tab-${MD.esc(active.id)}">${inner || `<div class="empty">${I.info}<b>Nothing here yet</b></div>`}</div>`;
  } else body = `<div class="empty">${I.info}<b>Nothing to show for your role in this cycle</b></div>`;
  const head = `<div class="plain-head plain-head--cycle"><h1>${recruitCycleTitleHtml(cycle, switchOptions)}</h1></div>`;
  return recruitShellHtml(crumbs(MD.esc(cycle.name)), head + tabs + body, right);
}

function recruitCycleRowHtml(c, intakeCycleId) {

  return `<div class="sheet__archive">
    <button class="sheet__archivename" data-action="recruit-cycle-open" data-id="${MD.esc(c.id)}"><span class="sheet__archivetitle">${MD.esc(c.name)}</span>
      <span class="sheet__archivemeta">${MD.esc(meta)}</span></button>
  </div>`;
}

function recruitIndexHtml() {
  const st = recruitState();
  const admin = recruitIsAdmin();
  const head = `<div class="plain-head"><h1>Applications</h1></div>`;
  const cy = st.cycles;
  if (!cy || cy.loading) return head + '<p class="sheet__note">Loading…</p>';

  const liveBlock = live.length

    : `<div class="sheet sheet--list"><div class="sheet__archive"><span class="sheet__archivemeta">${admin ? 'No cycle yet. Create one to start receiving applications.' : 'No open cycle.'}</span></div></div>`;
  const archivedBlock = archived.length
    ? `<h2 class="sheet__heading">Archived</h2><div class="sheet sheet--list">${archived.map((c) => recruitCycleRowHtml(c, cy.intakeCycleId)).join('')}</div>`
    : '';
  return head + tools + liveBlock + archivedBlock + `<div data-rc="queue">${recruitAttentionHtml()}</div>`;
}

// Shown only when something needs an admin: the one-time import, orphaned
// website submissions, and saved submissions still waiting in the queue.
function recruitAttentionHtml() {
  const st = recruitState();
  if (!recruitIsAdmin()) return '';
  const mig = st.cycles?.migration || null;
  const items = [];
  if (mig && !mig.done) {
    const parts = [recruitPlural(mig.legacyLive || 0, 'submission'), recruitPlural((mig.legacyArchives || []).length, 'archive')].join(' and ');
    const busy = st.busy.has('migrate');
    items.push(`<div class="sheet__archive"><span class="sheet__archivemeta" data-rc="migrate">${busy ? 'Importing…' : MD.esc(parts) + ' on the old list'}</span>
      <button class="btn btn--sm" data-action="recruit-migrate" ${busy ? 'disabled' : ''}>Import the current list and archives</button></div>`);
  }
  if (mig?.done && mig.orphans > 0) {
    items.push(`<div class="sheet__archive"><span class="sheet__archivemeta">${MD.esc(recruitPlural(mig.orphans, 'submission'))} arrived while no cycle was receiving the form</span>
      <button class="btn btn--sm" data-action="recruit-adopt" aria-haspopup="menu" ${st.busy.has('adopt') ? 'disabled' : ''}>Adopt into…</button></div>`);
  }
  const pending = st.queue?.pending?.length || 0;
  if (pending) items.push(`<div class="sheet__archive"><span class="sheet__archivemeta">${MD.esc(recruitPlural(pending, 'saved submission'))} waiting to join a list</span>
    <button class="btn btn--sm" data-action="recruit-queue-sync">Sync queue</button></div>`);
  if (st.queue?.queueUnavailable) items.push(`<div class="sheet__archive"><span class="sheet__archivemeta">Could not check the saved-submission queue.</span><button class="btn btn--sm" data-action="recruit-queue-sync">Retry</button></div>`);

/* ------------------------------- new cycle ------------------------------- */

function recruitTermOptions(current) {
  const year = new Date().getFullYear();
  const terms = ['Rolling'];
  for (const y of [year, year + 1]) terms.push(`Spring ${y}`, `Fall ${y}`);
  if (current && !terms.includes(current)) terms.unshift(current);
  return terms.map((t) => ({ value: t, label: t }));
}

function recruitDefaultTerm() {
  const d = new Date();
  return `${d.getMonth() >= 6 ? 'Fall' : 'Spring'} ${d.getFullYear() + (d.getMonth() >= 10 ? 1 : 0)}`;
}

function recruitCycleModalHtml(m) {
  const st = recruitState();
  const list = st.cycles?.list || [];
  const copy = [{ value: '', label: 'Start from the defaults' }, ...list.map((c) => ({ value: c.id, label: c.name }))];
  return `<div class="modal" role="dialog" aria-label="New cycle">
    <div class="modal__head"><h3>New cycle</h3><button class="icon-btn" data-action="modal-close" aria-label="Close">${I.x}</button></div>
    <div class="modal__body">
      <label>Name<input class="text-input" data-m="recruit-cycle-name" value="${MD.esc(m.name || '')}" placeholder="e.g. Fall 2026" maxlength="80" autocomplete="off" spellcheck="false"></label>
      <label>Term${dd('recruit-cycle-term', recruitTermOptions(m.term), m.term || recruitDefaultTerm())}</label>
      <label>Settings${dd('recruit-cycle-copy', copy, m.copyFrom || '')}</label>
      <p class="field-error" role="alert" ${m.error ? '' : 'hidden'}>${MD.esc(m.error || '')}</p>

  </div>`;
}

async function recruitCreateCycle() {
  const m = UI.modal;
  if (m?.kind !== 'recruit-cycle' || m.busy) return;
  const name = String($('.modal [data-m="recruit-cycle-name"]')?.value || '').trim();
  const term = $('.modal [data-m="recruit-cycle-term"]')?.dataset.value || '';
  const copyFrom = $('.modal [data-m="recruit-cycle-copy"]')?.dataset.value || '';
  Object.assign(m, { name, term, copyFrom });
  const error = $('.modal .field-error');
  const say = (text) => { m.error = text; if (error) { error.textContent = text; error.hidden = !text; } };
  if (!name) { say('A cycle needs a name.'); $('.modal [data-m="recruit-cycle-name"]')?.focus(); return; }
  m.requestId ||= recruitId('rq');
  m.busy = true;
  say('');
  const go = $('.modal [data-action="recruit-cycle-create"]');
  if (go) { go.disabled = true; go.textContent = 'Creating…'; }
  try {
    const out = await RECRUIT.api('/recruit/cycles', { method: 'POST', body: JSON.stringify({ requestId: m.requestId, name, term, copyFrom: copyFrom || undefined }) });
    const st = recruitState();
    st.cycles = undefined;
    if (UI.modal === m) closeModal(() => { nav(recruitPanelHref(out.cycle?.id || '', 'settings')); if (!out.cycle?.id) renderBackground('recruit'); });
    toast(`Created ${name}`);
  } catch (e) {
    m.busy = false;
    if (UI.modal === m) { say(recruitError(e)); if (go) { go.disabled = false; go.textContent = 'Create cycle'; } }
  }
}

/* ------------------------------- migration ------------------------------- */

// Explicit, idempotent, resumable: the server answers each step with the
// next one; repeating a finished step changes nothing.
async function recruitRunMigration() {
  const st = recruitState();
  if (!recruitIsAdmin() || st.busy.has('migrate')) return;
  st.busy.add('migrate');
  const note = $('[data-rc="migrate"]');
  const button = $('[data-action="recruit-migrate"]');
  if (button) button.disabled = true;
  const say = (text) => { const el = $('[data-rc="migrate"]') || note; if (el) el.textContent = text; };
  say('Importing…');
  let step = { step: 'live' }, n = 0;
  try {
    for (;;) {
      const out = await RECRUIT.api('/recruit/migrate', { method: 'POST', body: JSON.stringify({ requestId: recruitId('rq'), ...step }), signal: AbortSignal.timeout(60000) });
      if (out.done || !out.next) break;
      step = out.next;
      n += 1;
      say(`Importing… archive ${n}`);
      if (n > 500) throw new Error('Too many steps');
    }
    st.cycles = undefined;
    st.busy.delete('migrate');
    toast('Imported the current list and archives');
    renderBackground('recruit');
  } catch (e) {
    st.busy.delete('migrate');
    say(`Import stopped: ${recruitError(e)} Run it again to resume.`);
    if ($('[data-action="recruit-migrate"]')) $('[data-action="recruit-migrate"]').disabled = false;
    toast(`Import stopped: ${recruitError(e)}`);
  }
}

function recruitOpenAdopt(anchor) {
  const st = recruitState();
  const open = (st.cycles?.list || []).filter((c) => c.status === 'open' || c.status === 'draft');
  if (!open.length) { toast('Create or open a cycle first'); return; }
  openMenu(open.map((c) => ({ label: c.name, run: () => recruitAdopt(c.id, c.name) })), anchor);
}

async function recruitAdopt(cycleId, name) {
  const st = recruitState();
  if (st.busy.has('adopt')) return;
  st.busy.add('adopt');
  try {
    const out = await RECRUIT.api('/recruit/migrate/adopt', { method: 'POST', body: JSON.stringify({ requestId: recruitId('rq'), cycleId }) });
    st.cycles = undefined;
    toast(`Adopted ${recruitPlural(out.adopted || 0, 'submission')} into ${name}`);
  } catch (e) { toast(`Could not adopt: ${recruitError(e)}`); }
  finally { st.busy.delete('adopt'); renderBackground('recruit'); }
}

/* ------------------------------- cycle tools ----------------------------- */

const RECRUIT_STATUS_NEXT = {
  draft: [{ status: 'open', label: 'Open cycle' }],
  open: [{ status: 'closed', label: 'Close cycle…', confirm: true }],
  closed: [{ status: 'open', label: 'Reopen cycle' }, { status: 'archived', label: 'Archive cycle…', confirm: true }],
  archived: [{ status: 'closed', label: 'Unarchive cycle' }],
};

function recruitStatusChoices(cycle, roles = recruitMyRoles()) {
  const admin = roles.includes('admin');
  return (RECRUIT_STATUS_NEXT[cycle?.status] || []).filter((x) => admin || (['open', 'closed'].includes(x.status) && cycle.status !== 'archived'));
}

function recruitOpenCycleTools(anchor) {
  const st = recruitState();
  const cycle = recruitCycleRow();
  if (!cycle) return;
  const roles = recruitMyRoles();
  const lead = recruitCan('lead', roles), admin = recruitCan('admin', roles);
  const items = [{ label: 'Refresh', run: () => { const id = cycle.id; st.cycles = undefined; RECRUIT.reset(id); render(); } }];
  if (admin) items.push({ label: 'Sync queue', run: () => { st.queue = undefined; recruitLoadQueue(true); toast('Checking saved submissions…'); } });
  if (admin) items.push({ label: 'Check storage', run: recruitCheckStorage });
  const moves = recruitStatusChoices(cycle, roles);
  if (moves.length) items.push('-', ...moves.map((x) => ({ label: x.label, run: () => recruitSetStatus(x.status, x.confirm) })));
  if (admin && (cycle.status === 'archived' || cycle.status === 'draft')) items.push('-', { label: 'Delete cycle…', danger: true, icon: I.trash, run: recruitConfirmDeleteCycle });
  openMenu(items, anchor);
}

async function recruitCheckStorage() {
  try {
    await RECRUIT.api('/recruit/storage-check', { method: 'POST', body: '{}' });
    toast('Submission backup storage is working');
  } catch (e) { toast(`Storage check failed: ${recruitError(e)}`); }
}

function recruitSetStatus(status, confirm) {
  const cycle = recruitCycleRow();
  if (!cycle) return;
  const go = async () => {
    const st = recruitState();
    if (st.busy.has('status')) return;
    st.busy.add('status');
    try {
      const out = await RECRUIT.api(`/recruit/cycles/${encodeURIComponent(cycle.id)}/status`, { method: 'POST', body: JSON.stringify({ version: cycle.version, status }) });
      if (st.cycle?.data?.id === cycle.id && out.cycle) st.cycle.data = out.cycle;
      st.cycles = undefined;
      toast(status === 'open' ? 'Cycle is open' : status === 'closed' ? 'Cycle closed' : status === 'archived' ? 'Cycle archived' : 'Status updated');
    } catch (e) { recruitVersionToast(e, cycle.id); }
    finally { st.busy.delete('status'); renderBackground('recruit'); }
  };
  if (!confirm) { go(); return; }
  const st = recruitState();
  const intake = st.cycles?.intakeCycleId === cycle.id;
  UI.modal = {
    kind: 'confirm',
    title: status === 'archived' ? `Archive ${cycle.name}?` : `Close ${cycle.name}?`,
    text: status === 'archived'
      ? `Archived cycles are read-only. ${intake ? 'The website form stops landing here. ' : ''}You can unarchive it later.`
      : `Closed cycles stop taking applications.${intake ? ' The website form stops landing here until another cycle receives it.' : ''}`,
    confirm: status === 'archived' ? 'Archive cycle' : 'Close cycle',
    onGo: go,
  };
  render();
}

function recruitVersionToast(e, cycleId) {
  if (e?.status === 409) toast(recruitError(e), { label: 'Reload', run: () => { const st = recruitState(); st.cycles = undefined; RECRUIT.reset(cycleId); render(); } });
  else toast(recruitError(e));
}

function recruitConfirmDeleteCycle() {
  const cycle = recruitCycleRow();
  if (!cycle || !recruitCan('admin')) return;
  UI.modal = {
    kind: 'confirm', title: `Delete ${cycle.name}?`, danger: true, typed: 'delete cycle', confirm: 'Delete cycle',
    text: `Every application, score, interview, email record and role in <b>${MD.esc(cycle.name)}</b> is erased for good. Export the CSV first if you want a record.`,
    onGo: async () => {
      const st = recruitState();
      try {
        await RECRUIT.api(`/recruit/cycles/${encodeURIComponent(cycle.id)}`, { method: 'DELETE', signal: AbortSignal.timeout(60000) });
        st.cycles = undefined;
        RECRUIT.reset(null);
        toast(`Deleted ${cycle.name}`);
        nav('#/applications?all=1');
      } catch (e) { toast(`Could not delete: ${recruitError(e)}`); }
    },
  };
  render();
}

/* ------------------------------- settings panel -------------------------- */

function recruitSettingsPanelHtml(cycle, role) {
  const sections = RECRUIT.settingsSections(cycle, role);
  if (!sections.length) return `<div class="empty">${I.info}<b>No settings for your role</b></div>`;
  return `<div class="admin-grid rc-settings">${sections.map((s) => {
    let inner = '';
    try { inner = String(s.view?.(cycle, role) ?? ''); } catch (e) { console.error(e); inner = `<p class="field-error" role="alert">Could not draw this section.</p>`; }
    return `<section class="admin-block" id="rc-settings-${MD.esc(s.id)}" aria-labelledby="rc-settings-${MD.esc(s.id)}-h">
      <div class="admin-block__head"><h2 id="rc-settings-${MD.esc(s.id)}-h">${MD.esc(s.label || s.id)}</h2></div>${inner}</section>`;
  }).join('')}</div>`;
}

const recruitDateInput = (ts) => (ts ? new Date(Number(ts)).toISOString().slice(0, 10) : '');

// 'YYYY-MM-DD' text → epoch ms at local midnight, null when blank, NaN when bad.
function recruitParseDate(text, endOfDay = false) {
  const t = String(text || '').trim();
  if (!t) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
  if (!m) return NaN;
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), endOfDay ? 23 : 0, endOfDay ? 59 : 0, endOfDay ? 59 : 0);
  return d.getMonth() === Number(m[2]) - 1 ? d.getTime() : NaN;
}

function recruitFormField(label, inner, note) {
  return `<label class="rc-field">${MD.esc(label)}${inner}${note ? `<span class="sub">${MD.esc(note)}</span>` : ''}</label>`;
}

const RECRUIT_SETTINGS = [
  {
    id: 'cycle', label: 'Cycle', when: (c, role) => recruitCan('lead'),
    view: (cycle) => `<form class="rc-form" data-action="recruit-settings-cycle">
      ${recruitFormField('Name', `<input class="text-input" name="name" value="${MD.esc(cycle.name || '')}" maxlength="80" required autocomplete="off" spellcheck="false">`)}
      ${recruitFormField('Term', dd('recruit-term', recruitTermOptions(cycle.term), cycle.term || recruitDefaultTerm()))}
      ${recruitFormField('Opens', `<input class="text-input" name="opensAt" value="${MD.esc(recruitDateInput(cycle.opensAt))}" placeholder="YYYY-MM-DD" maxlength="10" autocomplete="off" spellcheck="false">`)}
      ${recruitFormField('Closes', `<input class="text-input" name="closesAt" value="${MD.esc(recruitDateInput(cycle.closesAt))}" placeholder="YYYY-MM-DD" maxlength="10" autocomplete="off" spellcheck="false">`)}
      ${recruitCan('admin') ? recruitFormField('Capacity', `<input class="text-input" name="capacity" value="${MD.esc(String(cycle.doc?.capacity || 0))}" inputmode="numeric" maxlength="6" autocomplete="off">`, '0 = unlimited') : ''}
      <div class="rc-form__foot"><button type="submit" class="btn btn--primary">Save</button></div>
    </form>`,
    submit: async (form, cycle) => {
      const opensAt = recruitParseDate(form.elements.opensAt?.value), closesAt = recruitParseDate(form.elements.closesAt?.value, true);
      if (Number.isNaN(opensAt) || Number.isNaN(closesAt)) throw new Error('Dates are YYYY-MM-DD.');
      if (opensAt && closesAt && closesAt < opensAt) throw new Error('Closes before it opens.');
      const body = { version: cycle.version, name: String(form.elements.name.value || '').trim(), term: $('[data-m="recruit-term"]', form)?.dataset.value || cycle.term, opensAt, closesAt };
      if (!body.name) throw new Error('A cycle needs a name.');
      if (form.elements.capacity) {
        const cap = Number(String(form.elements.capacity.value || '0').trim());
        if (!Number.isInteger(cap) || cap < 0) throw new Error('Capacity is a whole number.');
        body.capacity = cap;
      }
      const out = await RECRUIT.api(`/recruit/cycles/${encodeURIComponent(cycle.id)}`, { method: 'PATCH', body: JSON.stringify(body) });
      recruitAdoptCycle(out.cycle);
      form.dataset.adminDirty = 'false';
      toast('Saved');
      renderBackground('recruit');
    },
  },
  {
    id: 'status', label: 'Status', when: () => recruitCan('lead'),
    view: (cycle) => {
      const st = recruitState();
      const moves = recruitStatusChoices(cycle);
      return `<p class="admin-block__sub">${MD.esc(recruitStatusText(cycle, st.cycles?.intakeCycleId))}${cycle.closedAt ? ` · closed ${MD.esc(recruitDate(Number(cycle.closedAt)))}` : ''}</p>
      <div class="rc-actions">${moves.map((x) => `<button class="btn" data-action="recruit-status" data-status="${MD.esc(x.status)}" data-confirm="${x.confirm ? '1' : ''}">${MD.esc(x.label)}</button>`).join('') || '<span class="faint">Nothing to change.</span>'}</div>`;
    },
  },
  {
    id: 'website', label: 'Website form', when: () => recruitCan('admin'),
    view: (cycle) => {
      const st = recruitState();
      const current = st.cycles?.intakeCycleId || null;
      const receiving = current === cycle.id;
      const other = current && !receiving ? (st.cycles?.list || []).find((c) => c.id === current) : null;
      const note = receiving ? 'This cycle receives the website form.' : other ? `${other.name} receives the website form.` : st.cycles?.migration?.done ? 'No cycle receives the website form. Submissions wait as orphans.' : 'The old list receives the website form until the import runs.';
      return `<p class="admin-block__sub">${MD.esc(note)}</p>
      <div class="rc-actions"><button class="btn ${receiving ? '' : 'btn--primary'}" data-action="recruit-intake" data-on="${receiving ? '' : '1'}" ${cycle.status !== 'open' && !receiving ? 'disabled title="Open the cycle first"' : ''} aria-pressed="${receiving}">${receiving ? 'Stop receiving the website form' : 'Receive the website form'}</button></div>`;
    },
  },
  {
    id: 'subteams', label: 'Subteams', when: () => recruitCan('lead'),
    view: (cycle) => {
      const teams = recruitSubteams(cycle);
      return `<form class="rc-form rc-form--rows" data-action="recruit-settings-subteams">
        <div class="rc-rows" data-rc="subteam-rows">${teams.map((t) => recruitSubteamRowHtml(t)).join('')}</div>
        <div class="rc-form__foot"><button type="button" class="btn btn--sm" data-action="recruit-subteam-add">${I.plus} Add subteam</button><span style="flex:1"></span><button type="submit" class="btn btn--primary">Save</button></div>
      </form>`;
    },
    submit: async (form, cycle) => {
      const rows = $$('.rc-row', form);
      const settings = [], seen = new Set();
      for (const row of rows) {
        const name = String($('[name="name"]', row)?.value || '').trim();
        if (!name) continue;
        const key = row.dataset.key || recruitSlug(name);
        if (!key || seen.has(key)) throw new Error(`Two subteams share the key "${key}".`);
        seen.add(key);
        const capacity = Number(String($('[name="capacity"]', row)?.value || '0').trim());
        if (!Number.isInteger(capacity) || capacity < 0) throw new Error(`Capacity for ${name} is a whole number.`);
        const prior = recruitSubteams(cycle).find((t) => t.key === key);
        settings.push({ key, name, capacity, leads: prior?.leads || [] });
      }
      await recruitPutSettings(cycle, 'subteams', settings);
      form.dataset.adminDirty = 'false';
      toast('Subteams saved');
      renderBackground('recruit');
    },
  },
  {
    id: 'intake', label: 'Intake', when: () => recruitCan('admin'),
    view: (cycle) => {
      const it = cycle.doc?.intake || {};
      return `<form class="rc-form" data-action="recruit-settings-intake">
        ${recruitFormField('Per address per hour', `<input class="text-input" name="perIpHour" value="${MD.esc(String(it.perIpHour ?? 5))}" inputmode="numeric" maxlength="4">`)}
        ${recruitFormField('Per day', `<input class="text-input" name="perDay" value="${MD.esc(String(it.perDay ?? 2000))}" inputmode="numeric" maxlength="6">`)}
        <div class="rc-checks">
          <label class="rc-check"><input type="checkbox" name="notify" ${it.notify !== false ? 'checked' : ''}> Email the team on each new application</label>
          <label class="rc-check"><input type="checkbox" name="confirmUpdate" ${it.confirmUpdate !== false ? 'checked' : ''}> Let a returning applicant update their answers</label>
        </div>
        <div class="rc-form__foot"><button type="submit" class="btn btn--primary">Save</button></div>
      </form>`;
    },
    submit: async (form, cycle) => {
      const perIpHour = Number(form.elements.perIpHour.value), perDay = Number(form.elements.perDay.value);
      if (!Number.isInteger(perIpHour) || perIpHour < 1 || !Number.isInteger(perDay) || perDay < 1) throw new Error('Limits are whole numbers of at least 1.');
      await recruitPutSettings(cycle, 'intake', { ...(cycle.doc?.intake || {}), perIpHour, perDay, notify: form.elements.notify.checked, confirmUpdate: form.elements.confirmUpdate.checked });
      form.dataset.adminDirty = 'false';
      toast('Intake saved');
      renderBackground('recruit');
    },
  },
  {
    id: 'danger', label: 'Danger', when: (cycle) => recruitCan('admin'),
    view: (cycle) => `<p class="admin-block__sub">${cycle.status === 'archived' || cycle.status === 'draft' ? 'Deleting erases every record in this cycle.' : 'Only draft and archived cycles can be deleted.'}</p>
      <div class="rc-actions"><button class="btn btn--danger" data-action="recruit-cycle-delete" ${cycle.status === 'archived' || cycle.status === 'draft' ? '' : 'disabled'}>Delete cycle…</button></div>`,
  },
];

// A cycle's sections as the server reports them (GET /recruit/cycles/:id
// carries `sections` merged over the defaults).
function recruitSections(cycle) {
  const st = recruitState();
  return (st.cycle?.data?.id === cycle?.id && st.cycle.sections) || cycle?.doc?.site?.sections || {};
}

function recruitSubteamRowHtml(t = {}) {
  return `<div class="rc-row" data-key="${MD.esc(t.key || '')}">
    <input class="text-input" name="name" value="${MD.esc(t.name || '')}" placeholder="Subteam" maxlength="40" aria-label="Subteam name" autocomplete="off" spellcheck="false">
    <input class="text-input rc-row__num" name="capacity" value="${MD.esc(String(t.capacity || 0))}" inputmode="numeric" maxlength="4" aria-label="Capacity" title="0 = unlimited">
    <button type="button" class="icon-btn" data-action="recruit-subteam-remove" aria-label="Remove ${MD.esc(t.name || 'subteam')}">${I.x}</button>
  </div>`;
}

const recruitSlug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 24);

async function recruitPutSettings(cycle, module, settings) {
  const out = await RECRUIT.api(`/recruit/cycles/${encodeURIComponent(cycle.id)}/settings/${module}`, { method: 'PUT', body: JSON.stringify({ version: cycle.version, settings }) });
  recruitAdoptCycle(out.cycle);
  return out;
}

function recruitAdoptCycle(row) {
  const st = recruitState();
  if (row && st.cycle?.data?.id === row.id) st.cycle.data = row;
  st.cycles = undefined;
}

async function recruitToggleIntake(on) {
  const st = recruitState();
  const cycle = recruitCycleRow();
  if (!cycle || !recruitCan('admin') || st.busy.has('intake')) return;
  st.busy.add('intake');
  try {
    const body = { on: Boolean(on) };
    if (st.cycles?.settingsVersion !== null && st.cycles?.settingsVersion !== undefined) body.version = st.cycles.settingsVersion;
    const out = await RECRUIT.api(`/recruit/cycles/${encodeURIComponent(cycle.id)}/intake`, { method: 'POST', body: JSON.stringify(body) });
    if (st.cycles?.list) st.cycles.intakeCycleId = out.intakeCycleId || null;
    st.cycles = undefined;
    toast(on ? `${cycle.name} receives the website form` : 'The website form has no cycle now');
  } catch (e) { recruitVersionToast(e, cycle.id); }
  finally { st.busy.delete('intake'); renderBackground('recruit'); }
}

/* ============================================================================
   Applications — forms module (client). Each section tab has two views: the
   responses sheet and the form as the website shows it. The editor draws
   every question the way an applicant sees it, keeps one draft per section,
   and nothing reaches the website before Save.
   ========================================================================== */

'use strict';

// recruit:forms:start

const RECRUIT_QUESTION_TYPES = [
  { value: 'short', label: 'Short text' }, { value: 'long', label: 'Long text' }, { value: 'email', label: 'Email' },
  { value: 'single', label: 'Choose one' }, { value: 'multi', label: 'Choose many' }, { value: 'checkbox', label: 'Checkbox' },
  { value: 'link', label: 'Link' }, { value: 'file', label: 'File' },
];
const RECRUIT_FILE_ACCEPT = ['application/pdf', 'image/png', 'image/jpeg', 'image/webp', 'image/gif'];
// Questions the website posts as columns: they keep their key and type.
const RECRUIT_FIXED_KEYS = { interest: ['name', 'email', 'subteam', 'year', 'project', 'file'], coffee: ['name', 'email'], application: ['name', 'email'] };
// What the note under a question does on the website, by type.
const RECRUIT_HELP_HINT = {
  short: 'Placeholder text (optional)', long: 'Placeholder text (optional)', email: 'Placeholder text (optional)', link: 'Placeholder text (optional)',
  checkbox: 'Text next to the box', single: 'Note under the question (optional)', multi: 'Note under the question (optional)', file: 'Note under the question (optional)',
};
const recruitQuestionKey = (label) => { const k = String(label || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40); return /^[a-z]/.test(k) ? k : 'q_' + k; };
const recruitTypeLabel = (type) => (RECRUIT_QUESTION_TYPES.find((t) => t.value === type) || RECRUIT_QUESTION_TYPES[0]).label;
const recruitIsChoice = (type) => type === 'single' || type === 'multi';

const RECRUIT_SITE_URL = 'https://cornellphysicalintelligence.com';
const RECRUIT_GRIP = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';

// The form view of a section tab (?edit=1) is for leads.
const recruitEditingForm = () => recruitCan('lead') && UI.route?.params?.edit === '1';

/* ------------------------------- mode bar -------------------------------- */

// Responses | Form on one side; the form's address and whether the website
// takes it on the other.
function recruitModeBarInnerHtml(cycle, key, editing) {
  const st = recruitState();
  const sec = recruitSections(cycle)[key];
  const count = Number(st.cycle?.counts?.bySection?.[key] || 0);
  const receiving = st.cycles ? st.cycles.intakeCycleId === cycle.id : null;
  const open = sec?.open === true;
  const status = !sec ? '' : !open ? '<span class="rc-mode__dot"></span>Closed on the website'
    : receiving === false ? '<span class="rc-mode__dot"></span>Open, but another cycle receives the website'
    : '<span class="rc-mode__dot rc-mode__dot--on"></span>Open on the website';
  // Every form has a page of its own on the club site; the address is always
  // shown so it can be opened or copied. /apply (the QR code) shows the form
  // chosen for it, else the first open one.
  const landing = recruitLandingKey(cycle);
  const url = `${RECRUIT_SITE_URL}/apply/${encodeURIComponent(key)}/`;
  const link = `<span class="rc-mode__sep">·</span><a class="rc-mode__link" href="${MD.esc(url)}" target="_blank" rel="noopener" title="Open this form's page">${MD.esc(url.replace(/^https:\/\//, '').replace(/\/$/, ''))}</a><button type="button" class="icon-btn rc-mode__copy" data-action="recruit-copy-link" data-link="${MD.esc(url)}" aria-label="Copy the link to this form" title="Copy link">${I.copy}</button>${open && landing === key ? `<span class="rc-mode__also">and at <a class="rc-mode__link" href="${RECRUIT_SITE_URL}/apply/" target="_blank" rel="noopener">/apply</a></span>` : ''}`;
  const responses = `Responses <span class="count" data-rc-count="${MD.esc(key)}">${count.toLocaleString('en-US')}</span>`;
  const seg = recruitCan('lead')
    ? `<nav class="rc-seg" aria-label="View"><a href="${recruitPanelHref(cycle.id, key)}" ${editing ? '' : 'aria-current="page"'}>${responses}</a><a href="${recruitPanelHref(cycle.id, key, { edit: 1 })}" ${editing ? 'aria-current="page"' : ''}>Form</a></nav>`
    : `<span class="rc-mode__plain">${responses}</span>`;
  return `<span class="rc-mode__status" data-rc="mode-status">${status}${link}</span>${seg}`;
}

const recruitModeBarHtml = (cycle, key, editing) => `<div class="rc-mode" data-rc="mode-bar">${recruitModeBarInnerHtml(cycle, key, editing)}</div>`;

// The form /apply shows: the cycle's choice when that form is open, else the
// first open form in section order.
function recruitLandingKey(cycle) {
  const sections = recruitSections(cycle);
  const chosen = cycle?.doc?.site?.landing;
  if (RECRUIT_SECTION_KEYS.includes(chosen) && sections[chosen]?.open) return chosen;
  return RECRUIT_SECTION_KEYS.find((k) => sections[k]?.open) || null;
}

function recruitPaintModeBar(cycle, key, editing) {
  const bar = $('[data-rc="mode-bar"]');
  if (bar) bar.innerHTML = recruitModeBarInnerHtml(cycle, key, editing);
}

/* ------------------------------- model ----------------------------------- */

let recruitQuestionSeq = 0;
// Cards keep an identity across repaints so a move can be animated.
const recruitQuestionId = () => `q${++recruitQuestionSeq}`;

function recruitFormModel(sec, key, landing = null) {
  const fixed = new Set(RECRUIT_FIXED_KEYS[key] || ['name', 'email']);
  const questions = (Array.isArray(sec?.form?.questions) ? sec.form.questions : []).map((q) => {
    const out = {
      _id: recruitQuestionId(),
      key: q.key || '', type: RECRUIT_QUESTION_TYPES.some((t) => t.value === q.type) ? q.type : 'short',
      label: q.label || '', help: q.help || '', required: q.required === true, fixed: fixed.has(q.key),
    };
    if (Array.isArray(q.options)) out.options = q.options.map(String);
    if (q.max) out.max = Number(q.max);
    if (Array.isArray(q.accept)) out.accept = [...q.accept];
    if (q.maxBytes) out.maxBytes = Number(q.maxBytes);
    return out;
  });
  return { title: sec?.title || RECRUIT_SECTION_LABELS[key], description: sec?.description || '', open: sec?.open === true, atApply: landing === key, questions };
}

// One draft per cycle and section; it survives a look at the responses and
// comes back when the tab is opened again.
function recruitFormEditor(cycle, key) {
  const st = recruitState();
  st.forms ||= {};
  const id = `${cycle.id}:${key}`;
  if (!st.forms[id]) {
    const model = recruitFormModel(recruitSections(cycle)[key], key, cycle.doc?.site?.landing || null);
    st.forms[id] = { id, key, cycleId: cycle.id, model, saved: JSON.stringify(model), saving: false, error: '', savedAt: 0 };
  }
  return st.forms[id];
}
const recruitFormDirty = (fe) => JSON.stringify(fe.model) !== fe.saved;
const recruitFormsDirty = () => Object.values(recruitState().forms || {}).some(recruitFormDirty);

/* ------------------------------- html ------------------------------------ */

function recruitFormEditorHtml(cycle, key) {
  const fe = recruitFormEditor(cycle, key);
  const m = fe.model;
  return `<div class="fe" data-rc="form-editor" data-section="${MD.esc(key)}" role="region" aria-label="${MD.esc(RECRUIT_SECTION_LABELS[key])} editor">
    <div class="fe__head">
      <input class="fe__title" data-m="recruit-fe-title" value="${MD.esc(m.title)}" placeholder="Form title" maxlength="80" aria-label="Form title" autocomplete="off" spellcheck="false">
      <textarea class="fe__desc" data-m="recruit-fe-desc" rows="2" placeholder="A line or two shown above the form on the website" maxlength="600" aria-label="Description">${MD.esc(m.description)}</textarea>
    </div>
    <ol class="fe__list" data-rc="fe-list">${recruitQuestionCardsHtml(fe, cycle)}</ol>
    <div class="fe__add"><button type="button" class="btn" data-action="recruit-fe-add">${I.plus} Add question</button></div>
    <div class="fe__foot" data-rc="fe-foot">${recruitFormFootHtml(fe)}</div>
  </div>`;
}

const recruitQuestionCardsHtml = (fe, cycle) => fe.model.questions.map((q, i, all) => recruitQuestionCardHtml(q, i, all.length, cycle)).join('');

function recruitFormFootHtml(fe) {
  const dirty = recruitFormDirty(fe);
  const status = fe.saving ? 'Saving…' : dirty ? 'Unsaved changes' : fe.savedAt ? 'Saved' : '';
  return `<label class="fe-switch fe-switch--lg"><input type="checkbox" data-action="recruit-fe-open" ${fe.model.open ? 'checked' : ''}><span class="fe-switch__track"></span><span class="fe-switch__text">Open on the website</span></label>
    <label class="fe-switch fe-switch--lg" title="The QR code and the Apply link open /apply; one form shows there"><input type="checkbox" data-action="recruit-fe-landing" ${fe.model.atApply ? 'checked' : ''}><span class="fe-switch__track"></span><span class="fe-switch__text">Shown at /apply</span></label>
    ${fe.error ? `<span class="fe__error" role="alert">${MD.esc(fe.error)}</span>` : `<span class="fe__status ${dirty ? 'fe__status--dirty' : ''}" role="status">${status}</span>`}
    <button type="button" class="btn" data-action="recruit-fe-discard" ${dirty && !fe.saving ? '' : 'disabled'}>Discard</button>
    <button type="button" class="btn btn--primary" data-action="recruit-fe-save" ${dirty && !fe.saving ? '' : 'disabled'}>Save</button>`;
}

function recruitQuestionCardHtml(q, i, total, cycle) {
  const n = i + 1;
  const name = q.label || `question ${n}`;
  const typeControl = q.fixed
    ? `<span class="fe-q__type fe-q__type--fixed" title="The website needs this question as it is">${MD.esc(recruitTypeLabel(q.type))}</span>`
    : dd('recruit-fe-type', RECRUIT_QUESTION_TYPES, q.type, { small: true }).replace('data-m="recruit-fe-type"', `data-m="recruit-fe-type" data-i="${i}" aria-label="Answer type for ${MD.esc(name)}"`).replace('class="dd dd--sm"', 'class="dd dd--sm fe-q__type"');
  return `<li class="fe-q" data-i="${i}" data-qid="${MD.esc(q._id || '')}">
    <div class="fe-q__head">
      <button type="button" class="fe-q__grip" data-action="recruit-fe-grip" data-i="${i}" aria-label="Move ${MD.esc(name)}: drag, or press the arrow keys" title="Drag to reorder">${RECRUIT_GRIP}</button>
      <input class="fe-q__label" data-m="recruit-fe-label" data-i="${i}" value="${MD.esc(q.label)}" placeholder="Question" maxlength="120" aria-label="Question ${n}" autocomplete="off">
      ${typeControl}
    </div>
    <input class="fe-q__help" data-m="recruit-fe-help" data-i="${i}" value="${MD.esc(q.help)}" placeholder="${MD.esc(RECRUIT_HELP_HINT[q.type] || '')}" maxlength="300" aria-label="Note for question ${n}" autocomplete="off">
    <div class="fe-q__answer" data-rc="fe-answer">${recruitAnswerPreviewHtml(q, i)}</div>
    <div class="fe-q__foot">
      <label class="fe-switch"><input type="checkbox" data-action="recruit-fe-required" data-i="${i}" ${q.required ? 'checked' : ''}><span class="fe-switch__track"></span><span class="fe-switch__text">Required</span></label>
      <span class="fe-q__tools">
        ${q.fixed ? '<span class="fe-q__fixed" title="The website needs this question">Fixed</span>' : `<button type="button" class="icon-btn" data-action="recruit-fe-remove" data-i="${i}" aria-label="Remove ${MD.esc(name)}">${I.x}</button>`}
      </span>
    </div>
  </li>`;
}

// The answer as the applicant will see it.
function recruitAnswerPreviewHtml(q, i) {
  switch (q.type) {
    case 'long': return `<div class="fe-ans fe-ans--para">${MD.esc(q.help || 'Long answer')}</div>`;
    case 'email': return `<div class="fe-ans fe-ans--line">${MD.esc(q.help || 'netid@cornell.edu')}</div>`;
    case 'link': return `<div class="fe-ans fe-ans--line">${MD.esc(q.help || 'https://')}</div>`;
    case 'file': return `<div class="fe-ans fe-ans--file">${I.paperclip}<span>Photo or PDF, up to 2.5 MB</span></div>`;
    case 'checkbox': return `<div class="fe-ans fe-ans--check"><span class="fe-mark"></span><span>${MD.esc(q.help || 'Yes')}</span></div>`;
    case 'single': case 'multi': return recruitOptionsHtml(q, i);
    default: return `<div class="fe-ans fe-ans--line">${MD.esc(q.help || 'Short answer')}</div>`;
  }
}

function recruitOptionsHtml(q, i) {
  const mark = q.type === 'single' ? 'fe-mark fe-mark--radio' : 'fe-mark';
  const options = q.options || [];
  if (q.fixed) {
    const note = q.key === 'subteam' ? "Options follow this cycle's subteams, under Settings." : 'A fixed list.';
    return `<ul class="fe-opts">${options.map((o) => `<li class="fe-opt fe-opt--fixed"><span class="${mark}"></span><span class="fe-opt__text">${MD.esc(o)}</span></li>`).join('')}</ul><p class="fe-q__note">${note}</p>`;
  }
  return `<ul class="fe-opts">${options.map((o, j) => `<li class="fe-opt"><span class="${mark}"></span><input class="fe-opt__text" data-m="recruit-fe-option" data-i="${i}" data-j="${j}" value="${MD.esc(o)}" placeholder="Option ${j + 1}" maxlength="80" aria-label="Option ${j + 1}" autocomplete="off"><button type="button" class="icon-btn" data-action="recruit-fe-option-remove" data-i="${i}" data-j="${j}" aria-label="Remove option ${j + 1}">${I.x}</button></li>`).join('')}
    <li class="fe-opt fe-opt--add"><span class="${mark} fe-mark--ghost"></span><button type="button" class="linklike" data-action="recruit-fe-option-add" data-i="${i}">Add option</button></li></ul>`;
}

/* ------------------------------- edits ----------------------------------- */

function recruitFeCtx(el) {
  const cycle = recruitCycleRow();
  if (!cycle) return null;
  const host = el?.closest?.('[data-rc="form-editor"]') || $('[data-rc="form-editor"]');
  const key = host?.dataset?.section || recruitSection();
  const fe = recruitFormEditor(cycle, key);
  const q = fe.model.questions[Number(el?.dataset?.i)];
  return { cycle, key, fe, host, q, i: Number(el?.dataset?.i), j: Number(el?.dataset?.j) };
}

// Structural changes repaint the list and animate every card from where it
// was to where it is; typing repaints only the footer.
function recruitPaintForm(c, { list = true } = {}) {
  if (!c?.host) return;
  if (list) {
    const listEl = $('[data-rc="fe-list"]', c.host);
    const before = recruitCardTops(listEl);
    recruitRepaint(listEl, recruitQuestionCardsHtml(c.fe, c.cycle));
    recruitFlip(listEl, before);
  }
  recruitRepaint($('[data-rc="fe-foot"]', c.host), recruitFormFootHtml(c.fe));
}

const recruitCards = (listEl) => (listEl ? [...listEl.querySelectorAll('.fe-q')].filter((el) => el.parentElement === listEl) : []);
const recruitMeasurable = (el) => typeof el?.getBoundingClientRect === 'function';

function recruitCardTops(listEl) {
  const tops = new Map();
  for (const el of recruitCards(listEl)) if (recruitMeasurable(el)) tops.set(el.dataset.qid, el.getBoundingClientRect().top);
  return tops;
}

const recruitReducedMotion = () => typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

// FLIP: cards start where they were and glide to where they are now.
function recruitFlip(listEl, before) {
  if (!before.size || recruitReducedMotion()) return;
  const moved = [];
  for (const el of recruitCards(listEl)) {
    if (!recruitMeasurable(el) || !before.has(el.dataset.qid)) continue;
    const dy = before.get(el.dataset.qid) - el.getBoundingClientRect().top;
    if (Math.abs(dy) < 0.5) continue;
    el.style.transition = 'none';
    el.style.transform = `translateY(${dy}px)`;
    moved.push(el);
  }
  if (!moved.length) return;
  void listEl.offsetHeight;
  for (const el of moved) { el.style.transition = 'transform 220ms cubic-bezier(0.2, 0, 0, 1)'; el.style.transform = ''; }
  setTimeout(() => { for (const el of moved) { el.style.transition = ''; } }, 260);
}

// Dragging a card by its grip: the card follows the pointer, the others slide
// out of its way, and the drop repaints the list in the new order with no
// jump because everything is already where it will be.
function recruitDragStart(ev, grip) {
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  const card = grip.closest('.fe-q');
  const listEl = card?.parentElement;
  const c = recruitFeCtx(grip);
  if (!card || !listEl || !c?.q || !recruitMeasurable(card)) return;
  ev.preventDefault();
  const cards = recruitCards(listEl);
  const from = cards.indexOf(card);
  const rects = cards.map((el) => el.getBoundingClientRect());
  const gap = cards.length > 1 ? Math.max(0, rects[1].top - rects[0].bottom) : 12;
  const h = rects[from].height + gap;
  const startY = ev.clientY;
  const others = cards.map((_, j) => j).filter((j) => j !== from);
  let to = from;
  card.classList.add('is-dragging');
  listEl.classList.add('is-sorting');
  try { grip.setPointerCapture?.(ev.pointerId); } catch { /* capture is a nicety */ }
  const mine = (e) => e.pointerId === undefined || ev.pointerId === undefined || e.pointerId === ev.pointerId;
  const move = (e) => {
    if (!mine(e)) return;
    const dy = e.clientY - startY;
    card.style.transform = `translateY(${dy}px)`;
    const centre = rects[from].top + rects[from].height / 2 + dy;
    to = others.filter((j) => rects[j].top + rects[j].height / 2 < centre).length;
    for (const j of others) {
      const shift = j < from ? (j >= to ? h : 0) : (j <= to ? -h : 0);
      cards[j].style.transform = shift ? `translateY(${shift}px)` : '';
    }
  };
  const end = (e) => {
    if (e && !mine(e)) return;
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', end);
    document.removeEventListener('pointercancel', end);
    card.classList.remove('is-dragging');
    if (to !== from) {
      const qs = c.fe.model.questions;
      const [q] = qs.splice(from, 1);
      qs.splice(to, 0, q);
      recruitPaintForm(c);   // measured with the cards where they sit, so only the dragged one settles
      listEl.classList.remove('is-sorting');
      $(`.fe-q[data-i="${to}"] .fe-q__grip`, c.host)?.focus({ preventScroll: true });
    } else {
      for (const el of cards) el.style.transform = '';
      setTimeout(() => listEl.classList.remove('is-sorting'), 200);
    }
  };
  // Listened for on the document, so the drag survives the pointer leaving
  // the grip even where capture is refused.
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
}

if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
  document.addEventListener('pointerdown', (ev) => {
    const grip = typeof ev.target?.closest === 'function' ? ev.target.closest('.fe-q__grip') : null;
    if (grip) recruitDragStart(ev, grip);
  });
}

function recruitPaintAnswer(c) {
  const card = $(`.fe-q[data-i="${c.i}"] [data-rc="fe-answer"]`, c.host);
  if (card && !recruitIsChoice(c.q.type)) card.innerHTML = recruitAnswerPreviewHtml(c.q, c.i);
}

// Arrow keys on a grip move the card one slot; the list animates the same
// way a drop does.
function recruitMoveQuestion(el, delta) {
  const c = recruitFeCtx(el);
  if (!c?.q) return;
  const qs = c.fe.model.questions, j = c.i + delta;
  if (j < 0 || j >= qs.length) return;
  [qs[c.i], qs[j]] = [qs[j], qs[c.i]];
  recruitPaintForm(c);
  $(`.fe-q[data-i="${j}"] .fe-q__grip`, c.host)?.focus({ preventScroll: true });
}

// What the server stores: keys for new questions come from their labels.
function recruitFormPayload(fe) {
  const used = new Set(fe.model.questions.map((q) => q.key).filter(Boolean));
  const questions = fe.model.questions.map((q, i) => {
    const label = String(q.label || '').trim();
    if (!label) throw Object.assign(new Error(`Question ${i + 1} needs a label.`), { focus: `[data-m="recruit-fe-label"][data-i="${i}"]` });
    let key = q.key;
    if (!key) {
      const base = recruitQuestionKey(label);
      key = base;
      for (let n = 2; used.has(key); n += 1) key = `${base.slice(0, 37)}_${n}`;
      used.add(key);
    }
    const out = { key, type: q.type, label, help: String(q.help || '').trim(), required: q.required === true };
    if (recruitIsChoice(q.type)) {
      const options = [...new Set((q.options || []).map((o) => String(o).trim()).filter(Boolean))];
      if (!options.length) throw Object.assign(new Error(`"${label}" needs at least one option.`), { focus: `[data-m="recruit-fe-option"][data-i="${i}"], [data-action="recruit-fe-option-add"][data-i="${i}"]` });
      out.options = options;
    }
    if (q.max) out.max = q.max;
    if (q.type === 'file') { out.accept = Array.isArray(q.accept) && q.accept.length ? q.accept : RECRUIT_FILE_ACCEPT; out.maxBytes = q.maxBytes || 2621440; }
    return out;
  });
  return { title: String(fe.model.title || '').trim() || RECRUIT_SECTION_LABELS[fe.key], description: String(fe.model.description || '').trim(), open: fe.model.open === true, form: { questions } };
}

async function recruitSaveForm(el) {
  const c = recruitFeCtx(el);
  if (!c || c.fe.saving) return;
  const { fe, cycle, key } = c;
  let payload;
  try { payload = recruitFormPayload(fe); }
  catch (e) { fe.error = e.message; recruitPaintForm(c, { list: false }); if (e.focus) $(e.focus, c.host)?.focus(); return; }
  fe.saving = true; fe.error = '';
  recruitPaintForm(c, { list: false });
  try {
    // The /apply choice is one per cycle: this form takes it, gives it up, or leaves it.
    const current = cycle.doc?.site?.landing || null;
    const landing = fe.model.atApply ? key : (current === key ? null : current);
    await recruitPutSettings(cycle, 'site', { sections: { [key]: payload }, landing });
    const st = recruitState();
    if (st.cycle?.data?.id === cycle.id) st.cycle.sections = { ...recruitSections(cycle), [key]: payload };
    fe.model = recruitFormModel(payload, key, landing);
    fe.saved = JSON.stringify(fe.model);
    fe.savedAt = Date.now();
    toast(`${RECRUIT_SECTION_LABELS[key]} saved${payload.open ? ' · live on the website' : ''}`);
  } catch (e) { fe.error = recruitError(e); }
  fe.saving = false;
  const host = $('[data-rc="form-editor"]');
  if (host?.dataset.section === key) { c.host = host; recruitPaintForm(c); recruitPaintModeBar(recruitCycleRow() || cycle, key, true); }
}

if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('beforeunload', (ev) => {
    try { if (recruitFormsDirty()) { ev.preventDefault(); ev.returnValue = ''; } } catch { /* nothing to guard */ }
  });
}

RECRUIT.register({
  name: 'forms',
  order: 12,
  kernel: true,
  actions: {
    'recruit-fe-add': (el) => {
      const c = recruitFeCtx(el);
      if (!c) return;
      c.fe.model.questions.push({ key: '', type: 'short', label: '', help: '', required: false, fixed: false });
      recruitPaintForm(c);
      $$('[data-m="recruit-fe-label"]', c.host).at(-1)?.focus({ preventScroll: true });
    },
    'recruit-fe-remove': (el) => {
      const c = recruitFeCtx(el);
      if (!c?.q || c.q.fixed) return;
      c.fe.model.questions.splice(c.i, 1);
      recruitPaintForm(c);
      ($$('[data-m="recruit-fe-label"]', c.host)[Math.min(c.i, c.fe.model.questions.length - 1)] || $('[data-action="recruit-fe-add"]', c.host))?.focus({ preventScroll: true });
    },
    'recruit-fe-grip': () => {},   // a click on the grip does nothing; dragging and the arrow keys move the card
    'recruit-fe-required': (el) => { const c = recruitFeCtx(el); if (!c?.q) return; c.q.required = Boolean(el.checked); recruitPaintForm(c, { list: false }); },
    'recruit-fe-open': (el) => { const c = recruitFeCtx(el); if (!c) return; c.fe.model.open = Boolean(el.checked); recruitPaintForm(c, { list: false }); },
    'recruit-fe-landing': (el) => { const c = recruitFeCtx(el); if (!c) return; c.fe.model.atApply = Boolean(el.checked); recruitPaintForm(c, { list: false }); },
    'recruit-fe-option-add': (el) => {
      const c = recruitFeCtx(el);
      if (!c?.q || c.q.fixed) return;
      c.q.options = [...(c.q.options || []), ''];
      recruitPaintForm(c);
      $$(`[data-m="recruit-fe-option"][data-i="${c.i}"]`, c.host).at(-1)?.focus({ preventScroll: true });
    },
    'recruit-fe-option-remove': (el) => {
      const c = recruitFeCtx(el);
      if (!c?.q || c.q.fixed || !Array.isArray(c.q.options)) return;
      c.q.options.splice(c.j, 1);
      recruitPaintForm(c);
      ($$(`[data-m="recruit-fe-option"][data-i="${c.i}"]`, c.host)[Math.min(c.j, c.q.options.length - 1)] || $(`[data-action="recruit-fe-option-add"][data-i="${c.i}"]`, c.host))?.focus({ preventScroll: true });
    },
    'recruit-copy-link': async (el) => {
      const link = el.dataset.link || '';
      try { await navigator.clipboard.writeText(link); toast('Link copied'); }
      catch { toast('Could not copy; the address is next to the button'); }
    },
    'recruit-fe-save': (el) => recruitSaveForm(el),
    'recruit-fe-discard': (el) => {
      const c = recruitFeCtx(el);
      if (!c) return;
      c.fe.model = JSON.parse(c.fe.saved); c.fe.error = '';
      recruitPaintForm(c);
      toast('Changes discarded');
    },
  },
  inputs: {
    'recruit-fe-title': (el) => { const c = recruitFeCtx(el); if (!c) return; c.fe.model.title = el.value; recruitPaintForm(c, { list: false }); },
    'recruit-fe-desc': (el) => { const c = recruitFeCtx(el); if (!c) return; c.fe.model.description = el.value; recruitPaintForm(c, { list: false }); },
    'recruit-fe-label': (el) => { const c = recruitFeCtx(el); if (!c?.q) return; c.q.label = el.value; recruitPaintForm(c, { list: false }); },
    'recruit-fe-help': (el) => { const c = recruitFeCtx(el); if (!c?.q) return; c.q.help = el.value; recruitPaintAnswer(c); recruitPaintForm(c, { list: false }); },
    'recruit-fe-option': (el) => { const c = recruitFeCtx(el); if (!c?.q || !Array.isArray(c.q.options)) return; c.q.options[c.j] = el.value; recruitPaintForm(c, { list: false }); },
  },
  dd: {
    // The default menu from data-opts opens; the pick lands here with a value.
    'recruit-fe-type': (host, value) => {
      if (value === undefined) return undefined;
      const c = recruitFeCtx(host);
      if (!c?.q || c.q.fixed || c.q.type === value) return;
      const wasChoice = recruitIsChoice(c.q.type), isChoice = recruitIsChoice(value);
      c.q.type = value;
      if (isChoice && !wasChoice) c.q.options = [''];
      if (!isChoice) delete c.q.options;
      if (value === 'file') { c.q.accept = [...RECRUIT_FILE_ACCEPT]; c.q.maxBytes = 2621440; } else { delete c.q.accept; delete c.q.maxBytes; }
      recruitPaintForm(c);
      $(`[data-m="recruit-fe-type"][data-i="${c.i}"]`, c.host)?.focus({ preventScroll: true });
    },
  },
  keydown(ev) {
    const grip = typeof ev.target?.matches === 'function' && ev.target.matches('.fe-q__grip') ? ev.target : null;
    if (!grip || (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown')) return false;
    ev.preventDefault();
    recruitMoveQuestion(grip, ev.key === 'ArrowUp' ? -1 : 1);
    return true;
  },
  reset() {},
});
