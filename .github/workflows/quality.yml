name: Wiki quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run test:search
      - name: Verify intake recovery, transfer limits, and keyboard behavior
        run: |
          npm run test:interest
          node scripts/test-intake-journal.mjs
          node scripts/test-db-transfer.mjs
          node scripts/test-snapshot.mjs
          node scripts/test-remote-sync.mjs
          node scripts/test-overlay-keyboard.mjs
          node scripts/test-interest-archive-load.mjs
      - name: Verify the committed preview build is current
        run: git diff --exit-code -- docs
