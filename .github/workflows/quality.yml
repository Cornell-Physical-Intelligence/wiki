name: Wiki quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run test:search
      - run: npm run test:assistance
      - run: node --test scripts/test-ai-usage.mjs scripts/test-ai-usage-ui.mjs
      - name: Verify intake recovery, transfer limits, and keyboard behavior
        run: |
          npm run test:interest
          node scripts/test-interest-interactions.mjs
          node scripts/test-interest-attachments.mjs
          node scripts/test-admin-interactions.mjs
          node scripts/test-admin-members.mjs
          node scripts/test-interest-filter.mjs
          node --test scripts/test-review-search.mjs scripts/test-review-render.mjs
          node scripts/test-review-editor.mjs
          node --test scripts/test-popup-placement.mjs
          node scripts/test-intake-journal.mjs
          node scripts/test-db-transfer.mjs
          node scripts/test-multipart-upload.mjs
          node scripts/test-snapshot.mjs
          node scripts/test-remote-sync.mjs
          node scripts/test-overlay-keyboard.mjs
          node scripts/test-interest-archive-load.mjs
          node scripts/test-session.mjs
          node scripts/test-hardening.mjs
          npm run test:recruit
          node --test scripts/test-recruit-contract.mjs
          node --test scripts/test-recruit-storage.mjs
      - name: Verify the committed preview build is current
        run: git diff --exit-code -- docs
