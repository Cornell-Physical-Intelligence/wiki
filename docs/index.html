// Older revisions with body:null mean "previous body is close enough" — resolved
// at seed time so diffs are real without tripling this file's size.

/* ============================================================================
   Markdown engine. Standard Markdown plus the team dialect:
     [[Page]] wiki links · ::: callouts · task lists that stay interactive in
     read mode · att: images with captions · !file[label](att:id) cards ·
     bare Onshape / Altium 365 URLs become rich cards · ``` or ~~~ fences.
   render(src, ctx) returns { html, toc, tasks } — ctx resolves pages and
   attachments so the engine stays pure.
   ========================================================================== */

'use strict';

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const slugify = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'p';

/* ------------------------------- syntax highlight ------------------------ */

const KEYWORDS = 'if else for while return def class import from const let var function async await new try catch switch case break continue struct void int float double bool true false null None nullptr public private static include using namespace pass raise with lambda yield fn match pub mut'.split(' ');

function highlight(code, lang) {
  // Tokenize raw text, escape per token. Comments and strings win over keywords.
  const rules = [
    { re: /(#|\/\/)[^\n]*/y, cls: 'tok-c' },
    { re: /\/\*[\s\S]*?\*\//y, cls: 'tok-c' },
    { re: /"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'/y, cls: 'tok-s' },
    { re: /\b\d+(?:\.\d+)?\b/y, cls: 'tok-n' },
    { re: /[A-Za-z_][A-Za-z0-9_]*/y, cls: null }, // maybe keyword
    { re: /[\s\S]/y, cls: null },
  ];
  let out = '', i = 0;
  while (i < code.length) {
    let matched = false;
    for (const r of rules) {
      r.re.lastIndex = i;
      const m = r.re.exec(code);
      if (m && m.index === i) {
        const t = m[0];
        if (r.cls) out += `<span class="${r.cls}">${esc(t)}</span>`;
        else if (/^[A-Za-z_]/.test(t) && KEYWORDS.includes(t)) out += `<span class="tok-k">${esc(t)}</span>`;
        else out += esc(t);
        i += t.length; matched = true; break;
      }
    }
    if (!matched) { out += esc(code[i]); i++; }
  }
  return out;
}

/* ------------------------------- embeds ---------------------------------- */

function parseEmbedUrl(url) {
  let m = url.match(/^https:\/\/cad\.onshape\.com\/documents\/([a-f0-9]+)(?:\/[wv]\/([a-f0-9]+))?(?:\/e\/([a-f0-9]+))?/i);
  if (m) return { kind: 'onshape', label: 'Onshape document', ref: `doc ${m[1].slice(0, 8)}…${m[3] ? ' · element ' + m[3].slice(0, 6) + '…' : ''}`, url };
  m = url.match(/^https:\/\/([a-z0-9-]+)\.altium\.com\/designs\/([A-Za-z0-9-]+)/i);
  if (m) return { kind: 'altium', label: 'Altium 365 design', ref: `${m[1]} · ${m[2].slice(0, 8)}…`, url };
  return null;
}

const EMBED_ICONS = {
  onshape: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2.5l8 4.6v9.3l-8 4.6-8-4.6V7.1z"/><path d="M12 2.5v9.2m0 0l8-4.6m-8 4.6l-8-4.6" opacity=".55"/></svg>',
  altium: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><circle cx="9" cy="9" r="1.6"/><circle cx="15" cy="15" r="1.6"/><path d="M9 10.6V15h4.4"/></svg>',
};

function embedCard(e) {
  return `<div class="embed-card embed-card--${e.kind}">
    <span class="embed-card__icon">${EMBED_ICONS[e.kind]}</span>
    <span class="embed-card__meta"><b>${esc(e.label)}</b><span class="embed-card__ref">${esc(e.ref)}</span></span>
    <span class="embed-card__note">live viewer on production</span>
    <a class="btn btn--sm" href="${esc(e.url)}" target="_blank" rel="noreferrer">Open&nbsp;&#8599;</a>
  </div>`;
}

/* ------------------------------- inline ---------------------------------- */

const FILE_ICONS = {
  cad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2.5l8 4.6v9.3l-8 4.6-8-4.6V7.1z"/><path d="M12 21V11.7m0 0L4 7.1m8 4.6l8-4.6"/></svg>',
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2.8h8l4 4v14.4H6z"/><path d="M14 2.8v4h4"/><path d="M9 13h6M9 16.5h6"/></svg>',
  ecad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h4m8 0h4M12 4v4m0 8v4"/><circle cx="12" cy="12" r="2.4"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2.8h8l4 4v14.4H6z"/><path d="M14 2.8v4h4"/></svg>',
};

function fileKind(name, type) {
  const n = (name || '').toLowerCase();
  if (/\.(stl|obj)$/.test(n) || /^model\//.test(type || '')) return { icon: 'cad', tag: n.endsWith('.obj') ? 'OBJ' : 'STL', viewer: true };
  if (/\.(step|stp|f3d|iges|igs|sldprt|3mf)$/.test(n)) return { icon: 'cad', tag: n.split('.').pop().toUpperCase(), viewer: false };
  if (/\.(schdoc|pcbdoc|prjpcb|kicad_sch|kicad_pcb)$/.test(n)) return { icon: 'ecad', tag: n.split('.').pop().replace('kicad_', '').toUpperCase(), viewer: false };
  if (/\.pdf$/.test(n)) return { icon: 'pdf', tag: 'PDF', viewer: false };
  return { icon: 'file', tag: (n.split('.').pop() || 'file').toUpperCase().slice(0, 6), viewer: false };
}

function fmtSize(b) {
  if (b == null) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(b < 10240 ? 1 : 0) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

function fileCard(label, att) {
  if (!att) return `<span class="missing-att">missing attachment</span>`;
  const k = fileKind(att.name, att.type);
  const body = `<span class="filecard__icon">${FILE_ICONS[k.icon]}</span>
    <span class="filecard__meta"><b>${esc(label || att.name)}</b><span>${esc(att.name)} · ${k.tag} · ${fmtSize(att.size)}</span></span>`;
  if (k.viewer) {
    return `<div class="cad-embed" data-att="${esc(att.id)}"><div class="cad-embed__head">${body}<span class="cad-embed__hint">drag to orbit · scroll to zoom</span></div><div class="cad-embed__stage"><canvas></canvas></div></div>`;
  }
  return `<div class="filecard" data-att="${esc(att.id)}">${body}<button class="btn btn--sm" data-action="att-open" data-id="${esc(att.id)}">Open</button></div>`;
}

function renderInline(src, ctx, opts = {}) {
  let s = esc(src);

  // Backslash escapes (GFM): \* renders a literal *, never emphasis.
  const escStash = [];
  s = s.replace(/\\([\\`*_~\[\]()#!|{}<>+.-])/g, (_, ch) => { escStash.push(esc(ch)); return `\x02${escStash.length - 1}\x02`; });

  // Protect code spans first.
  const stash = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { stash.push(`<code>${c}</code>`); return `␀${stash.length - 1}␀`; });

  // Images: ![alt](src "caption")
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;([^&]*?)&quot;)?\)/g, (whole, alt, url, cap) => {
    let srcUri = url;
    if (url.startsWith('att:')) {
      const att = ctx.att(url.slice(4));
      if (!att) return `<span class="missing-att">missing attachment</span>`;
      srcUri = att.dataUri || att.url;
    }
    // Unsupported scheme: show the author their literal syntax, never half of it.
    if (!/^(data:|https?:|\/api\/att\/)/.test(srcUri)) return whole;
    const img = `<img src="${srcUri}" alt="${alt}" loading="lazy" data-action="lightbox">`;
    return cap ? `<figure>${img}<figcaption>${cap}</figcaption></figure>` : img;
  });

  // Links [text](url) — external only; internal linking is [[...]].
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s\x00]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noreferrer" class="ext">${t}</a>`);

  // Wiki links [[Title]] or [[Title|label]] or [[Title#Anchor|label]]
  s = s.replace(/\[\[([^\]|#]+)(?:#([^\]|]+))?(?:\|([^\]]+))?\]\]/g, (_, title, anchor, label) => {
    const t = title.trim();
    const page = ctx.pageByTitle(t);
    const text = label ? label.trim() : t;
    if (page) {
      const hash = anchor ? '#' + slugify(anchor) : '';
      return `<a href="#/page/${page.id}${hash}" class="wikilink">${esc(text)}</a>`;
    }
    return `<a href="#/new?title=${encodeURIComponent(t)}" class="wikilink wikilink--missing" title="Page doesn't exist yet — click to create">${esc(text)}</a>`;
  });

  // Autolinks
  s = s.replace(/(^|[\s(])((?:https?:\/\/)[^\s<)\x00]+)/g, (_, pre, u) => `${pre}<a href="${u}" target="_blank" rel="noreferrer" class="ext">${u.replace(/^https?:\/\//, '').replace(/\/$/, '')}</a>`);

  // Emphasis / strike
  s = s.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(>])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|[\s(>])_([^_\n]+)_/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');

  if (!opts.noBreaks) s = s.replace(/\n/g, '<br>');

  s = s.replace(/␀(\d+)␀/g, (_, i) => stash[+i]);
  s = s.replace(/\x02(\d+)\x02/g, (_, i) => escStash[+i]);
  return s;
}

/* ------------------------------- blocks ---------------------------------- */

const CALLOUT_ICONS = {
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11.5V16"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.5l9.5 16.5H2.5z"/><path d="M12 10v4m0 3h.01"/></svg>',
  tip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6m-5 3h4M12 3a6 6 0 013.6 10.8c-.7.6-1.1 1.3-1.1 2.2H9.5c0-.9-.4-1.6-1.1-2.2A6 6 0 0112 3z"/></svg>',
};

function mdRender(src, ctx) {
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  const toc = [];
  // The task counter is shared across nested renders (callouts, blockquotes)
  // so every checkbox's index matches its position in document order — the
  // same order walkTasks() sees. Diverging here silently flips wrong lines.
  const counter = ctx._taskCounter || (ctx._taskCounter = { i: 0 });
  let html = '';
  let i = 0;
  const usedIds = new Set();

  const headingId = (text) => {
    let id = slugify(text.replace(/\[\[|\]\]|[*_`]/g, ''));
    while (usedIds.has(id)) id += '-x';
    usedIds.add(id);
    return id;
  };

  function listAt(start, baseIndent) {
    // Parses a (possibly nested) list starting at `start`. Returns [html, next].
    let out = '', k = start, ordered = null, open = false, startNum = 1;
    const itemRe = /^(\s*)([-*]|\d+[.)])\s+(.*)$/;
    while (k < lines.length) {
      const m = lines[k].match(itemRe);
      if (!m) break;
      const ind = m[1].length;
      if (ind < baseIndent) break;
      if (ind > baseIndent) { // nested list inside previous item
        const [inner, next] = listAt(k, ind);
        out = out.replace(/<\/li>\s*$/, '') + inner + '</li>';
        k = next; continue;
      }
      const isOrd = /\d/.test(m[2][0]);
      if (!open) { ordered = isOrd; open = true; if (isOrd) startNum = parseInt(m[2], 10) || 1; }
      let body = m[3];
      const task = body.match(/^\[( |x|X)\]\s+(.*)$/);
      if (task) {
        const done = task[1].toLowerCase() === 'x';
        const idx = counter.i++;
        out += `<li class="task${done ? ' done' : ''}"><input type="checkbox" data-task="${idx}" ${done ? 'checked' : ''} ${ctx.readonly ? 'disabled' : ''}><span class="task-text">${renderInline(task[2], ctx)}</span></li>`;
      } else {
        out += `<li>${renderInline(body, ctx)}</li>`;
      }
      k++;
    }
    const tag = ordered ? 'ol' : 'ul';
    const attr = ordered && startNum !== 1 ? ` start="${startNum}"` : '';
    return [`<${tag}${attr}>${out}</${tag}>`, k];
  }

  while (i < lines.length) {
    const line = lines[i];

    if (!line.trim()) { i++; continue; }

    // Fences
    let m = line.match(/^(```|~~~)\s*(\w*)\s*$/);
    if (m) {
      const fence = m[1], lang = m[2];
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].startsWith(fence)) { buf.push(lines[i]); i++; }
      i++;
      const code = buf.join('\n');
      html += `<pre>${lang ? `<span class="codelang">${esc(lang)}</span>` : ''}<code>${lang ? highlight(code, lang) : esc(code)}</code></pre>`;
      continue;
    }

    // Callouts ::: kind Title? ... :::
    m = line.match(/^:::\s*(note|warn|tip)\s*(.*)$/);
    if (m) {
      const kind = m[1], title = m[2].trim();
      const buf = [];
      i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      const inner = mdRender(buf.join('\n'), { ...ctx, _nested: true });
      html += `<div class="callout callout--${kind}">${CALLOUT_ICONS[kind]}<div>${title ? `<p class="callout__title">${renderInline(title, ctx)}</p>` : ''}${inner.html}</div></div>`;
      continue;
    }

    // Headings
    m = line.match(/^(#{1,4})\s+(.*)$/);
    if (m) {
      const lvl = Math.max(2, m[1].length); // h1 is the page title; demote
      const text = m[2].trim();
      const id = headingId(text);
      if (lvl <= 3) toc.push({ lvl, id, text: text.replace(/\[\[([^\]|]+)(\|[^\]]+)?\]\]/g, '$1').replace(/[*_`]/g, '') });
      // Full-route href when the page is known, so copied links and reloads work.
      const hhref = ctx.pageId ? `#/page/${ctx.pageId}#${id}` : `#${id}`;
      html += `<h${lvl} id="${id}"><a class="hlink" href="${hhref}" aria-label="Link to section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.7 1.7M14 10a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.7-1.7"/></svg></a>${renderInline(text, ctx)}</h${lvl}>`;
      i++;
      continue;
    }

    // HR
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { html += '<hr>'; i++; continue; }

    // Blockquote
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      const inner = mdRender(buf.join('\n'), { ...ctx, _nested: true });
      html += `<blockquote>${inner.html}</blockquote>`;
      continue;
    }

    // Table — rows tolerate a missing trailing pipe rather than vanishing.
    if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
      const heads = line.replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map((c) => c.trim());
      i += 2;
      let rows = '';
      while (i < lines.length && /^\|/.test(lines[i]) && lines[i].trim() !== '') {
        const cells = lines[i].replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map((c) => c.trim());
        rows += `<tr>${cells.map((c) => `<td>${renderInline(c, ctx, { noBreaks: true })}</td>`).join('')}</tr>`;
        i++;
      }
      html += `<div class="tablewrap"><table><thead><tr>${heads.map((h) => `<th>${renderInline(h, ctx, { noBreaks: true })}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
      continue;
    }

    // Lists
    if (/^(\s*)([-*]|\d+[.)])\s+/.test(line)) {
      const [out, next] = listAt(i, line.match(/^(\s*)/)[1].length);
      html += out;
      i = next;
      continue;
    }

    // File card on its own line
    m = line.match(/^!file\[([^\]]*)\]\(att:([^)\s]+)\)\s*$/);
    if (m) { html += fileCard(m[1], ctx.att(m[2])); i++; continue; }

    // Bare embed URL on its own line
    if (/^https:\/\/\S+$/.test(line.trim())) {
      const e = parseEmbedUrl(line.trim());
      if (e) { html += embedCard(e); i++; continue; }
    }

    // Paragraph: gather until blank or a structural line
    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() &&
      !/^(#{1,4}\s|>\s?|(\s*)([-*]|\d+[.)])\s|```|~~~|:::|\|.*\||!file\[|(-{3,}|\*{3,})\s*$)/.test(lines[i]) &&
      !/^https:\/\/\S+$/.test(lines[i].trim())
    ) { buf.push(lines[i]); i++; }
    html += `<p>${renderInline(buf.join('\n'), ctx)}</p>`;
  }

  return { html, toc, tasks: counter.i };
}

/* ------------------------------- source helpers -------------------------- */

// Walk task lines exactly the way the renderer encounters them: skip fenced
// code (the renderer never renders checkboxes there) and see through
// blockquote '>' prefixes (the renderer does render those). Callout bodies
// are ordinary lines, so document order alone keeps parity.
function walkTasks(src, visit) {
  const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  let fence = null, idx = 0;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    // Fence tracking works on the quote-stripped line so fences inside
    // blockquotes are honored — the renderer's nested pass skips them too.
    const bare = line.replace(/^(\s*>\s?)+/, '');
    if (fence) { if (bare.startsWith(fence)) fence = null; continue; }
    const f = bare.match(/^(```|~~~)\s*(\w*)\s*$/); // must mirror the renderer's fence rule exactly
    if (f) { fence = f[1]; continue; }
    // (?=\s): the renderer only treats "[x] " (with a following space) as a task.
    const m = bare.match(/^(\s*(?:[-*]|\d+[.)])\s+\[)( |x|X)(\])(?=\s)/);
    if (!m) continue;
    const out = visit(idx, m[2], line, i);
    if (out !== undefined) { lines[i] = out; return lines.join('\n'); }
    idx++;
  }
  return null;
}

// Flip the nth task checkbox in a markdown source (nth in render order).
function toggleTaskInSource(src, n) {
  const out = walkTasks(src, (idx, state, line) => {
    if (idx !== n) return undefined;
    return line.replace(/^((?:\s*>\s?)*\s*(?:[-*]|\d+[.)])\s+\[)( |x|X)(\])(?=\s)/, (_, pre, st, post) =>
      pre + (st.trim() ? ' ' : 'x') + post);
  });
  return out === null ? String(src) : out;
}

// Task totals for the page-head meter, fence-aware like the renderer.
function countTasks(src) {
  let total = 0, done = 0;
  walkTasks(src, (idx, state) => { total++; if (state.trim()) done++; return undefined; });
  return { total, done };
}

// Outgoing wiki-link titles, for backlink indexing.
function extractWikiLinks(src) {
  const out = new Set();
  const clean = String(src || '').replace(/```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]*`/g, '');
  let m;
  const re = /\[\[([^\]|#]+)(?:#[^\]|]+)?(?:\|[^\]]+)?\]\]/g;
  while ((m = re.exec(clean))) out.add(m[1].trim().toLowerCase());
  return [...out];
}

// Plain text for search indexing and snippets.
function mdToText(src) {
  return String(src || '')
    .replace(/^(```|~~~).*$/gm, ' ') // keep code content searchable, drop the fences
    .replace(/!file\[([^\]]*)\]\([^)]*\)/g, ' $1 ')
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, ' $1 ')
    .replace(/\[\[([^\]|#]+)(?:#[^\]|]+)?(?:\|([^\]]+))?\]\]/g, (_, t, l) => l || t)
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/^:::.*$|^[#>|*-]+\s*/gm, ' ')
    .replace(/[`*~]/g, '') // keep underscores — identifiers like TAU_COMMIT must stay searchable
    .replace(/\s+/g, ' ')
    .trim();
}

const MD = { render: mdRender, renderInline, slugify, esc, toggleTaskInSource, countTasks, extractWikiLinks, mdToText, fmtSize, fileKind, parseEmbedUrl };

/* ============================================================================
   Store — state, persistence, history, search, diff, auth, roster.
   Documents live in localStorage (text, small); attachments live in
   IndexedDB (binary, potentially many MB) behind an in-memory map so the
   renderer stays synchronous. Production swaps this file for an API client
   with the same surface.
   ========================================================================== */

'use strict';

const LS_KEY = 'cupi-wiki-v2';
const SESSION_KEY = 'cupi-wiki-session';
const IDB_NAME = 'cupi-wiki-files';

const uid = (p) => p + '-' + Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);

const inviteCode = () => {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const four = () => Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join('');
  return `CUPI-${four()}-${four()}`;
};

/* ------------------------------- time ------------------------------------ */

function relTime(ts) {
  const d = Date.now() - ts;
  const m = Math.round(d / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + 'h ago';
  const days = Math.round(h / 24);
  if (days < 14) return days + 'd ago';
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: days > 300 ? 'numeric' : undefined });
}
const fmtDateTime = (ts) => new Date(ts).toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
const fmtDay = (ts) => {
  const d = new Date(ts), t = new Date();
  const today = d.toDateString() === t.toDateString();
  const yd = new Date(t - 864e5).toDateString() === d.toDateString();
  return today ? 'Today' : yd ? 'Yesterday' : d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
};

/* ------------------------------- diff ------------------------------------ */

// LCS line diff. Ops: 0 same, 1 add, -1 del.
function diffLines(a, b) {
  const A = String(a || '').split('\n'), B = String(b || '').split('\n');
  const n = A.length, m = B.length;
  if (n * m > 4000000) {
    // Degenerate fallback for huge docs: whole-body replace.
    return { ops: [...A.map((l) => [-1, l]), ...B.map((l) => [1, l])], add: m, del: n };
  }
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = [];
  let i = 0, j = 0, add = 0, del = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { ops.push([0, A[i]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push([-1, A[i]]); i++; del++; }
    else { ops.push([1, B[j]]); j++; add++; }
  }
  while (i < n) { ops.push([-1, A[i++]]); del++; }
  while (j < m) { ops.push([1, B[j++]]); add++; }
  return { ops, add, del };
}

/* ------------------------------- IndexedDB files ------------------------- */

const Files = {
  db: null,
  mem: new Map(),
  open() {
    return new Promise((res) => {
      const rq = indexedDB.open(IDB_NAME, 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('files', { keyPath: 'id' });
      rq.onsuccess = () => { Files.db = rq.result; res(); };
      rq.onerror = () => res(); // degrade to memory-only
    });
  },
  loadAll() {
    return new Promise((res) => {
      if (!Files.db) return res();
      const tx = Files.db.transaction('files').objectStore('files').getAll();
      tx.onsuccess = () => { (tx.result || []).forEach((f) => Files.mem.set(f.id, f)); res(); };
      tx.onerror = () => res();
    });
  },
  put(f, onFail) {
    Files.mem.set(f.id, f);
    if (!Files.db) { onFail && onFail(); return; }
    try {
      const rq = Files.db.transaction('files', 'readwrite').objectStore('files').put(f);
      rq.onerror = () => onFail && onFail();
    } catch (e) { onFail && onFail(); }
  },
  remove(id) {
    Files.mem.delete(id);
    if (Files.db) try { Files.db.transaction('files', 'readwrite').objectStore('files').delete(id); } catch (e) {}
  },
  get: (id) => Files.mem.get(id) || null,
  totalBytes: () => [...Files.mem.values()].reduce((s, f) => s + (f.size || 0), 0),
};

/* ------------------------------- store ----------------------------------- */

const Store = {
  s: null,
  onError: null,

  async boot() {
    await Files.open();
    await Files.loadAll();
    let raw = null;
    try { raw = localStorage.getItem(LS_KEY); } catch (e) {}
    if (raw) {
      try { Store.s = JSON.parse(raw); } catch (e) { Store.s = null; }
    }
    if (!Store.s || !Store.s.pages) Store.seed();
    if (Files.mem.size === 0) SEED_ATTACHMENTS.forEach((a) => Files.put(a));
    // Purge trash older than 30 days.
    const cut = Date.now() - 30 * 864e5;
    Store.s.trash = (Store.s.trash || []).filter((p) => p.deletedAt > cut);
    Store.reindex();
  },

  seed() {
    Store.s = {
      users: SEED_USERS.map((u) => ({ ...u })),
      pages: SEED_PAGES.map((p) => {
        const revs = (p.revs || []).map((r) => ({ ...r, body: r.body == null ? p.body : r.body }));
        if (!revs.length || revs[revs.length - 1].body !== p.body) {
          revs.push({ ts: p.updated, by: p.updatedBy, summary: revs.length ? 'Edited' : 'Created page', body: p.body });
        }
        return { ...p, revs };
      }),
      comments: SEED_COMMENTS.map((c) => ({ ...c })),
      activity: SEED_ACTIVITY.map((a) => ({ ...a })),
      trash: [],
      prefs: {},
    };
    Store.persist();
  },

  reset() {
    try { localStorage.removeItem(LS_KEY); localStorage.removeItem(SESSION_KEY); } catch (e) {}
    [...Files.mem.keys()].forEach((id) => Files.remove(id));
    SEED_ATTACHMENTS.forEach((a) => Files.put(a));
    Store.seed();
    Store.reindex();
  },

  lastPersistOk: true,
  _adopting: false, // true while rendering state adopted from another tab
  persist() {
    if (Store._adopting) return true; // never write back what another tab just wrote
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(Store.s));
      Store.lastPersistOk = true;
    } catch (e) {
      Store.lastPersistOk = false;
      Store.onError && Store.onError('Storage is full — this change is NOT saved. Trim the page or remove large content.');
    }
    return Store.lastPersistOk;
  },

  /* --------------------------- indexes ----------------------------------- */

  titleIndex: new Map(),  // lower title -> page
  linkIndex: new Map(),   // pageId -> Set(lower titles it links to)

  reindex() {
    Store.titleIndex.clear();
    Store.linkIndex.clear();
    for (const p of Store.s.pages) Store.titleIndex.set(p.title.toLowerCase(), p);
    for (const p of Store.s.pages) Store.linkIndex.set(p.id, new Set(MD.extractWikiLinks(p.body)));
  },

  pageByTitle: (t) => Store.titleIndex.get(String(t).toLowerCase()) || null,
  page: (id) => Store.s.pages.find((p) => p.id === id) || null,

  backlinks(pageId) {
    const p = Store.page(pageId);
    if (!p) return [];
    const key = p.title.toLowerCase();
    return Store.s.pages.filter((q) => q.id !== pageId && Store.linkIndex.get(q.id)?.has(key));
  },

  childrenOf: (id) => Store.s.pages.filter((p) => p.parent === id).sort((a, b) => a.order - b.order),
  inSection: (sec) => Store.s.pages.filter((p) => p.section === sec).sort((a, b) => a.order - b.order),

  /* --------------------------- auth -------------------------------------- */

  session() {
    try { return localStorage.getItem(SESSION_KEY) || null; } catch (e) { return null; }
  },
  me() {
    const email = Store.session();
    return email ? Store.s.users.find((u) => u.email === email && u.status === 'active') || null : null;
  },
  isAdmin: () => Store.me()?.role === 'admin',

  login(email) {
    const u = Store.s.users.find((x) => x.email === email);
    if (!u) return { ok: false, reason: 'not-listed' };
    if (u.status === 'invited') return { ok: false, reason: 'invited', user: u };
    try { localStorage.setItem(SESSION_KEY, email); } catch (e) {}
    return { ok: true, user: u };
  },

  redeem(code) {
    const c = String(code).trim().toUpperCase();
    const u = Store.s.users.find((x) => x.status === 'invited' && x.inviteCode === c);
    if (!u) return { ok: false };
    u.status = 'active';
    u.joined = Date.now();
    delete u.inviteCode;
    Store.log({ kind: 'join', by: u.email });
    try { localStorage.setItem(SESSION_KEY, u.email); } catch (e) {}
    Store.persist();
    return { ok: true, user: u };
  },

  logout() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} },

  /* --------------------------- pages ------------------------------------- */

  createPage({ title, section, parent, body, tags, summary }) {
    const me = Store.me();
    const slug = MD.slugify(title);
    // IDs must be unique across live pages AND trash, or a later restore forks the wiki.
    const taken = (id) => Store.page(id) || Store.s.trash.some((t) => t.id === id);
    const id = taken(slug) ? slug + '-' + uid('').slice(1, 5) : slug;
    const now = Date.now();
    const p = {
      id, title, section, parent: parent || null, tags: tags || [],
      owner: me.email, created: now, updated: now, updatedBy: me.email,
      order: Store.s.pages.length + 1,
      body: body || '',
      revs: [{ ts: now, by: me.email, summary: summary || 'Created page', body: body || '' }],
    };
    Store.s.pages.push(p);
    Store.log({ kind: 'create', by: me.email, pageId: id });
    Store.reindex();
    Store.persist();
    return p;
  },

  // Renames rewrite every inbound [[link]] so links survive — page titles are
  // the link namespace, and breaking them on rename is how wikis rot.
  rewriteLinks(oldTitle, newTitle) {
    const escRe = oldTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`\\[\\[\\s*${escRe}\\s*(?=[\\]#|])`, 'gi');
    for (const list of [Store.s.pages, Store.s.trash]) {
      for (const q of list) {
        if (re.test(q.body)) q.body = q.body.replace(re, '[[' + newTitle);
        re.lastIndex = 0;
      }
    }
  },

  savePage(id, { title, body, summary, section, tags }) {
    const p = Store.page(id);
    if (!p) return null;
    if (body !== undefined && body.length > 2 * 1024 * 1024) {
      Store.onError && Store.onError('That page is over the 2 MB text limit — attach big content as files instead.');
      return null;
    }
    const me = Store.me();
    const now = Date.now();
    const changedBody = body !== undefined && body !== p.body;
    const changedTitle = title !== undefined && title !== p.title;
    if (changedTitle) {
      Store.rewriteLinks(p.title, title);
      // The incoming editor body may carry self-links under the old title too.
      if (body !== undefined) {
        const escRe = p.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        body = body.replace(new RegExp(`\\[\\[\\s*${escRe}\\s*(?=[\\]#|])`, 'gi'), '[[' + title);
      }
    }
    if (title !== undefined) p.title = title;
    if (section !== undefined) p.section = section;
    if (tags !== undefined) p.tags = tags;
    if (body !== undefined) p.body = body;
    if (changedBody || changedTitle) {
      p.updated = now;
      p.updatedBy = me.email;
      p.revs.push({ ts: now, by: me.email, summary: summary || (changedTitle && !changedBody ? 'Renamed' : 'Edited'), body: p.body });
      if (p.revs.length > 80) p.revs.splice(0, p.revs.length - 80);
      Store.log({ kind: 'edit', by: me.email, pageId: id, summary: summary || '' });
    }
    Store.reindex();
    Store.persist();
    return p;
  },

  toggleTask(pageId, n) {
    const p = Store.page(pageId);
    if (!p) return;
    p.body = MD.toggleTaskInSource(p.body, n);
    p.updated = Date.now();
    p.updatedBy = Store.me().email;
    // Checkbox flips are lightweight — fold into the last rev if it was also
    // a checkbox flip by the same person within 10 minutes; else new rev.
    const last = p.revs[p.revs.length - 1];
    if (last && last.summary === 'Checked items' && last.by === p.updatedBy && Date.now() - last.ts < 600000) {
      last.body = p.body; last.ts = Date.now();
    } else {
      p.revs.push({ ts: Date.now(), by: p.updatedBy, summary: 'Checked items', body: p.body });
    }
    Store.persist();
  },

  restoreRev(pageId, revIdx) {
    const p = Store.page(pageId);
    const rev = p?.revs[revIdx];
    if (!rev) return;
    const me = Store.me();
    p.body = rev.body;
    p.updated = Date.now();
    p.updatedBy = me.email;
    p.revs.push({ ts: Date.now(), by: me.email, summary: `Restored version from ${fmtDateTime(rev.ts)}`, body: rev.body });
    Store.log({ kind: 'restore', by: me.email, pageId });
    Store.reindex();
    Store.persist();
  },

  deletePage(id) {
    const idx = Store.s.pages.findIndex((p) => p.id === id);
    if (idx < 0) return;
    const [p] = Store.s.pages.splice(idx, 1);
    // Orphan children up a level rather than cascading the delete.
    Store.s.pages.forEach((q) => { if (q.parent === id) q.parent = null; });
    p.deletedAt = Date.now();
    p.deletedBy = Store.me().email;
    Store.s.trash.push(p);
    Store.log({ kind: 'delete', by: p.deletedBy, title: p.title });
    Store.reindex();
    Store.persist();
    return p;
  },

  restorePage(id) {
    const idx = Store.s.trash.findIndex((p) => p.id === id);
    if (idx < 0) return;
    const [p] = Store.s.trash.splice(idx, 1);
    delete p.deletedAt; delete p.deletedBy;
    // If the id or title was reused while this sat in Trash, the restored copy
    // gets a fresh identity instead of silently forking the live page.
    if (Store.page(p.id)) p.id = p.id + '-' + uid('').slice(1, 5);
    while (Store.pageByTitle(p.title)) p.title = p.title + ' (restored)';
    Store.s.pages.push(p);
    Store.log({ kind: 'restore', by: Store.me().email, pageId: p.id });
    Store.reindex();
    Store.persist();
    return p;
  },

  purgePage(id) {
    const idx = Store.s.trash.findIndex((p) => p.id === id);
    if (idx >= 0) Store.s.trash.splice(idx, 1);
    Store.sweepAttachments();
    Store.persist();
  },

  /* --------------------------- comments ---------------------------------- */

  // @first-name or @netid in a comment notifies that member's inbox.
  mentionsIn(text) {
    const out = new Set();
    for (const m of String(text).matchAll(/@([a-z0-9.]+)/gi)) {
      const tok = m[1].toLowerCase();
      const u = Store.s.users.find((x) =>
        x.email.split('@')[0] === tok || x.name.split(/\s+/)[0].toLowerCase() === tok);
      if (u) out.add(u.email);
    }
    return [...out];
  },

  addComment(pageId, text) {
    const me = Store.me();
    const c = { id: uid('c'), pageId, by: me.email, ts: Date.now(), text };
    Store.s.comments.push(c);
    Store.log({ kind: 'comment', by: me.email, pageId });
    for (const email of Store.mentionsIn(text)) {
      if (email !== me.email) Store.log({ kind: 'mention', by: me.email, who: email, pageId });
    }
    Store.persist();
    return c;
  },
  deleteComment(id) {
    const i = Store.s.comments.findIndex((c) => c.id === id);
    if (i >= 0) Store.s.comments.splice(i, 1);
    Store.persist();
  },
  comments: (pageId) => Store.s.comments.filter((c) => c.pageId === pageId).sort((a, b) => a.ts - b.ts),

  /* --------------------------- roster ------------------------------------ */

  user: (email) => Store.s.users.find((u) => u.email === email) || null,
  userName(email) { return Store.user(email)?.name || email; },
  initials(email) {
    const n = Store.userName(email);
    return n.split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
  },

  addMembers(emails, role) {
    const me = Store.me();
    const results = [];
    for (const raw of emails) {
      const email = raw.trim().toLowerCase();
      if (!email) continue;
      if (!/^[a-z0-9._%+-]+@cornell\.edu$/.test(email)) { results.push({ email, ok: false, reason: 'Not a cornell.edu address' }); continue; }
      if (Store.user(email)) { results.push({ email, ok: false, reason: 'Already on the roster' }); continue; }
      const u = {
        email, name: email.split('@')[0], role: role || 'member', status: 'invited',
        subteam: '', joined: null, invitedAt: Date.now(), invitedBy: me.email, inviteCode: inviteCode(),
      };
      Store.s.users.push(u);
      Store.log({ kind: 'invite', by: me.email, who: email });
      results.push({ email, ok: true, user: u });
    }
    Store.persist();
    return results;
  },

  resendInvite(email) {
    const u = Store.user(email);
    if (u && u.status === 'invited') {
      u.inviteCode = inviteCode();
      u.invitedAt = Date.now();
      Store.log({ kind: 'invite-resend', by: Store.me().email, who: email });
      Store.persist();
    }
    return u;
  },

  revokeInvite(email) {
    const i = Store.s.users.findIndex((u) => u.email === email && u.status === 'invited');
    if (i >= 0) {
      Store.s.users.splice(i, 1);
      Store.log({ kind: 'invite-revoke', by: Store.me().email, who: email });
      Store.persist();
    }
  },

  setRole(email, role) {
    const u = Store.user(email);
    if (u) { u.role = role; Store.log({ kind: 'role', by: Store.me().email, who: email, role }); Store.persist(); }
  },

  removeUser(email) {
    const i = Store.s.users.findIndex((u) => u.email === email);
    if (i >= 0) {
      Store.s.users.splice(i, 1);
      Store.log({ kind: 'remove', by: Store.me().email, who: email });
      Store.persist();
    }
  },

  /* --------------------------- activity ---------------------------------- */

  log(entry) { Store.s.activity.unshift({ ts: Date.now(), ...entry }); Store.s.activity.splice(400); },
  activity: () => [...Store.s.activity].sort((a, b) => b.ts - a.ts),

  /* --------------------------- prefs (per user) --------------------------- */

  prefs() {
    const email = Store.session() || '_';
    const p = Store.s.prefs[email] || (Store.s.prefs[email] = {});
    if (!Array.isArray(p.starred)) p.starred = [];
    if (!Array.isArray(p.recents)) p.recents = [];
    if (!Array.isArray(p.collapsed)) p.collapsed = [];
    if (!p.editorMode) p.editorMode = 'split';
    return p;
  },
  toggleStar(id) {
    const p = Store.prefs();
    const i = p.starred.indexOf(id);
    if (i >= 0) p.starred.splice(i, 1); else p.starred.unshift(id);
    Store.persist();
    return i < 0;
  },
  touchRecent(id) {
    const p = Store.prefs();
    if (p.recents[0] === id) return; // re-render of the same page: nothing to write
    const i = p.recents.indexOf(id);
    if (i >= 0) p.recents.splice(i, 1);
    p.recents.unshift(id);
    p.recents.splice(8);
    Store.persist();
  },

  /* --------------------------- attachments ------------------------------- */

  att: (id) => Files.get(id),
  attTotal: () => Files.totalBytes(),

  async addAttachment(file) {
    if (file.size > 25 * 1048576) throw new Error('File is over the 25 MB preview cap.');
    const dataUri = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(new Error('Could not read file'));
      r.readAsDataURL(file);
    });
    const a = { id: uid('att'), name: file.name, type: file.type || 'application/octet-stream', size: file.size, dataUri, by: Store.me().email, ts: Date.now() };
    Files.put(a, () => Store.onError && Store.onError(`${file.name} could not be stored durably — it will vanish on reload.`));
    return a;
  },

  // Drop attachments nothing references any more (run after purges).
  sweepAttachments() {
    const referenced = new Set();
    for (const list of [Store.s.pages, Store.s.trash]) {
      for (const p of list) {
        for (const m of p.body.matchAll(/att:([A-Za-z0-9-]+)/g)) referenced.add(m[1]);
        for (const rev of p.revs || []) for (const m of String(rev.body).matchAll(/att:([A-Za-z0-9-]+)/g)) referenced.add(m[1]);
      }
    }
    for (const id of [...Files.mem.keys()]) if (!referenced.has(id)) Files.remove(id);
  },

  /* --------------------------- search ------------------------------------ */

  search(q) {
    const query = q.trim().toLowerCase();
    if (!query) return [];
    const terms = query.split(/\s+/).filter(Boolean);
    const out = [];
    for (const p of Store.s.pages) {
      const title = p.title.toLowerCase();
      const commentText = Store.s.comments.filter((c) => c.pageId === p.id).map((c) => c.text).join(' ');
      const text = (MD.mdToText(p.body) + ' ' + commentText).toLowerCase();
      let score = 0;
      let allHit = true;
      for (const t of terms) {
        let hit = 0;
        if (title === t) hit += 120;
        else if (title.startsWith(t)) hit += 60;
        else if (title.includes(t)) hit += 40;
        const n = text.split(t).length - 1;
        if (n) hit += Math.min(24, 8 + n * 2);
        if (!hit) { allHit = false; break; }
        score += hit;
      }
      if (!allHit || !score) continue;
      // Snippet centered on the first body hit.
      const raw = MD.mdToText(p.body);
      const pos = raw.toLowerCase().indexOf(terms[0]);
      let snip = '';
      if (pos >= 0) {
        const start = Math.max(0, pos - 44);
        snip = (start > 0 ? '…' : '') + raw.slice(start, pos + 96) + '…';
      } else snip = raw.slice(0, 120);
      out.push({ page: p, score, snip });
    }
    return out.sort((a, b) => b.score - a.score).slice(0, 12);
  },

  // Subsequence fuzzy for the quick switcher (empty query → recents).
  quick(q) {
    const query = q.trim().toLowerCase();
    if (!query) {
      return Store.prefs().recents.map((id) => Store.page(id)).filter(Boolean).map((p) => ({ page: p, score: 0 }));
    }
    const out = [];
    for (const p of Store.s.pages) {
      const t = p.title.toLowerCase();
      let qi = 0, run = 0, score = 0;
      for (let i = 0; i < t.length && qi < query.length; i++) {
        if (t[i] === query[qi]) { qi++; run++; score += 2 + run; }
        else run = 0;
      }
      if (qi === query.length) out.push({ page: p, score: score + (t.startsWith(query) ? 40 : 0) });
    }
    return out.sort((a, b) => b.score - a.score).slice(0, 8);
  },
};

/* ------------------------------- router ---------------------------------- */

function parseHash() {
  let h = location.hash.replace(/^#\/?/, '');
  // "#/page/leg-design#test-results" → route to the page, remember the anchor.
  let anchor = null;
  const ai = h.indexOf('#');
  if (ai >= 0) { anchor = h.slice(ai + 1); h = h.slice(0, ai); }
  const [path, qs] = h.split('?');
  const seg = path.split('/').filter(Boolean);
  const params = {};
  if (qs) for (const kv of qs.split('&')) { const [k, v] = kv.split('='); params[k] = decodeURIComponent(v || ''); }
  if (anchor) params.anchor = anchor;
  return { seg, params };
}

function nav(hash) { location.hash = hash; }

function route() {
  const { seg, params } = parseHash();
  const me = Store.me();
  const name = seg[0] || (me ? 'page' : 'login');
  if (!me && !['login', 'denied'].includes(name)) { UI.route = { name: 'login', params: {} }; return; }
  if (me && name === 'login') { UI.route = { name: 'page', params: { id: 'welcome' } }; return; }
  // The formatting guide is a real (searchable, editable) page now; keep old links working.
  if (name === 'guide') { UI.route = { name: 'page', params: { id: 'formatting-guide' } }; return; }
  UI.route = { name, params: { id: seg[1], ...params } };
}

/* ------------------------------- 3D viewer ------------------------------- */

function parseSTL(buf) {
  if (buf.byteLength < 15) return null; // smaller than the smallest legal ASCII STL
  const dv = new DataView(buf);
  const head = new TextDecoder().decode(new Uint8Array(buf, 0, Math.min(80, buf.byteLength))).trim();
  // Binary detection tolerates trailing padding, and wins even when the 80-byte
  // header starts with "solid" (SolidWorks exports do this).
  let isBinary = false;
  if (buf.byteLength >= 84) {
    const n = dv.getUint32(80, true);
    if (n > 0 && buf.byteLength >= 84 + n * 50 && buf.byteLength < 84 + n * 50 + 512) isBinary = true;
  }
  const verts = [];
  if (!isBinary) {
    if (!head.startsWith('solid')) return null;
    const txt = new TextDecoder().decode(buf);
    const re = /vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g;
    let m;
    while ((m = re.exec(txt))) verts.push(+m[1], +m[2], +m[3]);
  } else {
    const n = dv.getUint32(80, true);
    let o = 84;
    for (let i = 0; i < n && o + 50 <= buf.byteLength; i++, o += 50) {
      for (let v = 0; v < 3; v++) {
        verts.push(dv.getFloat32(o + 12 + v * 12, true), dv.getFloat32(o + 16 + v * 12, true), dv.getFloat32(o + 20 + v * 12, true));
      }
    }
  }
  if (!verts.length || verts.some((v) => !isFinite(v))) return null;
  return new Float32Array(verts);
}

function parseOBJ(text) {
  const vs = [], out = [];
  for (const line of text.split('\n')) {
    const t = line.trim().split(/\s+/);
    if (t[0] === 'v') vs.push([+t[1], +t[2], +t[3]]);
    else if (t[0] === 'f') {
      const idx = t.slice(1).map((s) => { let i = parseInt(s.split('/')[0], 10); return i < 0 ? vs.length + i : i - 1; });
      if (idx.some((j) => !vs[j])) continue; // skip faces with out-of-range indices
      for (let k = 1; k + 1 < idx.length; k++) {
        for (const j of [idx[0], idx[k], idx[k + 1]]) { const v = vs[j]; out.push(v[0], v[1], v[2]); }
      }
    }
  }
  if (!out.length || out.some((v) => !isFinite(v))) return null;
  return new Float32Array(out);
}

async function mountCadViewer(host) {
  const att = Store.att(host.dataset.att);
  const canvas = $('canvas', host);
  if (!att || !canvas) return;
  let buffer;
  if (att.dataUri) {
    const b64 = att.dataUri.slice(att.dataUri.indexOf(',') + 1);
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    buffer = bytes.buffer;
  } else if (att.url) {
    try { buffer = await (await fetch(att.url)).arrayBuffer(); } catch (e) { return; }
    if (!canvas.isConnected) return; // page changed while fetching
  } else return;
  let verts = null;
  try { verts = /\.obj$/i.test(att.name) ? parseOBJ(new TextDecoder().decode(buffer)) : parseSTL(buffer); } catch (e) { verts = null; }
  if (!verts) { host.querySelector('.cad-embed__stage').innerHTML = `<div class="empty" style="padding:24px"><b>Couldn't read this model</b><p>${MD.esc(att.name)} doesn't parse as ${/\.obj$/i.test(att.name) ? 'OBJ' : 'STL'} — re-export it and re-attach.</p></div>`; return; }

  // Center + scale.
  let min = [1e9, 1e9, 1e9], max = [-1e9, -1e9, -1e9];
  for (let i = 0; i < verts.length; i += 3)
    for (let a = 0; a < 3; a++) { min[a] = Math.min(min[a], verts[i + a]); max[a] = Math.max(max[a], verts[i + a]); }
  const c = [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2];
  const span = Math.max(max[0] - min[0], max[1] - min[1], max[2] - min[2]) || 1;

  const nTri = verts.length / 9;
  const state = { rx: -1.05, rz: 0.7, zoom: 1, spin: true, drag: null };
  const ink = () => getComputedStyle(document.body).color;

  function draw() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = host.clientWidth, hpx = 300;
    if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = hpx * dpr; canvas.style.height = hpx + 'px'; }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, hpx);
    const s = (Math.min(w, hpx) / span) * 0.62 * state.zoom;
    const cx = w / 2, cy = hpx / 2;
    const cosZ = Math.cos(state.rz), sinZ = Math.sin(state.rz), cosX = Math.cos(state.rx), sinX = Math.sin(state.rx);
    const tris = [];
    for (let i = 0; i < verts.length; i += 9) {
      const pts = [];
      let depth = 0;
      for (let v = 0; v < 3; v++) {
        let x = verts[i + v * 3] - c[0], y = verts[i + v * 3 + 1] - c[1], z = verts[i + v * 3 + 2] - c[2];
        let x1 = x * cosZ - y * sinZ, y1 = x * sinZ + y * cosZ;
        let y2 = y1 * cosX - z * sinX, z2 = y1 * sinX + z * cosX;
        depth += z2;
        pts.push([cx + x1 * s, cy - y2 * s, z2]);
      }
      const ux = pts[1][0] - pts[0][0], uy = pts[1][1] - pts[0][1];
      const vx = pts[2][0] - pts[0][0], vy = pts[2][1] - pts[0][1];
      const nz = ux * vy - uy * vx;
      if (nz >= 0) continue; // backface (screen y is flipped)
      // World normal for lighting.
      const e1 = [verts[i + 3] - verts[i], verts[i + 4] - verts[i + 1], verts[i + 5] - verts[i + 2]];
      const e2 = [verts[i + 6] - verts[i], verts[i + 7] - verts[i + 1], verts[i + 8] - verts[i + 2]];
      let nx = e1[1] * e2[2] - e1[2] * e2[1], ny = e1[2] * e2[0] - e1[0] * e2[2], nzw = e1[0] * e2[1] - e1[1] * e2[0];
      const l = Math.hypot(nx, ny, nzw) || 1;
      // Rotate normal like the verts (z-rot then x-rot) and light from camera-ish.
      let rnx = (nx / l) * cosZ - (ny / l) * sinZ, rny = (nx / l) * sinZ + (ny / l) * cosZ;
      let rny2 = rny * cosX - (nzw / l) * sinX, rnz = rny * sinX + (nzw / l) * cosX;
      const lam = Math.max(0, rnz * 0.85 + rny2 * -0.25 + rnx * 0.2);
      tris.push({ pts, depth: depth / 3, lam });
    }
    tris.sort((a, b) => a.depth - b.depth);
    const dark = document.body.dataset.viewerDark === '1';
    for (const t of tris) {
      const g = dark ? 40 + t.lam * 150 : 235 - t.lam * 150;
      ctx.beginPath();
      ctx.moveTo(t.pts[0][0], t.pts[0][1]);
      ctx.lineTo(t.pts[1][0], t.pts[1][1]);
      ctx.lineTo(t.pts[2][0], t.pts[2][1]);
      ctx.closePath();
      ctx.fillStyle = `rgb(${g | 0},${g | 0},${g | 0})`;
      ctx.fill();
      if (nTri < 4000) { ctx.strokeStyle = dark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.05)'; ctx.stroke(); }
    }
  }

  let raf;
  function loop() {
    if (state.spin) { state.rz += 0.004; draw(); }
    raf = requestAnimationFrame(loop);
  }
  canvas.addEventListener('pointerdown', (e) => {
    state.spin = false; state.drag = { x: e.clientX, y: e.clientY, rx: state.rx, rz: state.rz };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!state.drag) return;
    state.rz = state.drag.rz + (e.clientX - state.drag.x) * 0.011;
    state.rx = state.drag.rx + (e.clientY - state.drag.y) * 0.011;
    draw();
  });
  canvas.addEventListener('pointerup', () => { state.drag = null; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    state.zoom = Math.min(6, Math.max(0.3, state.zoom * (e.deltaY < 0 ? 1.09 : 0.92)));
    draw();
  }, { passive: false });
  draw();
  loop();
  cadCleanups.push(() => cancelAnimationFrame(raf));
}

function edUpdatePreview() {
  const e = UI.editor;
  const host = $('[data-ed-preview]');
  if (!host) return;
  // Every remount would otherwise orphan the previous viewers' spin loops —
  // in the editor, all mounted viewers belong to this preview, so flush them.
  cadCleanups.forEach((fn) => fn());
  cadCleanups = [];
  const { html } = MD.render(e.body, mdCtx({ readonly: true }));
  host.innerHTML = (e.title ? `<h1 style="font-size:28px;font-weight:400;margin:0 0 18px">${MD.esc(e.title)}</h1>` : '') + html;
  $$('.cad-embed', host).forEach(mountCadViewer);
}

function edInsert(before, after, placeholder) {
  const ta = $('[data-ed="body"]');
  if (!ta) return;
  const { selectionStart: s, selectionEnd: epos, value } = ta;
  const sel = value.slice(s, epos) || placeholder || '';
  const insert = before + sel + (after || '');
  ta.setRangeText(insert, s, epos, 'end');
  if (!value.slice(s, epos) && placeholder) ta.setSelectionRange(s + before.length, s + before.length + placeholder.length);
  ta.focus();
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

async function edHandleFiles(files) {
  for (const f of files) {
    try {
      const att = await Store.addAttachment(f);
      if (/^image\//.test(att.type)) edInsert(`\n![${f.name.replace(/\.[^.]+$/, '')}](att:${att.id} "")\n`, '', '');
      else edInsert(`\n!file[${f.name.replace(/\.[^.]+$/, '')}](att:${att.id})\n`, '', '');
      toast(`Attached ${f.name} (${MD.fmtSize(att.size)})`);
    } catch (err) { toast(err.message || 'Upload failed'); }
  }
}

// [[ autocomplete while typing.
function edAutocomplete(ta) {
  const pop = $('.ed-autocomplete');
  if (!pop) return;
  const upto = ta.value.slice(0, ta.selectionStart);
  const m = upto.match(/\[\[([^\][\n]*)$/);
  if (!m) { pop.hidden = true; return; }
  const q = m[1].toLowerCase();
  const hits = Store.s.pages.filter((p) => p.title.toLowerCase().includes(q)).slice(0, 6);
  if (!hits.length) { pop.hidden = true; return; }
  pop.innerHTML = hits.map((p, i) => `<button data-action="ed-ac" data-title="${MD.esc(p.title)}" class="${i === 0 ? 'sel' : ''}">${I.page} ${MD.esc(p.title)}</button>`).join('');
  // Anchor near the caret's line, not the top of the textarea.
  const r = ta.getBoundingClientRect();
  const lineHeight = 21.6; // 13.5px * 1.6, matching the editor face
  const caretLine = upto.split('\n').length;
  const padTop = 26;
  const caretY = r.top + padTop + caretLine * lineHeight - ta.scrollTop;
  pop.style.left = Math.min(r.left + 40, innerWidth - 260) + 'px';
  pop.style.top = Math.max(60, Math.min(caretY + 6, innerHeight - 230)) + 'px';
  pop.hidden = false;
}

function edAcceptAc(title) {
  const ta = $('[data-ed="body"]');
  const upto = ta.value.slice(0, ta.selectionStart);
  const m = upto.match(/\[\[([^\][\n]*)$/);
  if (!m) return;
  const start = ta.selectionStart - m[1].length;
  ta.setRangeText(title + ']]', start, ta.selectionEnd, 'end');
  $('.ed-autocomplete').hidden = true;
  ta.focus();
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

function edSave() {
  const e = UI.editor;
  if (!e.title.trim()) { toast('Give the page a title first.'); $('[data-ed="title"]')?.focus(); return; }
  const clash = Store.pageByTitle(e.title.trim());
  if (clash && clash.id !== e.pageId) { toast(`A page called “${e.title.trim()}” already exists.`); return; }
  UI.modal = { kind: 'save-summary' };
  render();
}

function edCommit(summary) {
  const e = UI.editor;
  // Someone else (or another tab) may have changed the page while this editor
  // was open — never overwrite silently.
  if (!e.isNew && !e.staleOverride) {
    const cur = Store.page(e.pageId);
    if (cur && cur.body !== e.origBody) {
      UI.modal = {
        kind: 'confirm', title: 'This page changed while you edited',
        text: `<b>${MD.esc(Store.userName(cur.updatedBy))}</b> saved a newer version ${relTime(cur.updated)}. Saving now replaces their text with yours (their version stays in History). Consider copying your changes out first.`,
        confirm: 'Save mine anyway', danger: true,
      };
      UI.modal.onGo = () => { UI.editor.staleOverride = true; edCommit(summary); };
      render();
      return;
    }
  }
  let p;
  if (e.isNew) {
    p = Store.createPage({ title: e.title.trim(), section: e.section, parent: e.parent, body: e.body, summary });
  } else if (!Store.page(e.pageId)) {
    // The page was trashed by someone else while this editor was open —
    // the work is saved as a fresh page instead of vanishing.
    p = Store.createPage({ title: e.title.trim(), section: e.section, body: e.body, summary });
    toast('The original was deleted while you edited — saved as a new page');
  } else {
    p = Store.savePage(e.pageId, { title: e.title.trim(), body: e.body, section: e.section, summary });
  }
  if (!p) { UI.modal = null; render(); return; } // savePage refused (e.g. size cap) and already toasted
  toast(Store.lastPersistOk ? (e.isNew ? 'Page created' : 'Saved') : 'NOT saved — storage is full');
  draftStash.delete(e.pageId || 'new');
  persistDrafts();
  UI.editor = null;
  UI.modal = null;
  // nav() alone is not enough: when editing an existing page the hash is
  // already #/page/<id>, so no hashchange fires — render explicitly.
  nav('#/page/' + p.id);
  route();
  render();
}

/* ------------------------------- history --------------------------------- */

function viewHistory(id) {
  const p = Store.page(id);
  if (!p) return viewMissing(id);
  const selIdx = UI.route.params.rev !== undefined ? +UI.route.params.rev : p.revs.length - 1;
  const rev = p.revs[selIdx];
  const prev = p.revs[selIdx - 1];
  const d = diffLines(prev ? prev.body : '', rev ? rev.body : '');
  // Collapse long unchanged runs.
  let rows = '', run = [];
  const flushRun = () => {
    if (run.length > 8) {
      rows += run.slice(0, 3).join('');
      rows += `<div class="diff__line diff__line--skip">⋯ ${run.length - 6} unchanged lines ⋯</div>`;
      rows += run.slice(-3).join('');
    } else rows += run.join('');
    run = [];
  };
  for (const [op, line] of d.ops) {
    const h = `<div class="diff__line ${op === 1 ? 'diff__line--add' : op === -1 ? 'diff__line--del' : ''}"><span class="diff__gut">${op === 1 ? '+' : op === -1 ? '−' : ''}</span><span class="diff__txt">${MD.esc(line) || '&nbsp;'}</span></div>`;
    if (op === 0) run.push(h); else { flushRun(); rows += h; }
  }
  flushRun();

  return topbar(
    `<a href="#/page/${id}">${MD.esc(p.title)}</a><span class="crumbs__sep">/</span><span class="crumbs__here">History</span>`,
    selIdx < p.revs.length - 1 ? `<button class="btn" data-action="rev-restore" data-id="${id}" data-rev="${selIdx}">Restore this version</button>` : ''
  ) + `
  <div class="content"><div class="page-wrap"><div class="page-col" style="max-width:860px">
    <div class="plain-head"><span class="eyebrow">Page history</span><h1>${MD.esc(p.title)}</h1>
    <p>${p.revs.length} revisions. Select one to see what changed; anything can be restored.</p></div>
    <div class="history">
      ${p.revs.map((r, i) => {
        const pd = diffLines(p.revs[i - 1] ? p.revs[i - 1].body : '', r.body);
        return `<a class="rev ${i === p.revs.length - 1 ? 'rev--current' : ''}" href="#/history/${id}?rev=${i}" style="${i === selIdx ? 'background:var(--hover)' : ''};text-decoration:none;color:inherit">
        <span class="avatar">${Store.initials(r.by)}</span>
        <span class="rev__meta"><span class="rev__summary">${MD.esc(r.summary || 'Edited')}</span>
        <span class="rev__when">${MD.esc(Store.userName(r.by))} · ${fmtDateTime(r.ts)}</span></span>
        <span class="rev__stats"><span class="add">+${pd.add}</span><span class="del">−${pd.del}</span></span>
      </a>`;
      }).reverse().join('')}
    </div>
    <div class="plain-head" style="margin-top:28px"><span class="eyebrow">Changes in selected revision</span></div>
    <div class="diff">${rows || '<div class="diff__line"><span class="diff__gut"></span><span class="diff__txt" style="color:var(--faint)">No text changes.</span></div>'}</div>
  </div></div></div>`;
}

/* ------------------------------- activity -------------------------------- */

function activityLine(a) {
  const who = `<b>${MD.esc(Store.userName(a.by))}</b>`;
  const pg = a.pageId && (Store.page(a.pageId) || Store.s.trash.find((p) => p.id === a.pageId));
  const pageRef = pg ? `<b>${MD.esc(pg.title)}</b>` : a.title ? `<b>${MD.esc(a.title)}</b>` : 'a page';
  const map = {
    edit: `${who} edited ${pageRef}${a.summary ? ` — ${MD.esc(a.summary)}` : ''}`,
    create: `${who} created ${pageRef}`,
    comment: `${who} commented on ${pageRef}`,
    delete: `${who} moved ${pageRef} to Trash`,
    restore: `${who} restored ${pageRef}`,
    invite: `${who} invited <b>${MD.esc(a.who || '')}</b>`,
    'invite-resend': `${who} re-sent the invite for <b>${MD.esc(a.who || '')}</b>`,
    'invite-revoke': `${who} revoked the invite for <b>${MD.esc(a.who || '')}</b>`,
    mention: `${who} mentioned <b>${MD.esc(Store.userName(a.who || ''))}</b> in a comment on ${pageRef}`,
    join: `<b>${MD.esc(Store.userName(a.by))}</b> joined the wiki`,
    role: `${who} made <b>${MD.esc(a.who || '')}</b> ${a.role === 'admin' ? 'an admin' : 'a member'}`,
    remove: `${who} removed <b>${MD.esc(a.who || '')}</b> from the roster`,
  };
  return map[a.kind] || `${who} did something`;
}

function viewActivity() {
  const acts = Store.activity();
  const groups = [];
  for (const a of acts) {
    const day = fmtDay(a.ts);
    if (!groups.length || groups[groups.length - 1].day !== day) groups.push({ day, items: [] });
    groups[groups.length - 1].items.push(a);
  }
  return topbar(`<a href="#/page/welcome">Wiki</a><span class="crumbs__sep">/</span><span class="crumbs__here">Activity</span>`) + `
  <div class="content"><div class="page-wrap"><div class="page-col">
    <div class="plain-head"><span class="eyebrow">Everything, newest first</span><h1>Activity</h1></div>
    <div class="feed">
      ${groups.map((g) => `<div class="feed__day"><span class="eyebrow">${g.day}</span>
        ${g.items.map((a) => {
          const pg = a.pageId && Store.page(a.pageId);
          return `<a class="feed__row" ${pg ? `href="#/page/${a.pageId}"` : ''}>
          <span class="avatar">${Store.initials(a.by)}</span>
          <span class="feed__what">${activityLine(a)}</span>
          <span class="feed__when">${relTime(a.ts)}</span></a>`;
        }).join('')}
      </div>`).join('')}
    </div>
  </div></div></div>`;
}

/* ------------------------------- palette --------------------------------- */

function openPalette() {
  UI.palette = { q: '', sel: 0 };
  render();
  $('.palette input')?.focus();
}

function paletteResults() {
  const q = UI.palette.q;
  if (!q.trim()) {
    const recents = Store.quick('');
    return { kind: 'recents', items: recents };
  }
  const exact = Store.search(q);
  if (exact.length) return { kind: 'search', items: exact };
  // Typo forgiveness: fall back to fuzzy title matches ("hexpod" → Hexapod).
  return { kind: 'fuzzy', items: Store.quick(q) };
}

function paletteListHtml() {
  const { kind, items } = paletteResults();
  const q = UI.palette.q.trim().toLowerCase();
  const mark = (text) => {
    if (!q) return MD.esc(text);
    const i = text.toLowerCase().indexOf(q.split(/\s+/)[0]);
    if (i < 0) return MD.esc(text);
    const t0 = q.split(/\s+/)[0];
    return MD.esc(text.slice(0, i)) + '<mark>' + MD.esc(text.slice(i, i + t0.length)) + '</mark>' + MD.esc(text.slice(i + t0.length));
  };
  UI.palette.count = items.length;
  return `${items.length ? `<div class="palette__group eyebrow">${kind === 'recents' ? 'Recent' : kind === 'fuzzy' ? 'Closest matches' : 'Results'}</div>` : ''}
    ${items.map((r, i) => `<button class="palette__item ${i === UI.palette.sel ? 'sel' : ''}" data-action="palette-go" data-id="${r.page.id}">
      ${I.page}<span style="min-width:0"><span class="palette__title">${mark(r.page.title)}</span>
      ${r.snip ? `<br><span class="palette__snip">${mark(r.snip)}</span>` : ''}</span>
      <span class="palette__where">${SECTIONS.find((s) => s.id === r.page.section)?.name || ''}</span>
    </button>`).join('')}
    ${!items.length && q ? `<div class="palette__empty">Nothing matches “${MD.esc(UI.palette.q)}”.<br><button class="btn btn--sm" style="margin-top:10px" data-action="palette-create">${I.plus} Create “${MD.esc(UI.palette.q)}”</button></div>` : ''}`;
}

function viewPalette() {

    </div>`;

    const u = Store.user(m.email);
    inner = `<div class="modal modal--wide" role="dialog" aria-label="Invite email">
      <div class="modal__head"><h3>Invite email — sent</h3><button class="icon-btn" data-action="modal-close" aria-label="Close">${I.x}</button></div>
      <div class="modal__body">
        ${u ? inviteEmailHtml(u) : ''}
        <p class="admin-block__sub" style="margin:0">In this preview the email is simulated. Production sends it automatically the moment you add the address.</p>

      <div class="modal__foot"><button class="btn" data-action="copy-code" data-code="${u?.inviteCode || ''}">${I.copy} Copy code</button><button class="btn btn--primary" data-action="modal-close">Done</button></div>

/* ------------------------------- render ---------------------------------- */

function render() {
  cadCleanups.forEach((fn) => fn());
  cadCleanups = [];
  window.__closeMenu?.();
  killPreview(); // a hover preview must not outlive the page it points into
  const app = $('#app');
  const me = Store.me();
  let view = '';
  const r = UI.route;

  // Re-renders of the same route (checkbox ticks, comments, stars) must not
  // throw the reader back to the top of the page.
  const prevSidebar = $('.sidebar__scroll');
  const sidebarScroll = prevSidebar ? prevSidebar.scrollTop : 0;
  const prevContent = $('.content');
  const keepScroll = prevContent && UI._lastRouteKey === r.name + '/' + (r.params.id || '');
  const scrollTop = keepScroll ? prevContent.scrollTop : 0;
  UI._lastRouteKey = r.name + '/' + (r.params.id || '');

  if (!me) {
    app.innerHTML = viewLogin();
    return;
  }
  if (UI.editor) view = viewEditor();
  else if (r.name === 'page') view = viewPage(r.params.id || 'welcome');
  else if (r.name === 'section') view = viewSection(r.params.id);
  else if (r.name === 'history') view = viewHistory(r.params.id);
  else if (r.name === 'activity') view = viewActivity();
  else if (r.name === 'admin') view = viewAdmin();
  else if (r.name === 'trash') view = viewTrash();
  else if (r.name === 'inbox') view = viewInbox();
  else if (r.name === 'health') view = viewHealth();
  else if (r.name === 'new') { openEditor(null, true, { title: r.params.title || '', section: r.params.section || 'projects' }); view = viewEditor(); }
  else view = viewPage('welcome');

  app.innerHTML = `<div class="shell ${UI.navOpen ? 'nav-open' : ''} ${UI.navHidden ? 'nav-hidden' : ''}">
    ${viewSidebar()}
    <main class="main">${view}</main>
    <div class="shell__scrim" data-action="nav-close"></div>
  </div>${viewPalette()}${viewModal()}`;

  if (keepScroll) { const c = $('.content'); if (c) c.scrollTop = scrollTop; }
  { const sb = $('.sidebar__scroll'); if (sb) sb.scrollTop = sidebarScroll; }

  // Mount hooks.
  $$('.cad-embed').forEach(mountCadViewer);
  if (UI.editor) {
    edUpdatePreview();
    const ta = $('[data-ed="body"]');
    if (ta && !UI.editor._focused) { (UI.editor.isNew && !UI.editor.title ? $('[data-ed="title"]') : ta)?.focus(); UI.editor._focused = true; }
  }
  if (UI.palette) { const inp = $('.palette input'); inp?.focus(); inp?.setSelectionRange(inp.value.length, inp.value.length); }
  if (UI.modal) $('.modal [data-m], .modal .btn--primary')?.focus?.();
  if (r.name === 'page' && r.params.anchor) {
    $('#' + CSS.escape(r.params.anchor))?.scrollIntoView();
  }
  mountTocSpy();
}

function mountTocSpy() {
  const content = $('[data-toc-root]');
  const links = $$('.toc a');
  if (!content || !links.length) return;
  const heads = links.map((a) => document.getElementById(a.dataset.toc)).filter(Boolean);
  const spy = () => {
    let cur = heads[0];
    for (const h of heads) if (h.getBoundingClientRect().top < 120) cur = h;
    links.forEach((a) => a.classList.toggle('here', a.dataset.toc === cur?.id));
  };
  content.addEventListener('scroll', spy, { passive: true });
  spy();
}

/* ============================================================================
   UI part 3 — the maintenance and cross-subteam layer: watch + inbox,
   wiki health, tag browsing, hover previews, sortable tables, shortcuts.
   ========================================================================== */

'use strict';

/* --------------------------- store extensions ----------------------------- */

Object.assign(Store, {
  isWatching(id) { const p = Store.prefs(); return (p.watched || (p.watched = [])).includes(id); },
  toggleWatch(id) {
    const p = Store.prefs();
    const w = p.watched || (p.watched = []);
    const i = w.indexOf(id);
    if (i >= 0) w.splice(i, 1);
    else {
      w.push(id);
      // Watching starts now — the page's past shouldn't flood in as "unread".
      if (!p.inboxReadAt) p.inboxReadAt = Date.now();
    }
    Store.persist();
    return i < 0;
  },
  inbox() {
    const p = Store.prefs();
    const watched = new Set(p.watched || []);
    const me = Store.me()?.email;
    return Store.activity().filter((a) =>
      a.by !== me && ((a.pageId && watched.has(a.pageId)) || (a.kind === 'mention' && a.who === me))
    ).slice(0, 60);
  },
  inboxUnread() {
    const readAt = Store.prefs().inboxReadAt || 0;
    return Store.inbox().filter((a) => a.ts > readAt).length;
  },
  markInboxRead() { Store.prefs().inboxReadAt = Date.now(); Store.persist(); },

  duplicatePage(id) {
    const p = Store.page(id);
    if (!p) return null;
    let title = p.title + ' (copy)';
    let n = 2;
    while (Store.pageByTitle(title)) title = `${p.title} (copy ${n++})`;
    return Store.createPage({ title, section: p.section, parent: p.parent, body: p.body, tags: [...p.tags] });
  },

  movePage(id, { section }) {
    const p = Store.page(id);
    if (!p) return;
    p.section = String(section || p.section);
    p.parent = null;
    Store.persist();
    Store.reindex();
  },

  health() {
    const broken = [];   // {page, target}
    const orphans = [];  // pages nothing links to and no children
    const stale = [];    // not touched in 90 days
    const linkedTo = new Set();
    for (const p of Store.s.pages) {
      for (const t of Store.linkIndex.get(p.id) || []) {
        const target = Store.titleIndex.get(t);
        if (target) linkedTo.add(target.id);
        else broken.push({ page: p, target: t });
      }
    }
    for (const p of Store.s.pages) {
      if (p.id === 'welcome') continue;
      if (!linkedTo.has(p.id) && !Store.childrenOf(p.id).length && !p.parent) orphans.push(p);
      if (Date.now() - p.updated > 90 * 864e5) stale.push(p);
    }
    return { broken, orphans, stale: stale.sort((a, b) => a.updated - b.updated) };
  },
});

let previewPop = null, previewTmr = null;

function killPreview() {
  clearTimeout(previewTmr);

  previewPop = null;
}

document.addEventListener('pointerover', (ev) => {
  if (!matchMedia('(hover: hover)').matches) return; // touch devices: taps navigate
  if (UI.modal || UI.palette) return;
  const a = ev.target.closest('a.wikilink:not(.wikilink--missing)');

  previewTmr = setTimeout(() => {

    const p = m && Store.page(m[1]);
    if (!p) return;

    document.body.appendChild(previewPop);

    previewPop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    previewPop.style.top = (r.bottom + h + 12 > innerHeight ? r.top - h - 8 : r.bottom + 8) + 'px';

}, true);

document.addEventListener('pointerout', (ev) => {

document.addEventListener('pointerdown', killPreview, true);

/* --------------------------- sortable tables ------------------------------ */

document.addEventListener('click', (ev) => {
  const th = ev.target.closest('.prose th');
  if (!th || UI.editor) return;
  const table = th.closest('table');
  const idx = [...th.parentNode.children].indexOf(th);
  const tbody = table.tBodies[0];
  const rows = [...tbody.rows];
  const dir = th.dataset.sort === 'asc' ? -1 : 1;
  table.querySelectorAll('th').forEach((h) => { delete h.dataset.sort; h.removeAttribute('aria-sort'); });
  th.dataset.sort = dir === 1 ? 'asc' : 'desc';
  th.setAttribute('aria-sort', dir === 1 ? 'ascending' : 'descending');
  const num = (s) => { const n = parseFloat(String(s).replace(/[^0-9.eE-]/g, '')); return isNaN(n) ? null : n; };
  rows.sort((a, b) => {
    const av = a.cells[idx]?.textContent.trim() ?? '', bv = b.cells[idx]?.textContent.trim() ?? '';
    const an = num(av), bn = num(bv);
    if (an !== null && bn !== null) return (an - bn) * dir;
    return av.localeCompare(bv) * dir;
  });
  rows.forEach((r) => tbody.appendChild(r));
});
