/* ============================================================================
   CUPI Wiki — the internal knowledge base, drawn in the site's own language:
   white page, near-black ink, hairline rules, frosted glass chrome, standard
   system faces, and restraint everywhere else. Carnelian appears
   only as a functional signal (destructive actions, unsaved state), never as
   decoration.
   ========================================================================== */

:root {
  /* Light (default) — matches the site's inverted theme exactly. */
  --page: #ffffff;
  --fg: #141414;
  --fg-rgb: 20, 20, 20;
  --page-rgb: 255, 255, 255;
  --muted: rgba(0, 0, 0, 0.55);
  --faint: rgba(0, 0, 0, 0.46);
  --hairline: rgba(0, 0, 0, 0.12);
  --rule: rgba(0, 0, 0, 0.3);
  --hover: rgba(0, 0, 0, 0.05);
  --press: rgba(0, 0, 0, 0.08);
  --selected: rgba(0, 0, 0, 0.065);
  --code-bg: rgba(0, 0, 0, 0.05);
  --glass: rgba(255, 255, 255, 0.72);
  --veil: rgba(255, 255, 255, 0.6);
  --pop: #ffffff;
  --pop-shadow: 0 10px 40px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.08);
  --accent: #b31b1b;            /* Cornell carnelian, functional only */
  --accent-soft: rgba(179, 27, 27, 0.09);
  --good: #1a7f37;
  --good-bg: rgba(26, 127, 55, 0.1);
  --bad: #cf222e;
  --bad-bg: rgba(207, 34, 46, 0.1);
  --img-outline: rgba(0, 0, 0, 0.1);
  --font-ui: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-label: var(--font-ui);
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-display: 'Playfair Display', Georgia, serif;
  --radius: 6px;
  --radius-bar: 10px;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --page: #000000;
    --fg: #ffffff;
    --fg-rgb: 255, 255, 255;
    --page-rgb: 0, 0, 0;
    --muted: rgba(255, 255, 255, 0.55);
    --faint: rgba(255, 255, 255, 0.46);
    --hairline: rgba(255, 255, 255, 0.12);
    --rule: rgba(255, 255, 255, 0.3);
    --hover: rgba(255, 255, 255, 0.07);
    --press: rgba(255, 255, 255, 0.11);
    --selected: rgba(255, 255, 255, 0.09);
    --code-bg: rgba(255, 255, 255, 0.08);
    --glass: rgba(10, 10, 10, 0.6);
    --veil: rgba(0, 0, 0, 0.6);
    --pop: #101010;
    --pop-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
    --accent: #e04343;
    --accent-soft: rgba(224, 67, 67, 0.14);
    --good: #3fb950;
    --good-bg: rgba(63, 185, 80, 0.14);
    --bad: #f85149;
    --bad-bg: rgba(248, 81, 73, 0.14);
    --img-outline: rgba(255, 255, 255, 0.1);
  }
}

:root[data-theme='dark'] {
  --page: #000000;
  --fg: #ffffff;
  --fg-rgb: 255, 255, 255;
  --page-rgb: 0, 0, 0;
  --muted: rgba(255, 255, 255, 0.55);
  --faint: rgba(255, 255, 255, 0.46);
  --hairline: rgba(255, 255, 255, 0.12);
  --rule: rgba(255, 255, 255, 0.3);
  --hover: rgba(255, 255, 255, 0.07);
  --press: rgba(255, 255, 255, 0.11);
  --selected: rgba(255, 255, 255, 0.09);
  --code-bg: rgba(255, 255, 255, 0.08);
  --glass: rgba(10, 10, 10, 0.6);
  --veil: rgba(0, 0, 0, 0.6);
  --pop: #101010;
  --pop-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
  --accent: #e04343;
  --accent-soft: rgba(224, 67, 67, 0.14);
  --good: #3fb950;
  --good-bg: rgba(63, 185, 80, 0.14);
  --bad: #f85149;
  --bad-bg: rgba(248, 81, 73, 0.14);
  --img-outline: rgba(255, 255, 255, 0.1);
}

*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; height: 100%; }

body {
  background: var(--page);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

#app { height: 100dvh; }

button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }

:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 2px; }

::selection { background: rgba(var(--fg-rgb), 0.14); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

.visually-hidden {
  position: absolute !important; width: 1px !important; height: 1px !important;
  padding: 0 !important; margin: -1px !important; overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
}

/* ---------------------------------------------------------------------------
   Shared controls
   ------------------------------------------------------------------------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 32px; padding: 0 14px;
  border: 1px solid var(--hairline); border-radius: var(--radius);
  font-size: 13px; font-weight: 500; white-space: nowrap;
  user-select: none;
}
.btn:hover { background: var(--hover); }
.btn svg { width: 14px; height: 14px; flex: none; }

.btn--primary { background: var(--fg); color: var(--page); border-color: var(--fg); }
.btn--primary:hover { background: var(--fg); opacity: 0.85; }

.btn--danger { color: var(--bad); border-color: var(--bad); }
.btn--danger:hover { background: var(--bad-bg); }

.btn--ghost { border-color: transparent; color: var(--muted); }
.btn--ghost:hover { color: var(--fg); }

.btn--sm { height: 26px; padding: 0 10px; font-size: 12px; }

.btn[disabled] { opacity: 0.4; pointer-events: none; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: var(--radius);
  color: var(--muted); flex: none;
  position: relative;
}
.icon-btn::after { content: ''; position: absolute; inset: -5px; }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn.active { color: var(--fg); background: var(--selected); }
.icon-btn svg { width: 16px; height: 16px; }

.text-input, .select {
  height: 34px; padding: 0 10px; width: 100%;
  background: var(--page); border: 1px solid var(--hairline); border-radius: var(--radius);
  transition-property: border-color; transition-duration: 0.15s;
}
.text-input::placeholder { color: var(--faint); }
.text-input:focus, .select:focus { outline: none; border-color: var(--rule); }
textarea.text-input { height: auto; padding: 8px 10px; resize: vertical; }

.dd {
  display: inline-flex; align-items: center; gap: 8px;
  height: 34px; padding: 0 10px 0 12px; min-width: 130px;
  background: var(--page); border: 1px solid var(--hairline); border-radius: var(--radius);
  font-size: 13.5px; text-align: left;
}
.dd:hover { border-color: var(--rule); }
.dd--sm { height: 26px; font-size: 12px; min-width: 110px; padding: 0 8px 0 10px; }
.dd__label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd__chev { width: 12px; height: 12px; color: var(--faint); flex: none; }
label > .dd { width: 100%; }

.eyebrow {
  font-family: var(--font-label);
  font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--faint); user-select: none;
}

.kbd {
  display: inline-block; padding: 1px 5px;
  font-family: var(--font-mono); font-size: 11px;
  border: 1px solid var(--hairline); border-bottom-width: 2px; border-radius: 4px;
  color: var(--muted); background: var(--page);
}

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 8px;
  border: 1px solid var(--hairline); border-radius: 10px;
  font-size: 11px; color: var(--muted); white-space: nowrap;
}
.chip--admin { border-color: var(--accent); color: var(--accent); }

.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%; flex: none;
  background: var(--fg); color: var(--page);
  font-size: 10px; font-weight: 600; letter-spacing: 0.02em;
  user-select: none;
}
.avatar--lg { width: 32px; height: 32px; font-size: 12px; }

.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dot--accent { background: var(--accent); }

/* ---------------------------------------------------------------------------
   Login — mirrors the site's hero: emptiness, wordmark, letterspaced caps.
   ------------------------------------------------------------------------- */

.login {
  height: 100dvh; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px; overflow-y: auto;
}

.login__wordmark {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(56px, 11vw, 108px); line-height: 1;
  letter-spacing: 0.01em; user-select: none;
  margin: 0;
}

.login__sub {
  margin: 14px 0 0;
  font-family: 'Times New Roman', Times, serif;
  font-size: clamp(9px, 1vw, 12px); letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--fg); text-align: center; user-select: none;
}

.login__card {
  margin-top: clamp(36px, 7vh, 64px);
  width: min(360px, 100%);
  display: flex; flex-direction: column; gap: 12px;
}

.login__google {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  height: 44px; width: 100%;
  border: 1px solid var(--rule); border-radius: var(--radius);
  font-size: 14px; font-weight: 500;
}
.login__google:hover { background: var(--hover); }
.login__google svg { width: 18px; height: 18px; flex: none; }

.login__hint { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0; }

.login__rule {
  display: flex; align-items: center; gap: 12px;
  color: var(--faint); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  font-family: var(--font-label); user-select: none;
}
.login__rule::before, .login__rule::after { content: ''; flex: 1; height: 1px; background: var(--hairline); }

.login__invite { display: flex; gap: 8px; }
.login__invite .text-input { font-family: var(--font-mono); letter-spacing: 0.06em; }

.login__foot {
  margin-top: clamp(40px, 8vh, 72px);
  font-family: var(--font-label); font-size: 11px; letter-spacing: 0.06em; line-height: 1.7;
  color: var(--faint); text-align: center; user-select: none;
}

.login__error {
  border: 1px solid var(--bad); border-radius: var(--radius);
  background: var(--bad-bg); color: var(--fg);
  padding: 10px 12px; font-size: 13px; line-height: 1.5;
}

.chooser { display: flex; flex-direction: column; gap: 8px; }
.chooser__head { font-size: 13px; color: var(--muted); text-align: center; margin: 0 0 4px; }
.chooser__item {
  display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 9px 12px; border: 1px solid var(--hairline); border-radius: var(--radius);
}
.chooser__item:hover { background: var(--hover); }
.chooser__name { font-size: 14px; font-weight: 500; }
.chooser__mail { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chooser__note { font-size: 11px; color: var(--faint); margin-left: auto; text-align: right; }

/* ---------------------------------------------------------------------------
   App shell
   ------------------------------------------------------------------------- */

.shell { display: flex; height: 100dvh; }

.sidebar {
  width: 268px; flex: none;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--hairline);
  background: var(--page);
  transition-property: margin-left; transition-duration: 0.22s; transition-timing-function: ease;
}
.shell.nav-hidden .sidebar { margin-left: -268px; }

.sidebar__head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
.sidebar__brand {
  font-size: 14px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; user-select: none; text-decoration: none;
}
.sidebar__brand { display: inline-flex; align-items: center; gap: 9px; }
.sidebar__brand span { color: var(--faint); }
.sidebar__logo { width: 22px; height: 22px; border-radius: 50%; display: block; user-select: none; -webkit-user-drag: none; }

.sidebar__search {
  margin: 0 12px 10px;
  display: flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 10px; flex: none;
  border: 1px solid var(--hairline); border-radius: var(--radius);
  color: var(--faint); font-size: 13px;
  user-select: none;
}
.sidebar__search:hover { color: var(--muted); border-color: var(--rule); }
.sidebar__search svg { width: 14px; height: 14px; }
.sidebar__search .kbd { margin-left: auto; }

.sidebar__nav { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 1px; }

.sidebar__scroll { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }

.navlink {
  display: flex; align-items: center; gap: 9px;
  height: 30px; padding: 0 8px; border-radius: var(--radius);
  font-size: 13.5px; color: var(--muted); text-decoration: none;
  user-select: none; width: 100%;
}
.navlink:hover { background: var(--hover); color: var(--fg); }
.navlink.active { background: var(--selected); color: var(--fg); }
.navlink svg { width: 15px; height: 15px; flex: none; opacity: 0.75; }
.navlink .count {
  margin-left: auto; font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint);
  font-variant-numeric: tabular-nums;
}

.tree-section { margin-top: 14px; }
.tree-section__head {
  display: flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 8px; width: 100%;
  border-radius: var(--radius);
}
.tree-section__head:hover { background: var(--hover); }
.tree-section__head:hover .tree-section__add { opacity: 1; }
.tree-section__head .eyebrow { flex: 1; text-align: left; }
.tree-section__chev { width: 10px; height: 10px; color: var(--faint); transition-property: transform; transition-duration: 0.18s; flex: none; }
.tree-section.collapsed .tree-section__chev { transform: rotate(-90deg); }
.tree-section__add { opacity: 0; color: var(--faint); width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; transition-property: opacity; transition-duration: 0.15s; position: relative; }
.tree-section__add::after { content: ''; position: absolute; inset: -6px; }
.tree-section__add:hover { color: var(--fg); background: var(--press); }
.tree-section__add svg { width: 12px; height: 12px; }
.tree-section.collapsed .tree-section__body { display: none; }
.tree-section__body { display: flex; flex-direction: column; gap: 1px; padding-top: 2px; }

.tree-item__row {
  display: flex; align-items: center; gap: 6px;
  height: 29px; padding: 0 6px 0 8px; border-radius: var(--radius);
  font-size: 13.5px; color: var(--muted); text-decoration: none;
  user-select: none;
}
.tree-item__row:hover { background: var(--hover); color: var(--fg); }
.tree-item__row.active { background: var(--selected); color: var(--fg); }
.tree-item__label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-item__star { width: 11px; height: 11px; color: var(--faint); flex: none; display: inline-flex; align-items: center; justify-content: center; }
.tree-item__star svg { width: 11px; height: 11px; display: block; }
.tree-item--child .tree-item__row { padding-left: 26px; font-size: 13px; }

.sidebar__foot {
  border-top: 1px solid var(--hairline);
  padding: 10px 12px;
  display: flex; align-items: center; gap: 8px;
}
.sidebar__user { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; border-radius: var(--radius); padding: 4px 6px; margin: -4px -6px; text-align: left; }
.sidebar__user:hover { background: var(--hover); }
.sidebar__user-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar__user-mail { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------------------------------------------------------------------
   Main column + glass topbar
   ------------------------------------------------------------------------- */

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 40;
  display: flex; align-items: center; gap: 8px;
  height: 52px; padding: 0 14px;
  border-bottom: 1px solid var(--hairline);
  background: var(--glass);
  -webkit-backdrop-filter: blur(9px) saturate(1.2);
  backdrop-filter: blur(9px) saturate(1.2);
  user-select: none;
}

.crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; font-size: 13px; }
.crumbs a { color: var(--muted); text-decoration: none; padding: 3px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.crumbs a:hover { background: var(--hover); color: var(--fg); }
.crumbs__sep { color: var(--faint); flex: none; }
.crumbs__here { color: var(--fg); font-weight: 500; padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs__draft { color: var(--accent); display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding-left: 4px; }

.topbar__meta { font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--faint); white-space: nowrap; }

.content { flex: 1; overflow-y: auto; padding-top: 52px; scroll-padding-top: 68px; }

.page-wrap { display: flex; justify-content: center; gap: 40px; padding: 0 clamp(20px, 5vw, 56px); }
.page-col { width: min(760px, 100%); min-width: 0; padding: clamp(24px, 4vh, 44px) 0 96px; }

.toc {
  width: 200px; flex: none; position: sticky; top: 0;
  align-self: flex-start; max-height: calc(100dvh - 60px); overflow-y: auto;
  padding-top: clamp(108px, 14vh, 148px);
}
.toc__list { display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--hairline); }
.toc a {
  display: block; padding: 3px 0 3px 14px; margin-left: -1px;
  font-size: 12px; color: var(--muted); text-decoration: none;
  border-left: 1px solid transparent;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition-property: color, border-color; transition-duration: 0.15s;
}
.toc a:hover { color: var(--fg); }
.toc a.here { color: var(--fg); border-left-color: var(--fg); }
.toc a.lvl3 { padding-left: 26px; }
@media (max-width: 1180px) { .toc { display: none; } }

.page-head { padding-bottom: 14px; border-bottom: 1px solid var(--hairline); margin-bottom: 26px; }
.page-head h1 {
  margin: 0; font-size: clamp(28px, 4vw, 40px); font-weight: 400; line-height: 1.15;
  letter-spacing: 0.005em; text-wrap: balance;
}
.page-head__titlerow h1 { min-width: 0; }
.page-head__byline {
  display: flex; align-items: center; gap: 10px; margin-top: 12px;
  font-size: 13px; color: var(--muted);
}
.page-head__byline .who { display: inline-flex; align-items: center; gap: 8px; }
.page-head__info {
  width: 24px; height: 24px; opacity: 0.45; overflow: visible;
}
.page-head__info svg { width: 15px; height: 15px; display: block; }
.page-head__info:hover, .page-head__info.active { opacity: 1; }

.page-head__meta {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px;
  font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--muted);
}
.page-head__meta .who { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

/* ---------------------------------------------------------------------------
   Prose — rendered markdown
   ------------------------------------------------------------------------- */

.prose { font-size: 15px; line-height: 1.65; text-wrap: pretty; }
.prose > *:first-child { margin-top: 0; }

.prose h2, .prose h3, .prose h4 { font-weight: 600; line-height: 1.25; scroll-margin-top: 68px; position: relative; text-wrap: balance; }
.prose h2 { font-size: 22px; margin: 36px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--hairline); }
.prose h3 { font-size: 17px; margin: 28px 0 8px; }
.prose h4 { font-size: 15px; margin: 22px 0 6px; }

.prose .hlink { position: absolute; left: -24px; top: 4px; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; color: var(--faint); opacity: 0; text-decoration: none; transition-property: opacity; transition-duration: 0.15s; }
.prose h2:hover .hlink, .prose h3:hover .hlink, .prose h4:hover .hlink { opacity: 1; }
.prose .hlink svg { width: 13px; height: 13px; }
@media (max-width: 900px) { .prose .hlink { display: none; } }

.prose p { margin: 0 0 14px; }
.prose strong { font-weight: 600; }
.prose a { color: var(--fg); text-decoration: underline; text-decoration-color: rgba(var(--fg-rgb), 0.35); text-underline-offset: 2px; }
.prose a:hover { text-decoration-color: var(--fg); }
.prose a.wikilink--missing { color: var(--accent); text-decoration-color: var(--accent); text-decoration-style: dashed; }
.prose a.ext::after { content: '\2197'; font-size: 0.72em; vertical-align: super; margin-left: 1px; color: var(--faint); }

.prose ul, .prose ol { margin: 0 0 14px; padding-left: 26px; }
.prose li { margin: 3px 0; }
.prose li > ul, .prose li > ol { margin-bottom: 0; }

.prose li.task { list-style: none; margin-left: -22px; display: flex; gap: 8px; align-items: baseline; }
.prose li.task input { width: 14px; height: 14px; accent-color: var(--fg); flex: none; position: relative; top: 2px; cursor: pointer; }
.prose li.task input[disabled] { cursor: default; }
.prose li.task.done > .task-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }

.prose blockquote {
  margin: 0 0 14px; padding: 2px 0 2px 16px;
  border-left: 2px solid var(--rule); color: var(--muted);
}
.prose blockquote p:last-child { margin-bottom: 0; }

.prose hr { border: none; height: 1px; background: var(--hairline); margin: 28px 0; }

.prose code {
  font-family: var(--font-mono); font-size: 0.92em;
  background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
}

.prose pre {
  margin: 0 0 16px; padding: 14px 16px;
  background: var(--code-bg); border: 1px solid var(--hairline); border-radius: var(--radius);
  overflow-x: auto; position: relative;
}
.prose pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; display: block; }
.prose pre .codelang {
  position: absolute; top: 8px; right: 10px;
  font-family: var(--font-label); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--faint); user-select: none;
}
.tok-k { font-weight: 700; }
.tok-s { color: var(--muted); font-style: italic; }
.tok-c { color: var(--faint); font-style: italic; }
.tok-n { font-weight: 600; }

.prose .tablewrap { overflow-x: auto; margin: 0 0 16px; }
.prose table { border-collapse: collapse; font-size: 13.5px; min-width: 420px; }
.prose th, .prose td { border: 1px solid var(--hairline); padding: 7px 12px; text-align: left; vertical-align: top; }
.prose th {
  font-family: var(--font-label); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); font-weight: 400; background: var(--hover);
}
.prose td { font-variant-numeric: tabular-nums; }

.callout {
  display: flex; gap: 12px; margin: 0 0 16px; padding: 12px 14px;
  border: 1px solid var(--hairline); border-radius: var(--radius);
}
.callout > svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.callout > div { min-width: 0; flex: 1; }
.callout p:last-child { margin-bottom: 0; }
.callout--note { background: var(--hover); }
.callout--warn { border-color: var(--accent); background: var(--accent-soft); }
.callout--warn > svg { color: var(--accent); }
.callout--tip { border-color: var(--good); background: var(--hover); }
.callout--tip > svg { color: var(--good); }
.callout__title { font-weight: 600; font-size: 13.5px; margin: 0 0 2px; }

.page-foot { margin-top: 48px; border-top: 1px solid var(--hairline); padding-top: 18px; display: flex; flex-direction: column; gap: 26px; }
.backlinks { display: flex; flex-direction: column; gap: 8px; }
.backlinks__list { display: flex; flex-wrap: wrap; gap: 8px; }
.backlink {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 11px; border: 1px solid var(--hairline); border-radius: var(--radius);
  font-size: 13px; color: var(--muted); text-decoration: none;
}
.backlink:hover { background: var(--hover); color: var(--fg); }
.backlink svg { width: 12px; height: 12px; opacity: 0.6; }

.comments { display: flex; flex-direction: column; gap: 14px; }
.comment { display: flex; gap: 11px; }
.comment__body { flex: 1; min-width: 0; }
.comment__head { display: flex; align-items: center; gap: 9px; }
.comment__who { font-size: 13px; font-weight: 600; }
.comment__when { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint); }
.comment__text { font-size: 14px; margin: 3px 0 0; overflow-wrap: break-word; }
.comment__text p { margin: 0; }
.comment__del { opacity: 0; margin-left: auto; }
.comment:hover .comment__del, .comment:focus-within .comment__del { opacity: 1; }
.comment-form { display: flex; gap: 11px; align-items: flex-start; }
.comment-form textarea { flex: 1; min-height: 38px; }
.comment-form .btn { margin-top: 2px; }

/* ---------------------------------------------------------------------------
   Editor
   ------------------------------------------------------------------------- */

.editor { display: flex; flex-direction: column; height: 100%; padding-top: 52px; }

.editor__tools {
  display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
  padding: 6px clamp(16px, 4vw, 40px);
  border-bottom: 1px solid var(--hairline);
}
.editor__tools .sep { width: 1px; height: 18px; background: var(--hairline); margin: 0 6px; }
.editor__tools .spacer { flex: 1; }
.editor__mode { display: flex; border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; }
.editor__mode button { padding: 4px 12px; font-size: 12px; color: var(--muted); }
.editor__mode button.active { background: var(--selected); color: var(--fg); }

.editor__panes { flex: 1; display: flex; min-height: 0; }
.editor__pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.editor__pane--src textarea {
  flex: 1; width: 100%; border: none; resize: none; background: var(--page); color: var(--fg);
  padding: 26px clamp(16px, 4vw, 40px) 120px;
  font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6;
}
.editor__pane--src textarea:focus { outline: none; }
.editor__pane--preview { border-left: 1px solid var(--hairline); overflow-y: auto; }
.editor__pane--preview .prose { padding: 10px clamp(16px, 4vw, 40px) 120px; }
.editor__pane--preview .preview-tag { padding: 26px clamp(16px, 4vw, 40px) 0; }
.editor.mode-write .editor__pane--preview { display: none; }
.editor.mode-preview .editor__pane--src { display: none; }
.editor.mode-preview .editor__pane--preview { border-left: none; }
.editor.mode-preview .editor__pane--preview .prose, .editor.mode-preview .preview-tag { max-width: 800px; margin: 0 auto; }
@media (max-width: 900px) { .editor.mode-split .editor__pane--preview { display: none; } }

.editor__title {
  border: none; background: var(--page); color: var(--fg); width: 100%;
  padding: 24px clamp(16px, 4vw, 40px) 0;
  font-size: 28px; font-weight: 400; line-height: 1.2;
}
.editor__title:focus { outline: none; }
.editor__title::placeholder { color: var(--faint); }

/* ---------------------------------------------------------------------------
   History + diff
   ------------------------------------------------------------------------- */

.history { display: flex; flex-direction: column; }
.rev {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 8px; border-bottom: 1px solid var(--hairline); border-radius: var(--radius);
}
a.rev:hover { background: var(--hover); }
.rev__meta { flex: 1; min-width: 0; }
.rev__summary { font-size: 14px; font-weight: 500; display: block; }
.rev__when { font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--faint); margin-top: 2px; display: block; }
.rev__stats { font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rev__stats .add { color: var(--good); }
.rev__stats .del { color: var(--bad); margin-left: 6px; }
.rev--current .rev__summary::after { content: 'current'; font-family: var(--font-label); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin-left: 9px; }

.diff {
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55;
  border: 1px solid var(--hairline); border-radius: var(--radius);
  overflow-x: auto; margin-top: 4px;
}
.diff__line { display: flex; white-space: pre-wrap; word-break: break-word; }
.diff__gut { flex: none; width: 22px; text-align: center; user-select: none; color: var(--faint); }
.diff__txt { flex: 1; padding-right: 12px; }
.diff__line--add { background: var(--good-bg); }
.diff__line--add .diff__gut { color: var(--good); }
.diff__line--del { background: var(--bad-bg); }
.diff__line--del .diff__gut { color: var(--bad); }
.diff__line--skip { color: var(--faint); background: var(--hover); padding: 2px 0; justify-content: center; user-select: none; }

/* ---------------------------------------------------------------------------
   Search palette
   ------------------------------------------------------------------------- */

.palette-veil {
  position: fixed; inset: 0; z-index: 90;
  background: var(--veil);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  display: flex; justify-content: center; align-items: flex-start;
  padding: min(14vh, 130px) 16px 16px;
}
.palette {
  width: min(600px, 100%);
  background: var(--pop); border: 1px solid var(--hairline); border-radius: var(--radius-bar);
  box-shadow: var(--pop-shadow);
  display: flex; flex-direction: column; overflow: hidden;
  max-height: min(480px, 70dvh);
}
.palette__head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--hairline); }
.palette__head svg { width: 16px; height: 16px; color: var(--faint); flex: none; }
.palette__head input { flex: 1; border: none; background: none; font-size: 15px; color: var(--fg); min-width: 0; }
.palette__head input:focus { outline: none; }
.palette__head input::placeholder { color: var(--faint); }
.palette__list { overflow-y: auto; padding: 6px; }
.palette__group { padding: 8px 10px 4px; }
.palette__item {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: var(--radius);
}
.palette__item.sel, .palette__item:hover { background: var(--selected); }
.palette__item > svg { width: 15px; height: 15px; color: var(--faint); flex: none; }
.palette__title { font-size: 14px; }
.palette__title mark, .palette__snip mark { background: none; color: var(--fg); font-weight: 700; }
.palette__snip { font-size: 12px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }
.palette__snip mark { font-weight: 600; }
.palette__where { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint); white-space: nowrap; flex: none; }
.palette__empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }
.palette__foot {
  display: flex; gap: 16px; padding: 9px 16px; border-top: 1px solid var(--hairline);
  font-size: 11.5px; color: var(--faint); user-select: none;
}

/* ---------------------------------------------------------------------------
   Admin
   ------------------------------------------------------------------------- */

.admin-grid { display: flex; flex-direction: column; gap: 36px; }

.admin-block__head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
.admin-block__head h2 { margin: 0; font-size: 19px; font-weight: 600; }
.admin-block__head .count { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.admin-block__sub { font-size: 13px; color: var(--muted); margin: 2px 0 14px; max-width: 62ch; }

.roster { border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; }
.roster__scroll { overflow-x: auto; }
.roster table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 660px; }
.roster th {
  font-family: var(--font-label); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  font-weight: 400; color: var(--faint); text-align: left;
  padding: 9px 14px; border-bottom: 1px solid var(--hairline); background: var(--hover);
  white-space: nowrap;
}
.roster td { padding: 9px 14px; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
.roster tr:last-child td { border-bottom: none; }
.roster tbody tr:hover td { background: var(--hover); }
.roster .who { display: flex; align-items: center; gap: 10px; }
.roster .who b { font-weight: 500; display: block; }
.roster .mail { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); white-space: nowrap; display: block; }
.roster .mono { font-family: var(--font-mono); font-size: 12px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.roster .actions { display: flex; gap: 4px; justify-content: flex-end; opacity: 0; transition-property: opacity; transition-duration: 0.15s; }
.roster tr:hover .actions, .roster tr:focus-within .actions { opacity: 1; }

.invite-add { display: flex; gap: 8px; }
.invite-add .text-input { flex: 1; }
@media (max-width: 640px) { .invite-add { flex-wrap: wrap; } }

.audit { display: flex; flex-direction: column; }
.audit__row {
  display: flex; align-items: baseline; gap: 12px;
  padding: 8px 2px; border-bottom: 1px solid var(--hairline);
  font-size: 13px;
}
.audit__row:last-child { border-bottom: none; }
.audit__when { font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--faint); white-space: nowrap; width: 138px; flex: none; }
.audit__what { color: var(--muted); }
.audit__what b { color: var(--fg); font-weight: 500; }

.mailview { border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; }
.mailview__head { padding: 12px 16px; border-bottom: 1px solid var(--hairline); background: var(--hover); display: flex; flex-direction: column; gap: 3px; }
.mailview__row { display: flex; gap: 8px; font-size: 12.5px; }
.mailview__row .k { font-family: var(--font-label); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); width: 52px; flex: none; padding-top: 2px; }
.mailview__body { padding: 20px 24px; font-size: 14px; line-height: 1.6; }
.mailview__body p { margin: 0 0 10px; }
.mailview__code {
  display: block; margin: 14px 0; padding: 12px;
  font-family: var(--font-mono); font-size: 19px; letter-spacing: 0.14em; text-align: center;
  border: 1px dashed var(--rule); border-radius: var(--radius);
  user-select: all;
}

/* ---------------------------------------------------------------------------
   Activity / listing pages
   ------------------------------------------------------------------------- */

.feed { display: flex; flex-direction: column; }
.feed__day { margin-top: 22px; display: flex; flex-direction: column; }
.feed__day:first-child { margin-top: 0; }
.feed__row {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 6px; border-bottom: 1px solid var(--hairline);
  font-size: 13.5px; text-decoration: none; color: var(--fg);
  border-radius: var(--radius);
}
a.feed__row:hover { background: var(--hover); }
.feed__what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.feed__what b { color: var(--fg); font-weight: 500; }
.feed__when { font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--faint); white-space: nowrap; }

.cardlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.pagecard {
  display: flex; flex-direction: column; gap: 7px;
  padding: 14px 16px; border: 1px solid var(--hairline); border-radius: var(--radius);
  text-decoration: none; color: var(--fg);
  transition-property: background, border-color; transition-duration: 0.15s;
}
.pagecard:hover { background: var(--hover); border-color: var(--rule); }
.pagecard b { font-weight: 500; font-size: 14.5px; }
.pagecard .snip { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pagecard .meta { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint); margin-top: auto; }

/* ---------------------------------------------------------------------------
   Modals, menus, toasts, empty states
   ------------------------------------------------------------------------- */

.modal-veil {
  position: fixed; inset: 0; z-index: 80;
  background: var(--veil);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  width: min(480px, 100%); max-height: min(680px, 92dvh);
  background: var(--pop); border: 1px solid var(--hairline); border-radius: var(--radius-bar);
  box-shadow: var(--pop-shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.modal--wide { width: min(600px, 100%); }
.modal__head { display: flex; align-items: center; gap: 10px; padding: 16px 20px 0; }
.modal__head h3 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
.modal__body { padding: 14px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal__foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 20px 18px; }
.modal__body label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; }
.modal__body label .sub { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.field-error { color: var(--bad); font-size: 12.5px; }

.tpl-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tpl-grid > * { min-width: 0; }
.tpl {
  display: flex; flex-direction: column; gap: 8px; text-align: left;
  padding: 8px 8px 10px; border: 1px solid var(--hairline); border-radius: var(--radius);
  transition-property: background, border-color; transition-duration: 0.15s;
}
.tpl:hover { background: var(--hover); }
.tpl.sel { border-color: var(--fg); background: var(--selected); }
.tpl b { font-size: 12.5px; font-weight: 600; padding: 0 4px; }
/* A miniature render of the actual template — you pick a structure, not a name. */
.tpl__thumb {
  height: 108px; overflow: hidden; position: relative;
  border: 1px solid var(--hairline); border-radius: calc(var(--radius) - 2px);
  background: var(--page); pointer-events: none;
}
.tpl__thumb .prose {
  transform: scale(0.42); transform-origin: top left;
  width: 238%; padding: 10px 12px; font-size: 14px;
}
.tpl__thumb .prose h2 { margin-top: 10px; }
.tpl__thumb::after { content: ''; position: absolute; inset: 60% 0 0 0; background: linear-gradient(transparent, var(--page)); }
.tpl.sel .tpl__thumb::after { background: linear-gradient(transparent, var(--pop)); }
.tpl__thumb--blank { display: flex; align-items: center; justify-content: center; }
.tpl__thumb--blank span { font-size: 12px; color: var(--faint); }
@media (max-width: 560px) { .tpl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.menu {
  position: fixed; z-index: 95; min-width: 200px;
  background: var(--pop); border: 1px solid var(--hairline); border-radius: var(--radius-bar);
  box-shadow: var(--pop-shadow);
  padding: 5px; display: flex; flex-direction: column;
}
.menu button {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius);
  font-size: 13.5px; text-align: left; color: var(--fg); width: 100%;
}
.menu button:hover { background: var(--hover); }
.menu button.danger { color: var(--bad); }
.menu svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.menu button.danger svg { color: var(--bad); }
.menu hr { border: none; height: 1px; background: var(--hairline); margin: 5px 6px; }
.menu .menu__hint { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--faint); }

.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 16px; border-radius: var(--radius-bar);
  background: var(--fg); color: var(--page);
  font-size: 13.5px; box-shadow: var(--pop-shadow);
  animation: toast-in 0.2s ease;
  pointer-events: auto; white-space: nowrap;
}
.toast button { color: var(--page); text-decoration: underline; font-size: 13px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.empty {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 64px 24px; text-align: center; color: var(--muted);
}
.empty svg { width: 26px; height: 26px; color: var(--faint); }
.empty b { font-weight: 500; color: var(--fg); }
.empty p { margin: 0; font-size: 13.5px; max-width: 42ch; }

.plain-head { margin-bottom: 24px; }
.plain-head h1 { margin: 6px 0 0; font-size: clamp(26px, 4vw, 36px); font-weight: 400; text-wrap: balance; }
.plain-head p { margin: 10px 0 0; color: var(--muted); font-size: 14px; max-width: 62ch; }
.plain-head p b { color: var(--fg); font-weight: 500; }

/* ---------------------------------------------------------------------------
   Figures, file cards, CAD viewer, embeds
   ------------------------------------------------------------------------- */

.prose figure { margin: 0 0 16px; }
.prose img { max-width: 100%; border-radius: var(--radius); cursor: zoom-in; outline: 1px solid var(--img-outline); outline-offset: -1px; display: block; }
.prose figure img { width: 100%; }
.prose figcaption {
  margin-top: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.5;
  padding-left: 12px; border-left: 2px solid var(--hairline);
}

.missing-att {
  display: inline-block; padding: 2px 8px; border: 1px dashed var(--bad);
  border-radius: 4px; color: var(--bad); font-size: 12.5px;
}

.filecard, .embed-card {
  display: flex; align-items: center; gap: 13px;
  margin: 0 0 16px; padding: 12px 14px;
  border: 1px solid var(--hairline); border-radius: var(--radius);
  transition-property: border-color; transition-duration: 0.15s;
}
.filecard:hover, .embed-card:hover { border-color: var(--rule); }
.filecard__icon, .embed-card__icon {
  width: 36px; height: 36px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--hairline); border-radius: calc(var(--radius) - 2px);
  color: var(--muted);
}
.filecard__icon svg, .embed-card__icon svg { width: 18px; height: 18px; }
.filecard__meta, .embed-card__meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.filecard__meta b, .embed-card__meta b { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filecard__meta span, .embed-card__ref { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.embed-card__note {
  font-family: var(--font-label); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--faint); white-space: nowrap;
}
.embed-card .btn { text-decoration: none; }
@media (max-width: 640px) { .embed-card__note { display: none; } }

.cad-embed { margin: 0 0 16px; border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; }
.cad-embed__head { display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-bottom: 1px solid var(--hairline); }
.cad-embed__head .filecard__icon { color: var(--fg); }
.cad-embed__hint { font-family: var(--font-label); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.cad-embed__stage { position: relative; background: var(--hover); }
.cad-embed__stage canvas { display: block; width: 100%; height: 300px; cursor: grab; touch-action: none; }
.cad-embed__stage canvas:active { cursor: grabbing; }
@media (max-width: 640px) { .cad-embed__hint { display: none; } }

.lightbox {
  position: fixed; inset: 0; z-index: 110;
  background: var(--veil);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  padding: 32px; cursor: zoom-out;
}
.lightbox img { max-width: 100%; max-height: 100%; border-radius: var(--radius); box-shadow: var(--pop-shadow); background: #fff; }
.lightbox__close { position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; }

.ed-autocomplete[hidden] { display: none; }
.ed-autocomplete {
  position: fixed; z-index: 96; min-width: 230px;
  background: var(--pop); border: 1px solid var(--hairline); border-radius: var(--radius-bar);
  box-shadow: var(--pop-shadow); padding: 5px;
  display: flex; flex-direction: column;
}
.ed-autocomplete button {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: var(--radius); font-size: 13.5px; text-align: left;
}
.ed-autocomplete button:hover, .ed-autocomplete button.sel { background: var(--hover); }
.ed-autocomplete svg { width: 14px; height: 14px; color: var(--muted); }

.editor.dropping .editor__pane--src textarea { background: var(--accent-soft); }

.preview-tag { user-select: none; }

/* Press feedback: exactly 0.96, properties named. */
.btn, .icon-btn, .chooser__item, .tpl, .palette__item, .login__google, .navlink, .tree-item__row {
  transition-property: background-color, border-color, color, opacity, scale;
  transition-duration: 0.15s;
  transition-timing-function: ease;
}
.btn:active, .icon-btn:active, .chooser__item:active, .login__google:active, .tpl:active { scale: 0.96; }

/* ---------------------------------------------------------------------------
   Feature layer: inbox badge, link previews, sortable tables, task meter
   ------------------------------------------------------------------------- */

.badge {
  margin-left: auto; min-width: 17px; height: 17px; padding: 0 5px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 9px; background: var(--accent); color: #fff;
  font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums;
}

.feed__row--new .feed__what b { font-weight: 600; }

.linkpreview {
  position: fixed; z-index: 79; width: min(340px, 80vw);
  background: var(--pop); border: 1px solid var(--hairline); border-radius: var(--radius-bar);
  box-shadow: var(--pop-shadow); padding: 12px 14px;
  pointer-events: none;
  animation: toast-in 0.15s ease;
}
.linkpreview b { font-size: 14px; font-weight: 600; display: block; }
.linkpreview__meta { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--faint); display: block; margin: 3px 0 6px; }
.linkpreview p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.55; }

.prose th { cursor: pointer; user-select: none; position: relative; padding-right: 24px; }
.prose th::after { content: ''; position: absolute; right: 8px; }
.prose th:hover { color: var(--fg); }
.prose th[data-sort='asc']::after { content: '↑'; }
.prose th[data-sort='desc']::after { content: '↓'; }

.taskmeter { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.taskmeter__bar {
  width: 54px; height: 4px; border-radius: 2px; background: var(--hairline);
  overflow: hidden; display: inline-block;
}
.taskmeter__bar span { display: block; height: 100%; background: var(--good); border-radius: 2px; }

/* ---------------------------------------------------------------------------
   Print — a page prints as a clean document
   ------------------------------------------------------------------------- */

@media print {
  body { overflow: visible; }
  .sidebar, .topbar, .shell__scrim, .toasts, .page-foot .comments form,
  .toc, .cad-embed__hint, .prose .hlink { display: none !important; }
  .shell, .main, .content { display: block; height: auto; overflow: visible; }
  .content { padding-top: 0; }
  .page-col { width: 100%; padding: 0; }
  .prose li.task input { accent-color: #000; }
  .prose a { text-decoration: none; }
}

/* Line-art SVG diagrams flip to white-ink-on-black in dark mode instead of
   glowing as white slabs. Photos and raster images are left alone. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .prose img[src^='data:image/svg'],
  :root:not([data-theme='light']) .lightbox img[src^='data:image/svg'] {
    filter: invert(1) hue-rotate(180deg);
    background: #000;
  }
}
:root[data-theme='dark'] .prose img[src^='data:image/svg'],
:root[data-theme='dark'] .lightbox img[src^='data:image/svg'] {
  filter: invert(1) hue-rotate(180deg);
  background: #000;
}

.mention {
  display: inline-block; padding: 0 5px; border-radius: 4px;
  background: var(--selected); font-weight: 600; font-size: 0.95em;
}

/* ---------------------------------------------------------------------------
   Mobile
   ------------------------------------------------------------------------- */

.shell__scrim { display: none; }

@media (max-width: 860px) {
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 60;
    box-shadow: var(--pop-shadow);
    transform: translateX(-100%);
    transition-property: transform; transition-duration: 0.22s; transition-timing-function: ease;
    margin-left: 0 !important;
  }
  .shell.nav-open .sidebar { transform: none; }
  .shell.nav-open .shell__scrim {
    display: block; position: fixed; inset: 0; z-index: 55;
    background: var(--veil);
  }
  .page-wrap { padding: 0 18px; }
  .topbar { padding: 0 8px; }
  .topbar__meta { display: none; }
  .editor__panes { flex-direction: column; }
  .editor__pane--preview { border-left: none; border-top: 1px solid var(--hairline); }
}

@media (max-width: 640px) {
  /* Breadcrumbs: only the current page — ancestors crush into noise here. */
  .crumbs a, .crumbs .crumbs__sep { display: none; }
  .crumbs .crumbs__here { max-width: 60vw; }
  /* Invite form stacks; the email field keeps a usable width. */
  .invite-add { flex-wrap: wrap; }
  .invite-add .text-input { flex: 1 1 100%; min-width: 0; }
  /* Editor topbar: split view doesn't exist at this width; drop the tabs
     and the shortcut hint so Save and Cancel keep room. */
  .editor__mode { display: none; }
  .editor .btn .kbd { display: none; }
}

</style>
</head>

<div id="app"></div>

// Binary STL of the MX bracket: an L-bracket built from axis-aligned boxes with a
// gusset. Overlapping solids are fine for shading — the viewer doesn't boolean.
function buildBracketStl() {
  const tris = [];
  const box = (x0, y0, z0, x1, y1, z1) => {
    const q = (a, b, c, d) => { tris.push([a, b, c], [a, c, d]); };
    const p = (x, y, z) => [x, y, z];
    q(p(x0,y0,z1), p(x1,y0,z1), p(x1,y1,z1), p(x0,y1,z1));
    q(p(x1,y0,z0), p(x0,y0,z0), p(x0,y1,z0), p(x1,y1,z0));
    q(p(x0,y0,z0), p(x1,y0,z0), p(x1,y0,z1), p(x0,y0,z1));
    q(p(x1,y1,z0), p(x0,y1,z0), p(x0,y1,z1), p(x1,y1,z1));
    q(p(x1,y0,z0), p(x1,y1,z0), p(x1,y1,z1), p(x1,y0,z1));
    q(p(x0,y1,z0), p(x0,y0,z0), p(x0,y0,z1), p(x0,y1,z1));
  };
  box(0, 0, 0, 46, 30, 4);        // base plate
  box(0, 0, 0, 4, 30, 38);        // upright
  box(0, 13, 0, 20, 17, 22);      // gusset web
  box(38, 4, 0, 42, 26, 4);       // boss under slot
  const n = tris.length;
  const buf = new ArrayBuffer(84 + n * 50);
  const dv = new DataView(buf);
  dv.setUint32(80, n, true);
  let o = 84;
  for (const t of tris) {
    const [a, b, c] = t;
    const u = [b[0]-a[0], b[1]-a[1], b[2]-a[2]], v = [c[0]-a[0], c[1]-a[1], c[2]-a[2]];
    const nx = u[1]*v[2]-u[2]*v[1], ny = u[2]*v[0]-u[0]*v[2], nz = u[0]*v[1]-u[1]*v[0];
    const l = Math.hypot(nx, ny, nz) || 1;
    [nx/l, ny/l, nz/l, ...a, ...b, ...c].forEach((f, i) => dv.setFloat32(o + i*4, f, true));
    o += 50;
  }
  let bin = '';
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return 'data:model/stl;base64,' + btoa(bin);
}

page({
  id: 'lab-safety', section: 'getting-started', title: 'Lab Access and Safety',
  owner: 'oa229@cornell.edu', created: ago(150), updated: ago(9), updatedBy: 'oa229@cornell.edu',
  body: `The lab is a shared space and the fastest way to lose it is a safety incident. Read this before your first solo session.

## LiPo rules (non-negotiable)

- Charge only in the fireproof bags, only on the bench by the extinguisher, never unattended.
- Storage-charge (3.8 V/cell) anything that won't fly within 48 h. The cabinet log has a column for it.
- A puffed pack goes in the salt-water bucket outside, then to EH&S. Post in ${'`#electrical`'} so we track the failure.

## Machines

| Machine | Training needed | Notes |
| --- | --- | --- |
| Bambu X1C ×3 | None — read [[3D Printing Guide]] | Book on the sheet by the printers |
| Soldering / rework | Electrical lead walkthrough | Fume extractor on, always |
| Bandsaw, drill press | Upson shop course | Card access proves completion |
| CNC router | Course + lead present | Aluminum only with mist coolant |

## After hours

Two-person rule after 22:00 for anything with spinning props, mains power, or the CNC. Solo CAD and soldering is fine.

::: warn Props off
Bench-testing a flight controller? Props come off before the battery goes on. No exceptions — this is our only standing rule with zero recorded violations. Keep it that way.

:::`,
});

page({
  id: 'adr-onshape', section: 'getting-started', title: 'ADR: Onshape over SolidWorks',
  owner: 'am3644@cornell.edu', created: ago(175), updated: ago(175), updatedBy: 'am3644@cornell.edu',
  tags: ['decision'],
  body: `**Status:** Adopted · **Deciders:** Alan, Ollie, Andre · **Date:** 2026-02-11

## Context

Cornell's SolidWorks licenses only run on the lab Windows machines, half the team is on Macs, and file exchange through Drive kept producing "which SLDPRT is current" archaeology. We were spending build meetings resolving CAD versions instead of building.

## Options considered

1. **SolidWorks + PDM discipline** — best surfacing tools; but license-locked to lab machines, PDM costs money we don't have, and enforcement failed twice already.
2. **Fusion 360** — free for students, decent; but per-file cloud model made assemblies of 200+ parts painful in testing, and export lock-in worried us.
3. **Onshape** — browser-based so every laptop works day one, real branching/versioning built in, free education tier. Weaker surfacing and drawings than SolidWorks.

## Decision

Onshape, for all team CAD. The one reason that mattered most: **version control is the actual problem we have**, and Onshape's branch/merge/version model solves it structurally instead of by discipline.

## Consequences

- Easier: onboarding (nothing to install), design reviews (send a link), [[CAD Standards (Onshape)]] can mandate branching because it's free
- Harder: complex surfacing; anyone needing it prototypes in SolidWorks on a lab machine, then rebuilds the final in Onshape
- Revisit if: assemblies exceed Onshape's education-tier performance, or the education tier changes`,
});

page({
  id: 'ai-grand-prix', section: 'projects', title: 'AI Grand Prix',
  owner: 'jc3391@cornell.edu', created: ago(185), updated: ago(0, 26), updatedBy: 'nl733@cornell.edu',
  tags: ['competition'],
  body: `Autonomous drone racing with the Drone Champions League. We passed **Virtual Qualifier 1** with a fully deterministic policy — no learned network in the loop, dead reckoning against the released course map with visual gate corrections.

## VQ2 (current)

VQ2 removes every pose and gate telemetry stream. What's left is a monocular camera and an IMU, so the policy now:

- guides on **bearings alone** — gate detections give direction, never range
- reads closing rate from **optical looming** (scale change of the gate quad between frames)
- carries attitude through gaps on IMU preintegration only

~~~python
# looming: expansion rate of gate bounding quad → time-to-contact proxy
tau_inv = (w_t - w_prev) / (w_prev * dt)     # 1/tau, w = quad width, px
commit  = tau_inv > TAU_COMMIT               # commit to the pass maneuver
~~~

Run logs and per-attempt notes live in the [[Flight Testing Procedure#Sim sessions|sim session log]]. The π0.5 manipulation work shares the arm lab — that's on [[Manipulation (π0.5)]].

## Working set

- Perception: James, Nick L — gate detector robustness under motion blur
- Policy: Josh — bearing-only guidance tuning, commit threshold sweep
- Infra: Andre — replay tooling, telemetry diffing between attempts`,

page({
  id: 'cad-standards', section: 'mechanical', title: 'CAD Standards (Onshape)',
  owner: 'am3644@cornell.edu', created: ago(155), updated: ago(4, 3), updatedBy: 'am3644@cornell.edu',
  tags: ['standard'],
  body: `All team CAD lives in the Onshape team workspace (decision record: Onshape over SolidWorks, 2026-02 — browser-based meant zero install pain and real branching). Ask a mechanical lead for access during [[Onboarding Checklist|onboarding]].

## Document layout

One Onshape **document per assembly**, named ${'`CUPI-<project>-<assembly>`'} (e.g. ${'`CUPI-HEX-LEG`'}). Inside:

- ${'`main`'} workspace is always buildable — no broken features on main
- Branch for experiments; merge only after a lead looks at it
- Version (snapshot) before every physical build, named ${'`build-YYYY-MM-DD`'}

## Part studios

- Origin at the assembly's natural datum (servo bore, board mount plane), axes labeled in a note
- Every dimension that mates with another part gets a **variable** (${'`#bolt_circle`'}, ${'`#servo_w`'}) — magic numbers in sketches are how rev C stops fitting rev D
- Materials assigned in Onshape so mass properties are trustworthy — the [[Scout Quadcopter]] weight budget reads straight from the model

## Exports

| Purpose | Format | Where |
| --- | --- | --- |
| Print | STL / 3MF | Attach to the part's wiki page |
| Machine | STEP + PDF drawing | Attach to the wiki page **and** the [[Machining Resources|machining request]] |
| Archive | Onshape version | Link the version, not the workspace |

page({
  id: 'part-numbering', section: 'mechanical', title: 'Part Numbering and BOM',
  owner: 'am3644@cornell.edu', created: ago(150), updated: ago(11), updatedBy: 'oa229@cornell.edu',
  tags: ['standard'],
  body: `One numbering scheme across mechanical and electrical so a BOM line, an Onshape part, and a bag on the shelf all carry the same name.

## Scheme

~~~
CUPI-<PROJ>-<SYS>-<NNN>[-rev]
       HEX    LEG   012   C
~~~

- ${'`PROJ`'}: HEX, SQD (Scout quad), MOD, AGP, ARM
- ${'`SYS`'}: LEG, FRM, PDB, SNS, HSG, HW (fasteners/COTS)
- ${'`NNN`'}: three digits, never reused; rev letters only after something physical exists

## BOM rules

- Every assembly page carries its BOM as a table with **vendor, part no., qty, unit cost, link**
- COTS parts get a CUPI-…-HW number too — "the M3 standoffs" is not a part
- Purchasing pulls from BOM tables directly — a part not on a BOM does not get ordered (see [[Budget and Purchasing]])

## Example

| Part | Number | Qty | Vendor | Unit |
| --- | --- | --- | --- | --- |
| Femur tube, carbon 12 mm | CUPI-HEX-LEG-004 | 6 | DragonPlate | $11.40 |
| MX-64 bracket rev C | CUPI-HEX-LEG-012-C | 6 | printed | — |
| M3×8 SHCS | CUPI-HEX-HW-021 | 48 | McMaster 91290A113 | $0.09 |`,
});

page({
  id: 'printing', section: 'mechanical', title: '3D Printing Guide',
  owner: 'oa229@cornell.edu', created: ago(145), updated: ago(6, 8), updatedBy: 'am3644@cornell.edu',
  body: `Three Bambu X1Cs live in the lab. Book on the paper sheet; the queue self-organizes if you write honest print times.

## Profiles that work

| Use | Material | Profile notes |
| --- | --- | --- |
| Structural (brackets, mounts) | PAHT-CF | 0.16 mm, 6 walls, 40% gyroid — dry the spool, always |
| General fit checks | PLA | Stock 0.20 mm, 3 walls |
| Compliant (feet, grommets, gripper pads) | TPU 95A | 0.20 mm, 2 walls, 20%, slow outer wall |
| Cosmetic panels | PETG | 0.20 mm, fuzzy skin on show faces |

## Rules of thumb

- Orient so layer lines run **across** bending loads, not along them. The rev A leg brackets failed at 60% load through layer adhesion — rev C prints rotated 90° and hasn't failed since ([[Hexapod Leg Design#Test results]]).
- Holes print 0.2 mm undersize: drill or ream anything that carries a shaft or bolt.
- Heat-set inserts: 260 °C tip, press slow, let it self-align. Practice on scrap first.

::: note CF filament
Carbon-filled filament needs the hardened nozzle — it's the one marked with red tape. Swapping to brass for CF will ruin the nozzle and your afternoon.

:::`,
});

page({
  id: 'leg-design', section: 'mechanical', title: 'Hexapod Leg Design',
  owner: 'am3644@cornell.edu', created: ago(100), updated: ago(2, 7), updatedBy: 'am3644@cornell.edu',
  tags: ['design-doc'],
  body: `Design record for the 3-DOF leg: geometry, load cases, materials, and what broke. Kinematic constants here are the source of truth — the gait engine imports them by name.

## Geometry

![Leg geometry drawing](att:att-leg-geom "J1 yaw at the body, J2 pitch, J3 knee. L1 68 / L2 210 / L3 160 mm.")

Link lengths were chosen so the knee servo stays under 60% stall torque through the tripod-gait envelope with a 2.5 kg body mass at 1.5× dynamic factor:

~~~
tau_knee = m_eff * g * L3 * cos(theta_ground)   # worst case at touchdown
XM430 stall = 4.1 N·m @ 12 V → design ceiling 2.5 N·m
~~~

## CAD

Live model (branch ${'`leg-rev-c`'} merged to main 2026-08-12):

https://cad.onshape.com/documents/2b7e91c44f8a0d63e5a12b90/w/9c4d2e7a1b5f8c3d6e0a4f21/e/7a1c5e9b3d6f0a2c4e8b1d35

The J3 bracket, printable — orbit it here before printing:

!file[MX-64 bracket — rev C](att:att-bracket)

## Test results

| Rev | Test | Result |
| --- | --- | --- |
| A | Static load to 2× body mass | **Failed** — bracket delaminated at 60%, layer orientation |
| B | Same | Passed static, cracked in drop test (8 mm fillet added) |
| C | Static + 30 cm drop, 500-cycle gait rig | **Passed** — adopted 2026-08-12 |

## Open

- [ ] TPU foot wear rate on concrete — inspect after every 10 field hours
- [ ] J2 bearing seat reams 0.05 mm loose on printer #2 — tolerance study pending`,

page({
  id: 'pcb-checklist', section: 'electrical', title: 'PCB Design Checklist',
  owner: 'mr977@cornell.edu', created: ago(147), updated: ago(8, 2), updatedBy: 'js2801@cornell.edu',
  tags: ['standard', 'checklist'],
  body: `Run this top to bottom before every fab order. Copy the checklist into the board's page, check items there, and link the two reviewers. History shows who checked what — that's the point.

## Schematic

- [ ] Every net named; no ${'`NetR12_1`'} survivors
- [ ] Decoupling per datasheet, placed logically near each IC in the sheet
- [ ] Connector pinouts match [[Wiring and Connectors]] — check pin 1 convention **twice**
- [ ] Reverse-polarity and overcurrent protection at every external power entry
- [ ] Test points on every rail and every debug-relevant signal

## Layout

- [ ] Ground pours stitched; return paths traced by eye for every high-current loop
- [ ] Buck converters follow the datasheet layout — hot loop minimized before anything else is placed
- [ ] Mounting holes grounded through a ferrite where chassis meets logic ground
- [ ] Silk: board name, rev, date, and a blank "bring-up by ___" box
- [ ] Courtyard clearances pass at 0.15 mm; no silk over pads

## Before upload

- [ ] DRC clean at the fab's real rule set (JLC 6/6 unless justified)
- [ ] 3D export checked against the enclosure in Onshape ([[CAD Standards (Onshape)]])
- [ ] Release created in Altium 365, fab zip attached to the board's wiki page

::: tip Reviews catch what you stopped seeing
Rev B of the sensor board shipped with UART TX→TX because the reviewer "knew it was fine." Both reviewers walk the checklist independently now.

:::`,
});

page({
  id: 'wiring', section: 'electrical', title: 'Wiring and Connectors',
  owner: 'js2801@cornell.edu', created: ago(140), updated: ago(13), updatedBy: 'js2801@cornell.edu',
  tags: ['standard'],
  body: `One connector standard across every platform so harnesses interchange and nobody plugs 22 V into a 5 V sensor again (we did this once; the magic smoke was expensive).

## The standard

| Signal class | Connector | Wire |
| --- | --- | --- |
| Battery / high current | XT60 (XT30 under 10 A) | 14–16 AWG silicone |
| Servo bus | JST-PH 3-pin | 20 AWG |
| Sensor bus (CAN + UART) | **JST-GH 6-pin** | 26 AWG twisted for CAN pair |
| Debug | TC2030 tag-connect | — |

## Sensor bus pinout

![JST-GH sensor bus pinout](att:att-pinout "Pin 1 nearest the chamfer. This exact drawing is silk-screened on every board that carries the bus.")

Keyed housings make reversal impossible **only if** every board follows this pin order — that's why [[PCB Design Checklist]] makes you check it twice.

## Crimping

- PA-09 for JST; the good crimper lives in the red toolbox, comes back to the red toolbox
- Every crimp gets a pull test. Every harness gets continuity-buzzed end to end before first power.
- Label both ends with source → destination (e.g. ${'`P3: PDB → J3 servo`'}): heat-shrink labels, not tape flags`,
});

page({
  id: 'bringup', section: 'electrical', title: 'Board Bring-Up Log',
  owner: 'mr977@cornell.edu', created: ago(90), updated: ago(4, 6), updatedBy: 'mr977@cornell.edu',
  tags: ['checklist'],
  body: `Bring-up is a ritual, not a vibe. Copy this sequence into the board's page per unit; a board without a completed log doesn't get integrated.

## Sequence

1. **Visual** under the microscope: bridges, tombstones, missing parts, solder balls under QFNs
2. **Shorts**: continuity every rail → GND before any power
3. **First power**: bench supply, current limit 50 mA above expected idle, **no loads connected**
4. **Rails**: regulation + ripple scope check at each test point (this is why the [[PCB Design Checklist]] demands test points)
5. **Comms**: enumerate every bus — SWD, then CAN/UART/I²C per the [[Wiring and Connectors]] pinout
6. **Load**: rail-by-rail to 120% of rated, watch thermals
7. **Firmware smoke test**: blink + watchdog + telemetry heartbeat
8. Fill the silk-screen "bring-up by ___" box with initials and date. Yes, with a paint pen.

## Template row

~~~
Unit #2 · 2026-08-14 · MR
1 visual: ok  2 shorts: ok  3 first power: 31 mA idle (exp 28)
4 rails: ok, 5V ripple 22 mV  5 comms: ok  6 load: ok  7 fw: ok
~~~

Recent example with real data: [[Power Distribution Board#Bring-up (rev D)]].`,
});

page({
  id: 'perception', section: 'software', title: 'ROS 2 Perception Stack',
  owner: 'jc3391@cornell.edu', created: ago(125), updated: ago(1, 9), updatedBy: 'jl3105@cornell.edu',
  body: `Shared perception layer for [[Hexapod]], [[Scout Quadcopter]] and the [[Modovolo Payload]]: LiDAR + camera in, registered clouds, obstacle grid, and (new) the cross-robot pose graph out.

## Topology

~~~
lidar_driver ─┐
              ├─ registration ── local_map ── nav_grid
cam_driver  ──┘        │
                  pose_graph ⇄ espnow_bridge ⇄ [other robot]
~~~

- Runs on Jetson Orin Nano (Modovolo, hexapod) and Orin NX (bench)
- ${'`espnow_bridge`'} exchanges pose-graph deltas at 5 Hz over the ESP-NOW link — the quad scouts, the hexapod refines ground truth where it walks
- All parameters in ${'`perception/config/*.yaml`'}, one file per platform. **No literals in launch files** — the VQ2 rules change was a one-file diff because of this.

## Latency budget (Orin Nano, 2026-08)

| Stage | Budget | Measured |
| --- | --- | --- |
| LiDAR decode | 8 ms | 6.2 ms |
| Registration | 22 ms | 19.8 ms |
| Grid update | 10 ms | 7.1 ms |
| **End to end** | **45 ms** | **38.4 ms** |

Regression gate: CI replays the ${'`bench-loop`'} bag and fails if end-to-end exceeds budget. Don't merge around it — fix the regression.`,
});

page({
  id: 'flight-testing', section: 'software', title: 'Flight Testing Procedure',
  owner: 'nl733@cornell.edu', created: ago(115), updated: ago(2, 1), updatedBy: 'nl733@cornell.edu',
  tags: ['checklist'],
  body: `Applies to every powered flight, indoor or field. The procedure exists because of specific incidents; each rule has a story. Ask about them.

## Roles

Two people minimum: **pilot** (sticks or kill switch, nothing else) and **test director** (checklist, logging, airspace). Observers stand behind the net.

## Preflight

- [ ] Battery charged + logged, pack number recorded ([[Lab Access and Safety]] LiPo rules)
- [ ] Props inspected — any chip or crack, replace, no debate
- [ ] Failsafe verified **on the bench, props off**: kill switch drops motors in < 200 ms
- [ ] Test card written: what changed since last flight, what we're measuring, abort criteria
- [ ] Telemetry link green; logging armed (bags auto-named from the test card)

## During

- One variable per flight. If the test card says "new gate detector," the tune stays frozen.
- Test director calls out battery voltage every 30 s under 15.2 V.
- **Anyone** can call abort. The word is "LAND," said loud, once.

## After

- [ ] Bag file + test card + outcome pushed to ${'`agp/logs`'} or platform repo before the battery goes back on the charger
- [ ] Anomalies get a line on the platform page the same day

## Sim sessions

Sim attempts for [[AI Grand Prix]] follow the same card discipline — the replay tooling diffs telemetry between attempts, which only works if every run is labeled.`,
});

  { id: 'design', name: 'Design doc', desc: 'Intent, CAD/EDA links, tests', body: `One paragraph: what this is and the requirement it answers.\n\n## Design\n\nGeometry / schematic intent. Paste the Onshape or Altium 365 link on its own line:\n\n\n## Test results\n\n| Rev | Test | Result |\n| --- | --- | --- |\n|  |  |  |\n\n## Open\n\n- [ ] \n` },
  { id: 'decision', name: 'Decision record', desc: 'Context, options, outcome', body: `**Status:** Proposed · **Deciders:** · **Date:** \n\n## Context\n\nWhat forced a decision.\n\n## Options considered\n\n1. **Option A** — pros / cons\n2. **Option B** — pros / cons\n\n## Decision\n\nWhat we chose and the one reason that mattered most.\n\n## Consequences\n\nWhat gets easier, what gets harder.\n` },

const SECTIONS = [
  { id: 'getting-started', name: 'Getting Started' },
  { id: 'projects', name: 'Projects' },
  { id: 'mechanical', name: 'Mechanical' },
  { id: 'electrical', name: 'Electrical' },
  { id: 'software', name: 'Software' },
